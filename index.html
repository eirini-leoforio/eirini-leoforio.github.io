<title>Στάση Δ για Ειρήνη</title>
<meta name="description" content="Η εφαρμογή μάθησης για την Ειρήνη: θεωρία για το δίπλωμα λεωφορείου (Δ).">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@600;800&family=Fira+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column, bus destination-sign hero, fixed bottom tab bar */
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --sunk:#E3E9F1; --ink:#0F1E36; --muted:#5A6A82; --line:#D3DCE8;
  --blue:#0B4FA8; --blue-ink:#FFFFFF; --amber:#F2A900; --sign:#0E1A2E; --sign-ink:#FFB81C;
  --ok:#17894C; --ok-soft:#DDF3E6; --bad:#C8352F; --bad-soft:#FBE2E0;
  --display:"Fira Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --text:"Fira Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1220; --surface:#131E33; --sunk:#0E1729; --ink:#E6EDF8; --muted:#93A3BC; --line:#24324D;
  --blue:#4F93FF; --blue-ink:#06122A; --amber:#FFC23D; --sign:#050B16; --sign-ink:#FFC23D;
  --ok:#3DCB7E; --ok-soft:#10301F; --bad:#FF6B63; --bad-soft:#3A1715; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1220; --surface:#131E33; --sunk:#0E1729; --ink:#E6EDF8; --muted:#93A3BC; --line:#24324D;
  --blue:#4F93FF; --blue-ink:#06122A; --amber:#FFC23D; --sign:#050B16; --sign-ink:#FFC23D;
  --ok:#3DCB7E; --ok-soft:#10301F; --bad:#FF6B63; --bad-soft:#3A1715; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h2{font-size:1.45rem} h3{font-size:1.1rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:800;font-size:1.3rem;display:flex;align-items:center;gap:8px}
.brand .d{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;background:var(--blue);color:var(--blue-ink);font-size:1.1rem}
.sync{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--ok)} .sync.err i{background:var(--bad)}
.note{background:var(--sunk);border:1px dashed var(--line);border-radius:var(--r);padding:10px 14px;font-size:.85rem;color:var(--muted)}

/* destination sign */
.sign{background:var(--sign);border-radius:16px;padding:18px 18px 16px;color:var(--sign-ink);position:relative;overflow:hidden;box-shadow:inset 0 0 0 3px #1E2B44}
.sign::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.55) 1px,transparent 1.4px);background-size:4px 4px;pointer-events:none}
.sign .route{display:flex;justify-content:space-between;font-family:var(--display);font-weight:600;letter-spacing:.14em;font-size:.78rem;opacity:.75}
.sign .big{font-family:var(--display);font-weight:800;font-size:2.4rem;letter-spacing:.04em;text-shadow:0 0 12px rgba(255,184,28,.45);margin-top:6px;line-height:1.05}
.sign .sub{font-size:.9rem;color:#E7EDF7;opacity:.85;margin-top:8px;position:relative;z-index:1}
.flame{width:30px;height:30px;vertical-align:-3px;margin-right:6px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.goal{display:flex;gap:16px;align-items:center}
.ring{flex:none}
.ring circle{fill:none;stroke-width:9}
.ring .track{stroke:var(--sunk)} .ring .val{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring text{fill:var(--ink);font-family:var(--display);font-weight:800;font-size:20px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.xpbar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;background:var(--amber)}

.btn{border:0;border-radius:12px;padding:15px 18px;font-weight:700;font-size:1.02rem;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--blue);color:var(--blue-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--blue) 60%,#000)}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line)}
.btn.amber{background:var(--amber);color:#1A1200;box-shadow:0 4px 0 color-mix(in srgb,var(--amber) 60%,#000)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px} .row>*{flex:1;min-width:0}
.list{display:flex;flex-direction:column;gap:10px}
.tile{display:flex;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;width:100%}
.tile .ic{flex:none;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);font-family:var(--display);font-weight:800;color:var(--blue)}
.tile .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.tile .tx b{font-weight:600}
.tile .tx span{font-size:.85rem;color:var(--muted)}
.pill{font-size:.75rem;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.ok{background:var(--ok-soft);color:var(--ok)}

/* quiz */
.qhead{display:flex;align-items:center;gap:12px}
.qhead .x{border:0;background:none;font-size:1.6rem;line-height:1;padding:4px 8px;color:var(--muted)}
.prog{flex:1;height:12px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .35s}
.combo{font-family:var(--display);font-weight:800;color:var(--amber);min-width:44px;text-align:right}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.boxes{display:inline-flex;gap:3px} .boxes i{width:9px;height:9px;border-radius:2px;background:var(--line)} .boxes i.on{background:var(--ok)}
.sign-img{display:block;width:160px;max-width:60%;height:auto;margin:0 auto;border-radius:10px;background:#fff;padding:6px}
.qtext{font-size:1.25rem;font-weight:600;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:13px 14px;width:100%;box-shadow:0 3px 0 var(--line)}
.opt .k{flex:none;width:28px;height:28px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.9rem;color:var(--muted)}
.opt .t{flex:1;min-width:0}
.opt.sel{border-color:var(--blue);box-shadow:0 3px 0 var(--blue)} .opt.sel .k{border-color:var(--blue);color:var(--blue)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 3px 0 var(--ok)} .opt.right .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)} .opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.fb{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;animation:up .25s ease-out}
.fb.ok{background:var(--ok-soft)} .fb.bad{background:var(--bad-soft)}
.fb h3{font-size:1.25rem} .fb.ok h3{color:var(--ok)} .fb.bad h3{color:var(--bad)}
.why{background:var(--surface);border-radius:10px;padding:12px 14px;font-size:.95rem;display:flex;flex-direction:column;gap:6px}
.tipbox{background:var(--sign);color:var(--sign-ink);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-family:var(--display);font-size:1.15rem}
.tipbox .ai{color:#C9D3E3}
.cheer{background:var(--amber);color:#1A1200;font-weight:700;border-radius:10px;padding:10px 14px;animation:up .3s}
.ai{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@keyframes up{from{transform:translateY(10px);opacity:.3}to{transform:none;opacity:1}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.timer{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;font-size:1.1rem}
.timer.low{color:var(--bad)}

/* progress */
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.stack i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.catrow{display:flex;flex-direction:column;gap:6px}
.catrow .top{display:flex;justify-content:space-between;gap:10px;font-size:.92rem}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--text)}
.chart .bar{fill:var(--blue)} .chart .bar.today{fill:var(--amber)} .chart .base{stroke:var(--line)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface)}
.badge .m{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--sunk);color:var(--muted)}
.badge.got .m{background:var(--amber);color:#1A1200}
.badge:not(.got){opacity:.6}
.badge b{font-size:.85rem;display:block;line-height:1.2} .badge span{font-size:.75rem;color:var(--muted)}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.75rem;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--blue)}
body.focus nav.tabs{display:none}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.9rem;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:up .25s;max-width:calc(100% - 32px)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:15}
.result{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.result .score{font-family:var(--display);font-weight:800;font-size:3.4rem;line-height:1}
.danger{color:var(--bad);background:none;border:0;font-weight:600;padding:8px 0;text-align:left}
/* dedication + language */
.brand .logo{display:inline-block;width:34px;height:34px;flex:none}
.brand .logo svg,.dedi .pic svg{width:100%;height:100%;display:block}
.seg.lang{flex:none;padding:2px}
.seg.lang button{padding:5px 9px;font-size:.8rem}
.dedi{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--amber) 22%,var(--surface)),var(--surface));border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.dedi .pic{flex:none;width:76px;height:76px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.18))}
.dedi div{display:flex;flex-direction:column;gap:2px;min-width:0}
.dedi b{font-family:var(--display);font-size:1.2rem;line-height:1.2}
.dedi span{font-size:.9rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<canvas id="fx"></canvas>
<main class="wrap" id="app"></main>
<nav class="tabs" id="tabs"><div class="in">
  <button data-v="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Αρχική</span></button>
  <button data-v="learn"><svg viewBox="0 0 24 24"><path d="M4 5h11a3 3 0 0 1 3 3v12H7a3 3 0 0 1-3-3z"/><path d="M8 9h6M8 13h6"/></svg><span>Μάθηση</span></button>
  <button data-v="exam"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg><span>Εξέταση</span></button>
  <button data-v="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Πρόοδος</span></button>
</div></nav>

const Q=[{"id":"s01","cat":"sign","n":1,"q":"Ποια είναι η σημασία του σήματος αυτού;","o":["Αποκλειστική διέλευση λεωφορείων ή τρόλεϊ.","Τέλος αποκλειστικής διελεύσεως λεωφορείων ή τρόλεϊ.","Απαγορεύεται η διέλευση λεωφορείων ή τρόλεϊ."],"a":1,"ex":"Μπλε κύκλος = υποχρέωση (εδώ: λωρίδα μόνο για λεωφορεία). Η κόκκινη διαγώνια γραμμή πάνω σε μπλε σήμα σημαίνει πάντα «τέλος». Άρα: τέλος της αποκλειστικής λωρίδας λεωφορείων.","tip":"Μπλε + κόκκινη γραμμή = ΤΕΛΟΣ","img":"s01"},{"id":"s02","cat":"sign","n":2,"q":"Ποια είναι η σημασία του σήματος αυτού;","o":["Απαγορεύεται η είσοδος στα επιβατηγά αυτοκίνητα.","Απαγορεύεται η είσοδος σε όλα τα οχήματα εκτός επιβατηγών.","Απαγορεύεται η είσοδος σε μηχανοκίνητα οχήματα εκτός των διτρόχων μοτοσυκλετών."],"a":2,"ex":"Κόκκινος κύκλος = απαγόρευση. Το αυτοκίνητο από μπροστά συμβολίζει όλα τα μηχανοκίνητα οχήματα (και λεωφορεία). Εξαίρεση είναι μόνο οι δίτροχες μοτοσυκλέτες.","tip":"Κόκκινος κύκλος με αυτοκίνητο: κανένα μηχανοκίνητο, εκτός μηχανών","img":"s02"},{"id":"s03","cat":"sign","n":3,"q":"Ποια είναι η σημασία του σήματος αυτού;","o":["Προτεραιότητα έναντι της επερχόμενης κυκλοφορίας.","Προτεραιότητα της αντιθέτως ερχόμενης κυκλοφορίας λόγω στενότητας οδοστρώματος.","Προαναγγελία οδού διπλής κυκλοφορίας."],"a":1,"ex":"Ο δρόμος στενεύει και δεν χωράνε δύο οχήματα. Στο στρογγυλό σήμα (απαγόρευση) το κόκκινο βέλος είναι το δικό σου: πρέπει να περιμένεις και να αφήσεις πρώτα τον αντίθετα ερχόμενο.","tip":"Στρογγυλό = εσύ περιμένεις. Τετράγωνο μπλε = περνάς εσύ πρώτος","img":"s03"},{"id":"s04","cat":"sign","n":4,"q":"Ποια είναι η σημασία του σήματος αυτού;","o":["Προτεραιότητα έναντι της επερχόμενης κυκλοφορίας.","Προτεραιότητα της αντιθέτως ερχόμενης κυκλοφορίας.","Προαναγγελία οδού διπλής κυκλοφορίας."],"a":0,"ex":"Είναι το «αντίθετο» του προηγούμενου σήματος. Μπλε τετράγωνο = πληροφορία. Το λευκό βέλος (εσύ) είναι μεγάλο, το κόκκινο (ο απέναντι) μικρό: στο στενό σημείο περνάς εσύ πρώτος.","tip":"Μπλε τετράγωνο = εσύ έχεις προτεραιότητα","img":"s04"},{"id":"s05","cat":"sign","n":5,"q":"Ποια είναι η σημασία του σήματος αυτού;","o":["Προτεραιότητα έναντι της επερχόμενης κυκλοφορίας.","Προτεραιότητα της αντιθέτως ερχόμενης κυκλοφορίας.","Προαναγγελία οδού διπλής κυκλοφορίας."],"a":2,"ex":"Τρίγωνο = προειδοποίηση κινδύνου. Τα δύο βέλη σε αντίθετη κατεύθυνση σε προειδοποιούν ότι μπροστά ο δρόμος γίνεται διπλής κατεύθυνσης: θα έρχονται οχήματα από απέναντι.","tip":"Τρίγωνο με δύο βέλη = έρχεται κυκλοφορία από απέναντι","img":"s05"},{"id":"s06","cat":"sign","n":6,"q":"Ποια είναι η σημασία του σήματος αυτού;","o":["Οδός ταχείας κυκλοφορίας.","Αυτοκινητόδρομος.","Επιτρέπεται η είσοδος στα επιβατηγά αυτοκίνητα."],"a":0,"ex":"Μπλε τετράγωνο με λευκό αυτοκίνητο = οδός ταχείας κυκλοφορίας. Μην το μπερδεύεις με τον αυτοκινητόδρομο, που έχει πράσινο σήμα με γέφυρα.","tip":"Μπλε με αυτοκίνητο = ταχεία. Πράσινο με γέφυρα = αυτοκινητόδρομος","img":"s06"},{"id":"s07","cat":"sign","n":7,"q":"Ποια είναι η σημασία του σήματος αυτού;","o":["Απαγορεύεται η είσοδος στα επιβατηγά αυτοκίνητα.","Τέλος αυτοκινητοδρόμου.","Τέλος οδού ταχείας κυκλοφορίας."],"a":2,"ex":"Είναι το σήμα της οδού ταχείας κυκλοφορίας (μπλε με αυτοκίνητο) με κόκκινη διαγώνια γραμμή. Η γραμμή σημαίνει «τέλος».","tip":"Μπλε αυτοκίνητο + γραμμή = τέλος ταχείας","img":"s07"},{"id":"s08","cat":"sign","n":8,"q":"Ποια είναι η σημασία του σήματος αυτού;","o":["Οδός ταχείας κυκλοφορίας.","Αυτοκινητόδρομος.","Αδιέξοδος."],"a":1,"ex":"Πράσινο σήμα με δρόμο και γέφυρα από πάνω = αυτοκινητόδρομος. Στην Ελλάδα οι πινακίδες του αυτοκινητοδρόμου είναι πράσινες.","tip":"Πράσινο + γέφυρα = αυτοκινητόδρομος","img":"s08"},{"id":"s09","cat":"sign","n":9,"q":"Ποια είναι η σημασία του σήματος αυτού;","o":["Τέλος οδού ταχείας κυκλοφορίας.","Τέλος αδιεξόδου.","Τέλος αυτοκινητοδρόμου."],"a":2,"ex":"Το πράσινο σήμα του αυτοκινητοδρόμου με κόκκινη διαγώνια γραμμή σημαίνει ότι ο αυτοκινητόδρομος τελειώνει.","tip":"Πράσινο + γραμμή = τέλος αυτοκινητοδρόμου","img":"s09"}, λά «κουβαλάει») επιτρέπεται να έχει έως 10.000 kg. Ο κινητήριος άξονας επιτρέπεται να έχει περισσότερο.","tip":"Απλός άξονας = 10 τόνοι"},{"id":"w20","cat":"weight","n":20,"q":"Το μέγιστο βάρος ενός τριαξονικού λεωφορείου, που εκτελεί διεθνείς μεταφορές και του οποίου κάθε κινητήριος άξονας είναι εξοπλισμένος με διπλά ελαστικά και το μέγιστο βάρος σε κάθε άξονα δεν υπερβαίνει τα 9.500 kg, είναι:","o":["25.000 kg.","26.000 kg.","28.000 kg."],"a":1,"ex":"Με διπλά ελαστικά το βάρος μοιράζεται καλύτερα στον δρόμο. Γι' αυτό επιτρέπεται 1 τόνος παραπάνω από το απλό τριαξονικό: 26.000 kg αντί για 25.000 kg.","tip":"Διπλά λάστιχα = +1 τόνος (26)"},{"id":"w21","cat":"weight","n":21,"q":"Η μέγιστη επιτρεπόμενη φόρτιση του οδοστρώματος από ένα ζεύγος μη διευθυντηρίων αξόνων με απόσταση μεταξύ τους μεγαλύτερη από ένα (1) μέτρο και μικρότερη ή ίση με δύο (2) μέτρα, για εθνικές μεταφορές, είναι:","o":["17.000 kg.","20.000 kg.","22.000 kg."],"a":1,"ex":"Δύο άξονες πολύ κοντά ο ένας στον άλλο (1–2 m) λειτουργούν σαν ζευγάρι. Σύμφωνα με το βιβλίο, μαζί μπορούν να πιέζουν τον δρόμο με έως 20.000 kg για εθνικές μεταφορές.","tip":"Ζευγάρι αξόνων = 20 τόνοι"},{"id":"w25","cat":"weight","n":25,"q":"Το μέγιστο επιτρεπόμενο βάρος του κινητήριου άξονα ενός διαξονικού λεωφορείου, που εκτελεί εθνικές μεταφορές, είναι:","o":["11.500 kg.","12.000 kg.","13.000 kg."],"a":2,"ex":"Ο κινητήριος άξονας είναι αυτός που παίρνει δύναμη από τη μηχανή (συνήθως ο πίσω). Για εθνικές μεταφορές επιτρέπονται έως 13.000 kg.","tip":"Κινητήριος, εθνικές = 13 τόνοι"},{"id":"w26","cat":"weight","n":26,"q":"Το μέγιστο επιτρεπόμενο βάρος του κινητήριου άξονα ενός διαξονικού λεωφορείου, που εκτελεί διεθνείς μεταφορές, είναι:","o":["12.000 kg.","11.500 kg.","13.000 kg."],"a":1,"ex":"Για διεθνείς μεταφορές ισχύει το ευρωπαϊκό όριο, που είναι χαμηλότερο: 11.500 kg για τον κινητήριο άξονα.","tip":"Κινητήριος, διεθνείς = 11,5 τόνοι"},{"id":"k04","cat":"drive","n":4,"q":"Όταν ένα σχολικό λεωφορείο σταματήσει για την επιβίβαση ή αποβίβαση μαθητών, με ποια βασική ενέργεια ενημερώνονται οι οδηγοί των άλλων οχημάτων;","o":["Με αναμμένο το δεξί φλας.","Με αναμμένα τα φώτα έκτακτης ανάγκης (αλάρμ)."],"a":1,"ex":"Τα αλάρμ (όλα τα φλας μαζί) λένε στους άλλους «προσοχή, κάτι συμβαίνει εδώ». Το δεξί φλας μόνο σημαίνει απλώς ότι στρίβεις ή σταματάς στην άκρη.","tip":"Παιδιά ανεβαίνουν/κατεβαίνουν = αλάρμ"},{"id":"k05","cat":"drive","n":5,"q":"Αν ένα σχολικό λεωφορείο κινείται σε οδόστρωμα με δύο λωρίδες κυκλοφορίας και έχει σταματήσει για την επιβίβαση ή αποβίβαση μαθητών, τι πρέπει να κάνουν οι οδηγοί των κινουμένων στην ίδια κατεύθυνση οχημάτων;","o":["Να μειώσουν ταχύτητα και να προσπεράσουν με προσοχή το σχολικό λεωφορείο.","Να κινούνται με ταχύτητα μέχρι το ανώτερο όριο (50 km/h) και να προσπεράσουν το σχολικό λεωφορείο με προσοχή.","Να σταματήσουν και να περιμένουν να επιβιβασθούν ή να αποβιβασθούν όλοι οι μαθητές και, αφού ξεκινήσει το σχολικό λεωφορείο, να συνεχίσουν την πορεία τους."],"a":2,"ex":"Ένα παιδί μπορεί να πεταχτεί ξαφνικά μπροστά από το λεωφορείο. Γι' αυτό τα οχήματα πίσω σταματούν και περιμένουν μέχρι να ξεκινήσει το σχολικό. Δεν προσπερνούν.","tip":"Σχολικό σταματημένο = σταματάς κι εσύ"},{"id":"k06","cat":"drive","n":6,"q":"Για την αποφυγή ενοχλητικών θορύβων κατά την κυκλοφορία πρέπει μεταξύ των άλλων:","o":["Να αποφεύγετε τα απότομα φρεναρίσματα, εάν δεν είναι απολύτως απαραίτητα.","Να χρησιμοποιείτε το ακουστικό σήμα (κόρνα) ως προειδοποίηση μόνο στην περίπτωση μακριάς αναμονής.","Να χρησιμοποιείτε την κόρνα για να ειδοποιήσετε έναν άλλο οδηγό, μόνο εάν έπραξε ένα σφάλμα σε βάρος σας."],"a":0,"ex":"Τα απότομα φρεναρίσματα κάνουν θόρυβο (τσιρίδες ελαστικών). Η κόρνα δεν χρησιμοποιείται ούτε όταν περιμένεις ούτε για να «τιμωρήσεις» άλλον οδηγό, μόνο για να αποφύγεις κίνδυνο.","tip":"Ήσυχη οδήγηση = όχι απότομα φρένα"},{"id":"k08","cat":"drive","n":8,"q":"Η πρόσφυση των τροχών επάνω στο οδόστρωμα μειώνεται από:","o":["Την ύπαρξη λαδιού ή νερού στο οδόστρωμα.","Τη χρήση μικρής σχέσεως μεταδόσεως στο κιβώτιο.","Τη συχνή χρήση των φρένων."],"a":0,"ex":"Πρόσφυση είναι το «κράτημα» των ελαστικών στον δρόμο. Το λάδι και το νερό κάνουν τον δρόμο γλιστερό, άρα τα ελαστικά κρατάνε λιγότερο.","tip":"Λάδι ή νερό = γλιστράει"},{"id":"k09","cat":"drive","n":9,"q":"Η πρόσφυση των τροχών επάνω στο δρόμο μειώνεται από:","o":["Την παρουσία φύλλων επάνω στο οδόστρωμα.","Τον αυξημένο αριθμό στροφών του κινητήρα.","Τη χαμηλή ταχύτητα του οχήματος."],"a":0,"ex":"Τα φύλλα, ειδικά όταν είναι βρεγμένα, σχηματίζουν γλιστερό στρώμα ανάμεσα στο ελαστικό και τον δρόμο. Οι στροφές του κινητήρα και η χαμηλή ταχύτητα δεν μειώνουν το κράτημα.","tip":"Φύλλα στον δρόμο = σαν πάγος"},{"id":"k10","cat":"drive","n":10,"q":"Το φαινόμενο της υδρολισθήσεως έχει ως αποτέλεσμα:","o":["Τη φθορά των ελαστικών.","Την απώλεια του ελέγχου του συστήματος διευθύνσεως.","Τη μείωση της ιπποδυνάμεως του κινητήρα."],"a":1,"ex":"Υδρολίσθηση: με μεγάλη ταχύτητα σε πολύ νερό, το ελαστικό «επιπλέει» πάνω στο νερό και δεν ακουμπά τον δρόμο. Τότε το τιμόνι δεν στρίβει το όχημα.","tip":"Υδρο-λίσθηση = το τιμόνι δεν ακούει"},{"id":"k11","cat":"drive","n":11,"q":"Έξω από τα αστικά κέντρα οι οδηγοί πρέπει να σβήνουν τα φώτα πορείας και να χρησιμοποιούν τα φώτα διασταυρώσεως ή ομίχλης:","o":["Εάν υπάρχει κίνδυνος να θαμπώνουν τους οδηγούς των άλλων οχημάτων, που έρχονται από την αντίθετη κατεύθυνση.","Μισή ώρα πριν από την ανατολή του ηλίου.","Όταν κατά την πορεία δεν τηρούν την απόσταση ασφαλείας."],"a":0,"ex":"Τα φώτα πορείας (μεγάλα) τυφλώνουν τον οδηγό που έρχεται απέναντι. Όταν πλησιάζει όχημα, χαμηλώνεις στα φώτα διασταυρώσεως.","tip":"Έρχεται κάποιος απέναντι = χαμηλά φώτα"},{"id":"k12","cat":"drive","n":12,"q":"Η ελάχιστη συνολική απόσταση ακινητοποιήσεως ενός οχήματος:","o":["Δεν εξαρτάται από την κατάσταση των ελαστικών.","Μικραίνει, εάν το πέλμα των ελαστικών είναι φθαρμένο.","Μικραίνει, εάν αυξηθεί η ετοιμότητα του οδηγού."],"a":2,"ex":"Η απόσταση για να σταματήσεις = απόσταση αντίδρασης + απόσταση φρεναρίσματος. Αν ο οδηγός είναι έτοιμος και προσεκτικός, αντιδρά πιο γρήγορα, άρα σταματά πιο νωρίς. Φθαρμένα ελαστικά την κάνουν μεγαλύτερη.","tip":"Προσεκτικός οδηγός = σταματά πιο γρήγορα"},{"id":"k15","cat":"drive","n":15,"q":"Η επιβράδυνση, που επιτυγχάνεται σε ένα όχημα στο δρόμο κατά την πέδηση, επηρεάζεται από:","o":["Το είδος και την κατάσταση του οδοστρώματος.","Την εξωτερική θερμοκρασία.","Την ατμοσφαιρική πίεση."],"a":0,"ex":"Πόσο γρήγορα κόβει ταχύτητα το όχημα εξαρτάται από το πόσο κρατάνε τα ελαστικά. Σε στεγνή άσφαλτο κρατάνε καλά, σε χαλίκι ή βρεγμένο δρόμο λιγότερο.","tip":"Φρενάρισμα = εξαρτάται από τον δρόμο"},{"id":"k16","cat":"drive","n":16,"q":"Κατά την πέδηση ενός οχήματος, με κανονικές συνθήκες, από τι κυρίως εξαρτάται η απόσταση πεδήσεως;","o":["Από την ταχύτητα με την οποία κινείται το όχημα.","Από το είδος του συστήματος πεδήσεως.","Από τη δύναμη, με την οποία πιέζεται ο ποδομοχλός των φρένων."],"a":0,"ex":"Η ταχύτητα είναι το πιο σημαντικό. Αν διπλασιάσεις την ταχύτητα, η απόσταση φρεναρίσματος γίνεται περίπου τετραπλάσια.","tip":"Διπλή ταχύτητα = τετραπλάσιο φρενάρισμα"},{"id":"k18","cat":"drive","n":18,"q":"Όταν ένα όχημα πραγματοποιεί στροφή αριστερά, ποιος τροχός τρέχει περισσότερο:","o":["Ο αριστερός.","Ο δεξιός.","Και οι δύο το ίδιο."],"a":1,"ex":"Στη στροφή αριστερά ο δεξιός τροχός είναι στο εξωτερικό μέρος της καμπύλης. Ο έξω κύκλος είναι μεγαλύτερος, άρα ο δεξιός τροχός διανύει μεγαλύτερη απόσταση.","tip":"Ο τροχός απ' έξω τρέχει περισσότερο"},{"id":"k19","cat":"drive","n":19,"q":"Όταν ένα αυτοκίνητο κινείται πάνω σε στροφή, ποιοι τροχοί διαγράφουν μεγαλύτερη τροχιά:","o":["Οι εξωτερικοί τροχοί.","Οι εσωτερικοί τροχοί.","Οι οπίσθιοι τροχοί."],"a":0,"ex":"Όπως στον στίβο: ο αθλητής στον εξωτερικό διάδρομο τρέχει περισσότερο. Οι εξωτερικοί τροχοί κάνουν τον μεγαλύτερο κύκλο.","tip":"Εξωτερικός κύκλος = μεγαλύτερος"},{"id":"k21","cat":"drive","n":21,"q":"Οι αντιολισθητικές αλυσίδες τοποθετούνται:","o":["Στους τροχούς του διευθυντήριου άξονα.","Στον έναν τροχό του διευθυντήριου άξονα και στον αντιδιαμετρικό αυτού κινητήριο άξονα.","Στους τροχούς του κινητήριου άξονα."],"a":2,"ex":"Οι αλυσίδες βοηθούν τους τροχούς που σπρώχνουν το όχημα να μη σπινάρουν στο χιόνι. Αυτοί είναι οι τροχοί του κινητήριου άξονα.","tip":"Αλυσίδες εκεί που «σπρώχνει» η μηχανή"},{"id":"k22","cat":"drive","n":22,"q":"Εάν δεν υπάρχει σε όλους τους τροχούς η ίδια επενέργεια πεδήσεως, δημιουργείται κίνδυνος για την κυκλοφορία του οχήματος;","o":["Μόνον όταν ο δρόμος έχει στροφές.","Μόνον όταν ο δρόμος είναι ολισθηρός.","Πάντοτε, γιατί σε περίπτωση πεδήσεως το όχημα παρεκκλίνει της οδού."],"a":2,"ex":"Αν τα φρένα της μιας πλευράς πιάνουν πιο δυνατά, το όχημα τραβάει προς εκείνη την πλευρά όταν φρενάρεις. Αυτό συμβαίνει πάντα, ακόμα και σε ευθεία.","tip":"Άνισα φρένα = το όχημα τραβάει στο πλάι"},{"id":"k23","cat":"drive","n":23,"q":"Γιατί δεν επιτρέπεται να κινείστε με σβησμένη τη μηχανή, ιδιαίτερα μάλιστα όταν το όχημά μας είναι εφοδιασμένο με αερόφρενα:","o":["Διότι το όχημα μένει ακυβέρνητο.","Διότι από τη συνεχή χρήση του συστήματος πεδήσεως προκαλείτε γρήγορη φθορά στο συμπλέκτη.","Διότι από τη συνεχή χρήση του συστήματος πεδήσεως υπάρχει κίνδυνος να μείνετε χωρίς φρένα."],"a":2,"ex":"Τα αερόφρενα δουλεύουν με πεπιεσμένο αέρα που τον γεμίζει ο συμπιεστής της μηχανής. Με σβηστή μηχανή ο αέρας δεν ξαναγεμίζει. Κάθε φρενάρισμα τον αδειάζει και στο τέλος μένεις χωρίς φρένα.","tip":"Σβηστή μηχανή = ο αέρας των φρένων τελειώνει"},{"id":"k24","cat":"drive","n":24,"q":"Πώς μπορείτε να περάσετε ασφαλέστερα ένα τμήμα δρόμου, που είναι ολισθηρό:","o":["Επιταχύνοντας το αυτοκίνητο.","Κινούμενοι με μικρή ταχύτητα και αποφεύγοντας το φρενάρισμα.","Φρενάροντας συνεχώς το αυτοκίνητο."],"a":1,"ex":"Σε γλιστερό δρόμο κάθε απότομη κίνηση (γκάζι ή φρένο) μπορεί να κάνει τους τροχούς να γλιστρήσουν. Πήγαινε αργά και ομαλά.","tip":"Γλιστράει; Αργά και χωρίς φρένο"},{"id":"k25","cat":"drive","n":25,"q":"Μετά το πλύσιμο του αυτοκινήτου, διαπιστώνετε ότι κατά την πέδηση παρουσιάζεται ολίσθηση στις επιφάνειες τριβής. Τι πρέπει να κάνετε:","o":["Να οδηγήσετε το αυτοκίνητο αμέσως στο ειδικό συνεργείο.","Να πατήσετε επανειλημμένα και διαδοχικά τον ποδομοχλό πεδήσεως, οδηγώντας με μικρή ταχύτητα.","Να χρησιμοποιήσετε αντί για το ποδόφρενο το χειρόφρενο."],"a":1,"ex":"Μετά το πλύσιμο τα φρένα είναι βρεγμένα και πιάνουν λιγότερο. Πατώντας ελαφρά το φρένο αρκετές φορές ενώ πας αργά, ζεσταίνονται και στεγνώνουν.","tip":"Βρεγμένα φρένα = πάτα τα λίγο για να στεγνώσουν"},{"id":"k26","cat":"drive","n":26,"q":"Πότε έχετε καλύτερη πέδηση (μικρότερη διαδρομή πεδήσεως) του οχήματος:","o":["Όταν πιέζετε με όλη τη δύναμη τον ποδομοχλό πεδήσεως.","Όταν πιέζετε με τόση δύναμη τον ποδομοχλό ώστε ανάλογα με την κατάσταση του οδοστρώματος να μην ακινητοποιούνται (μπλοκάρονται) οι τροχοί.","Όταν πιέζετε με δύναμη και αφήνετε διαδοχικά τον ποδομοχλό πεδήσεως."],"a":1,"ex":"Ένας τροχός που γυρίζει κρατάει τον δρόμο καλύτερα από έναν τροχό που έχει μπλοκάρει και σέρνεται. Γι' αυτό φρενάρεις δυνατά, αλλά όχι τόσο ώστε να μπλοκάρουν οι τροχοί.","tip":"Δυνατά, αλλά χωρίς να μπλοκάρουν οι τροχοί"},{"id":"k28","cat":"drive","n":28,"q":"Σε αυτοκινητόδρομους και οδούς ταχείας κυκλοφορίας, με τρεις (3) ή περισσότερες λωρίδες κυκλοφορίας, τα λεωφορεία ή συνδυασμοί αυτών σε ποια ή ποιες λωρίδες επιτρέπεται να κινούνται:","o":["Στην πλησιέστερη προς το δεξιό άκρο του οδοστρώματος.","Στις δύο πλησιέστερες προς το δεξιό άκρο του οδοστρώματος.","Σε όλες, ανάλογα με τις συνθήκες κυκλοφορίας."],"a":1,"ex":"Με 3 ή περισσότερες λωρίδες, το λεωφορείο χρησιμοποιεί τις δύο δεξιές λωρίδες. Η αριστερή μένει για τα ταχύτερα οχήματα.","tip":"3+ λωρίδες: λεωφορείο στις 2 δεξιές"},{"id":"k29","cat":"drive","n":29,"q":"Σε οδούς με δύο (2) λωρίδες κυκλοφορίας ανά κατεύθυνση, τα λεωφορεία ή συνδυασμοί αυτών σε ποια ή ποιες λωρίδες επιτρέπεται να κινούνται:","o":["Μόνο στην πλησιέστερη προς το δεξιό άκρο του οδοστρώματος.","Και στις δύο λωρίδες κυκλοφορίας.","Στη δεξιά λωρίδα κυκλοφορίας και για ελάχιστο χρόνο και σε ειδικές περιπτώσεις (προσπέρασμα κλπ.) στην αριστερή."],"a":2,"ex":"Με 2 λωρίδες το λεωφορείο πηγαίνει δεξιά. Στην αριστερή μπαίνει μόνο για λίγο, π.χ. για να προσπεράσει, και μετά γυρίζει δεξιά.","tip":"2 λωρίδες: δεξιά, αριστερά μόνο για προσπέραση"},{"id":"v01","cat":"speed","n":1,"q":"Ποιο είναι το ανώτατο επιτρεπόμενο όριο ταχύτητας των λεωφορείων σε αυτοκινητοδρόμους, αν αυτό δεν καθορίζεται με ειδικές πινακίδες;","o":["80 km/h.","90 km/h.","100 km/h."],"a":1,"ex":"Σύμφωνα με τον πίνακα λύσεων του βιβλίου, στον αυτοκινητόδρομο το λεωφορείο πηγαίνει το πολύ 90 km/h (ο κόφτης είναι στα 100, αλλά το όριο είναι χαμηλότερο).","tip":"Αυτοκινητόδρομος = 90","cf":1},{"id":"v02","cat":"speed","n":2,"q":"Αν ένα αστικό ή υπεραστικό λεωφορείο μεταφέρει όρθιους επιβάτες, ποιο είναι το ανώτερο όριο ταχύτητας που επιτρέπεται να αναπτύσσει:","o":["50 km/h.","60 km/h.","70 km/h."],"a":1,"ex":"Οι όρθιοι επιβάτες μπορούν να πέσουν σε ένα φρενάρισμα. Γι' αυτό, όταν υπάρχουν όρθιοι, το λεωφορείο δεν ξεπερνά τα 60 km/h.","tip":"Όρθιοι επιβάτες = 60"},{"id":"v03","cat":"speed","n":3,"q":"Ποιο το ανώτατο όριο ταχύτητας λεωφορείων με ελαφρό ρυμουλκούμενο, εκτός κατοικημένων περιοχών, αν αυτό δεν καθορίζεται με ειδικές πινακίδες;","o":["70 km/h.","80 km/h.","90 km/h."],"a":1,"ex":"Με ρυμουλκούμενο (τρέιλερ) το όχημα φρενάρει πιο δύσκολα. Έξω από την πόλη το όριο είναι 80 km/h.","tip":"Με τρέιλερ = 80"},{"id":"v04","cat":"speed","n":4,"q":"Ποιο είναι το ανώτατο όριο ταχύτητας διόροφων λεωφορείων, εκτός κατοικημένων περιοχών, αν αυτό δεν καθορίζεται με ειδικές πινακίδες;","o":["70 km/h.","80 km/h.","90 km/h."],"a":1,"ex":"Το διόροφο λεωφορείο είναι ψηλό και επηρεάζεται από τον αέρα και τις στροφές. Έξω από την πόλη πηγαίνει έως 80 km/h.","tip":"Διόροφο = 80"},{"id":"v05","cat":"speed","n":5,"q":"Ποιο είναι το ανώτατο επιτρεπόμενο όριο ταχύτητας των λεωφορείων, μέσα σε κατοικημένες περιοχές, αν αυτό δεν καθορίζεται με ειδικές πινακίδες;","o":["50 km/h.","60 km/h.","70 km/h."],"a":0,"ex":"Μέσα σε κατοικημένες περιοχές ισχύει το όριο της πόλης: 50 km/h, εκτός αν πινακίδα δείχνει άλλο.","tip":"Πόλη = 50","cf":1},{"id":"v06","cat":"speed","n":6,"q":"Ποιο είναι το ανώτατο επιτρεπόμενο όριο ταχύτητας των λεωφορείων, εκτός αυτοκινητοδρόμων, οδών ταχείας κυκλοφορίας και κατοικημένων περιοχών, αν αυτό δεν καθορίζεται με ειδικές πινακίδες;","o":["80 km/h.","90 km/h.","100 km/h."],"a":0,"ex":"Στους απλούς δρόμους έξω από την πόλη (όχι αυτοκινητόδρομος ή ταχεία) το λεωφορείο πηγαίνει έως 80 km/h. Σειρά: 90 αυτοκινητόδρομος και ταχεία, 80 επαρχία, 50 πόλη.","tip":"Επαρχία = 80","cf":1},{"id":"v07","cat":"speed","n":7,"q":"Ποιο το ανώτατο επιτρεπόμενο όριο ταχύτητας των λεωφορείων σε οδούς ταχείας κυκλοφορίας, αν αυτό δεν καθορίζεται με ειδικές πινακίδες;","o":["80 km/h.","90 km/h.","100 km/h."],"a":1,"ex":"Σύμφωνα με τον πίνακα λύσεων, και στις οδούς ταχείας κυκλοφορίας το όριο του λεωφορείου είναι 90 km/h, όπως στον αυτοκινητόδρομο.","tip":"Ταχεία = 90"},{"id":"v08","cat":"speed","n":8,"q":"Ποιο είναι το ανώτατο όριο ταχύτητας λεωφορείων μεταφοράς μαθητών εκτός κατοικημένων περιοχών, αν αυτό δεν καθορίζεται με ειδικές πινακίδες;","o":["50 km/h.","60 km/h.","70 km/h."],"a":1,"ex":"Τα σχολικά μεταφέρουν παιδιά, οπότε έχουν χαμηλότερο όριο: έξω από την πόλη έως 60 km/h.","tip":"Σχολικό = 60"},{"id":"v09","cat":"speed","n":9,"q":"Ποιο είναι το ανώτατο όριο ταχύτητας αρθρωτών λεωφορείων εκτός κατοικημένων περιοχών, αν αυτό δεν καθορίζεται διαφορετικά με ειδικές πινακίδες;","o":["70 km/h.","80 km/h.","90 km/h."],"a":0,"ex":"Το αρθρωτό (με φυσαρμόνικα) είναι πολύ μακρύ και πιο δύσκολο να ελεγχθεί. Έχει το χαμηλότερο όριο: 70 km/h έξω από την πόλη.","tip":"Αρθρωτό = 70 (το πιο αργό)"},{"id":"p01","cat":"law","n":1,"q":"Αν ο οδηγός εμπλακεί σε τροχαίο ατύχημα, και βρεθεί υπό την επήρεια αλκοόλ, η ασφαλιστική εταιρεία θα καλύψει κάθε ζημιά χωρίς καμιά απαίτηση απ' αυτόν;","o":["Όχι. Θα καταβάλει την αποζημίωση σε τρίτους, αλλά στη συνέχεια θα στραφεί εναντίον του.","Ναι. Θα καταβάλει την αποζημίωση χωρίς καμιά επίπτωση σ' αυτόν."],"a":0,"ex":"Η ασφάλεια πληρώνει πρώτα τα θύματα, ώστε να μη μείνουν απλήρωτα. Μετά όμως ζητάει τα χρήματα πίσω από τον μεθυσμένο οδηγό.","tip":"Μεθυσμένος = στο τέλος πληρώνεις εσύ"},{"id":"p02","cat":"law","n":2,"q":"Τι παρεπόμενες ποινές προβλέπονται αν κάποιος οδηγεί όχημα χωρίς να έχει τη νόμιμη άδεια οδήγησης και γίνει υπαίτιος τροχαίου ατυχήματος με σοβαρό τραυματισμό ή θάνατο:","o":["Στέρηση του δικαιώματος αποκτήσεως άδειας οδηγήσεως για 10 χρόνια τουλάχιστον.","Στέρηση του δικαιώματος αποκτήσεως άδειας οδηγήσεως για 15 χρόνια τουλάχιστον.","Στέρηση του δικαιώματος αποκτήσεως άδειας οδηγήσεως για 20 χρόνια τουλάχιστον."],"a":0,"ex":"Χωρίς δίπλωμα και με σοβαρό ατύχημα: δεν μπορεί να βγάλει δίπλωμα για τουλάχιστον 10 χρόνια.","tip":"Χωρίς δίπλωμα + ατύχημα = 10 χρόνια"},{"id":"p03","cat":"law","n":3,"q":"Τι παρεπόμενες ποινές προβλέπονται αν κάποιος οδηγεί όχημα χωρίς να έχει τη νόμιμη άδεια οδήγησης;","o":["Στέρηση του δικαιώματος αποκτήσεως άδειας οδηγήσεως για 3 έτη τουλάχιστον.","Στέρηση του δικαιώματος αποκτήσεως άδειας οδηγήσεως για 5 έτη τουλάχιστον.","Στέρηση του δικαιώματος αποκτήσεως άδειας οδηγήσεως για 10 έτη τουλάχιστον."],"a":0,"ex":"Αν οδηγείς χωρίς δίπλωμα (χωρίς ατύχημα), δεν μπορείς να βγάλεις δίπλωμα για τουλάχιστον 3 χρόνια. Με ατύχημα γίνονται 10.","tip":"Χωρίς δίπλωμα = 3 χρόνια"},{"id":"p04","cat":"law","n":4,"q":"Αν κάποιος οδηγός, κατά το αλκοτέστ, βρεθεί με περιεκτικότητα αλκοόλ στο αίμα πάνω από 1,10 γραμμάρια ανά λίτρο αίματος, τι ποινές του επιβάλλονται:","o":["Πρόστιμο 200.000 δρχ., φυλάκιση 2 τουλάχιστον μηνών, αφαίρεση της άδειας οδηγήσεως για 6 μήνες και αφαίρεση των πινακίδων και της άδειας κυκλοφορίας του οχήματος από 10 μέρες έως 6 μήνες.","Πρόστιμο 200.000 δρχ. και αφαίρεση άδειας οδηγήσεως για 3 μήνες.","Αφαίρεση της άδειας οδηγήσεως για 5 χρόνια."],"a":0,"ex":"Πάνω από 1,10 είναι πλέον ποινικό αδίκημα. Γι' αυτό εδώ υπάρχει και φυλάκιση, και αφαιρούνται επιπλέον οι πινακίδες. Είναι η πιο μεγάλη απάντηση.","tip":"Πάνω από 1,10 = φυλακή + όλα μαζί"},{"id":"p05","cat":"law","n":5,"q":"Αν κάποιος οδηγός, κατά το αλκοτέστ, βρεθεί με περιεκτικότητα αλκοόλ στο αίμα από 0,5 έως και 0,8 γραμμάρια ανά λίτρο αίματος, τι ποινές του επιβάλλονται:","o":["Πρόστιμο 100.000 δρχ.","Πρόστιμο 50.000 δρχ.","Πρόστιμο 50.000 δρχ. και αφαίρεση άδειας οδηγήσεως για 1 μήνα."],"a":1,"ex":"Το βιβλίο είναι παλιό και γράφει τα ποσά σε δραχμές. Σύμφωνα με τον πίνακα λύσεων, για 0,5 έως 0,8 η ποινή είναι πρόστιμο 50.000 δρχ. Από 0,8 και πάνω προστίθεται αφαίρεση διπλώματος.","tip":"0,5–0,8 = μόνο πρόστιμο 50.000","cf":1},{"id":"p06","cat":"law","n":6,"q":"Αν κάποιος οδηγός, κατά το αλκοτέστ, βρεθεί με περιεκτικότητα αλκοόλ στο αίμα από 0,8 έως και 1,10 γραμμάρια ανά λίτρο αίματος, τι ποινές του επιβάλλονται:","o":["Πρόστιμο 100.000 δρχ.","Πρόστιμο 100.000 δρχ. και αφαίρεση άδειας οδηγήσεως για 3 μήνες.","Πρόστιμο 200.000 δρχ. και αφαίρεση άδειας οδηγήσεως για 1 μήνα."],"a":1,"ex":"Το επόμενο σκαλί: για 0,8 έως 1,10 το πρόστιμο διπλασιάζεται (100.000 δρχ.) και το δίπλωμα αφαιρείται για 3 μήνες.","tip":"0,8–1,10 = 100.000 + 3 μήνες"},{"id":"p07","cat":"law","n":7,"q":"Τι διοικητικές ποινές προβλέπονται αν κάποιος οδηγεί όχημα κατά τη διάρκεια που του έχει αφαιρεθεί η άδεια οδηγήσεως;","o":["Στέρηση του δικαιώματος επαναχορηγήσεως για 3 έτη τουλάχιστον.","Στέρηση του δικαιώματος επαναχορηγήσεως για 5 έτη τουλάχιστον.","Στέρηση του δικαιώματος επαναχορηγήσεως για 10 έτη τουλάχιστον."],"a":0,"ex":"Ίδιο με το «χωρίς δίπλωμα»: αν οδηγείς ενώ σου έχουν πάρει το δίπλωμα, δεν σου το ξαναδίνουν για τουλάχιστον 3 χρόνια.","tip":"Οδηγείς ενώ σου το πήραν = 3 χρόνια"},{"id":"p08","cat":"law","n":8,"q":"Τι διοικητικές ποινές προβλέπονται, αν ένας οδηγός γίνεται υπαίτιος τροχαίου ατυχήματος με σοβαρό τραυματισμό:","o":["Αφαίρεση άδειας οδηγήσεως από 1 μήνα μέχρι 1 χρόνο.","Αφαίρεση άδειας οδηγήσεως από 2 μήνες μέχρι 3 χρόνια.","Αφαίρεση άδειας οδηγήσεως από 3 μήνες μέχρι 2 χρόνια."],"a":2,"ex":"Σοβαρός τραυματισμός: αφαίρεση διπλώματος από 3 μήνες έως 2 χρόνια. Αν υπάρξει θάνατος, η ποινή είναι 2 έως 5 χρόνια.","tip":"Τραυματισμός = 3 μήνες έως 2 χρόνια"},{"id":"p09","cat":"law","n":9,"q":"Τι διοικητικές ποινές προβλέπονται, αν ένας οδηγός γίνεται υπαίτιος τροχαίου ατυχήματος με θάνατο:","o":["Αφαίρεση άδειας οδηγήσεως από 2 έως 3 χρόνια.","Αφαίρεση άδειας οδηγήσεως από 2 έως 4 χρόνια.","Αφαίρεση άδειας οδηγήσεως από 2 έως 5 χρόνια."],"a":2,"ex":"Με θάνατο η ποινή είναι πιο βαριά από τον τραυματισμό: αφαίρεση διπλώματος από 2 έως 5 χρόνια.","tip":"Θάνατος = 2 έως 5 χρόνια"},{"id":"p10","cat":"law","n":10,"q":"Τι ποινές προβλέπονται, αν κάποιος οδηγός, κατά το αλκοτέστ, βρεθεί για δεύτερη φορά εντός δύο ετών (υπότροπος) να έχει πάνω από 1,10 γραμμάρια ανά λίτρο αίματος, ανεξαρτήτως της περιεκτικότητας της αλκοόλ στην πρώτη παράβαση:","o":["Αφαίρεση άδειας οδηγήσεως για 5 χρόνια.","Αφαίρεση άδειας οδηγήσεως για 3 χρόνια.","Αφαίρεση άδειας οδηγήσεως για 2 χρόνια."],"a":0,"ex":"Υπότροπος σημαίνει ότι το έκανε ξανά. Δεύτερη φορά μέσα σε 2 χρόνια με πάνω από 1,10: χάνει το δίπλωμα για 5 χρόνια.","tip":"Ξανά μεθυσμένος = 5 χρόνια"},{"id":"p11","cat":"law","n":11,"q":"Τι διοικητικές ποινές προβλέπονται, αν κάποιος οδηγεί όχημα, κατά τη διάρκεια που του έχει αφαιρεθεί η άδεια οδηγήσεως και γίνει υπαίτιος τροχαίου ατυχήματος με σοβαρό τραυματισμό ή θάνατο:","o":["Στέρηση του δικαιώματος επαναχορηγήσεως για 10 έτη.","Στέρηση του δικαιώματος επαναχορηγήσεως για 20 έτη.","Μέχρι και την οριστική στέρηση του δικαιώματος επαναποκτήσεως άδειας οδηγήσεως."],"a":2,"ex":"Είναι η πιο βαριά περίπτωση: του είχαν ήδη πάρει το δίπλωμα, οδήγησε και προκάλεσε σοβαρό ατύχημα. Μπορεί να χάσει το δίπλωμα για πάντα.","tip":"Το χειρότερο σενάριο = για πάντα"},{"id":"m10","cat":"mech","n":10,"q":"Σε αυτοτελές όχημα με αερόφρενα, ο χρόνος πληρώσεως των αεροφυλακίων δεν πρέπει να είναι μεγαλύτερος από:","o":["Τρία (3) λεπτά για αύξηση της πιέσεως από το 0 στο 65% της μέγιστης πιέσεως.","Δεν υπάρχει όριο, αρκεί να γεμίσουν τα αεροφυλάκια.","Δέκα (10) λεπτά για αύξηση της πιέσεως από το 0 στο 65% της μέγιστης πιέσεως."],"a":0,"ex":"Τα αεροφυλάκια είναι οι «δεξαμενές» αέρα των φρένων. Πρέπει να γεμίζουν γρήγορα, ώστε να έχεις φρένα σύντομα: έως 65% της πίεσης μέσα σε 3 λεπτά.","tip":"Αέρας φρένων: 3 λεπτά ως το 65%"},{"id":"m14","cat":"mech","n":14,"q":"Ποια είναι η λειτουργία του πρωτεύοντα άξονα στο κιβώτιο ταχυτήτων:","o":["Μέσω του συμπλέκτη λαμβάνει την κίνηση από τον κινητήρα.","Μέσω του κεντρικού άξονα και των συνδέσμων, μεταδίδει την κίνηση στους κινητήριους τροχούς.","Λαμβάνει την κίνηση από τον κεντρικό άξονα και τη μεταφέρει στο δευτερεύοντα."],"a":0,"ex":"Πρωτεύων = ο πρώτος. Είναι ο πρώτος άξονας του κιβωτίου και παίρνει την κίνηση από τη μηχανή μέσω του συμπλέκτη.","tip":"Πρωτεύων = πρώτος, από τη μηχανή"},{"id":"m16","cat":"mech","n":16,"q":"Σε στροφόμετρο λεωφορείου, που υπάρχουν χρωματισμένες κλίμακες (περιοχές ενδείξεων στροφών) με κίτρινο, πράσινο, κόκκινο χρώμα, σε ποια κλίμακα πρέπει να είναι ο δείκτης, για να έχετε καλή απόδοση του κινητήρα και περιορισμένη κατανάλωση καυσίμου:","o":["Στην κίτρινη.","Στην πράσινη.","Στην κόκκινη."],"a":1,"ex":"Όπως στο φανάρι: πράσινο = όλα καλά. Στην πράσινη περιοχή η μηχανή δουλεύει οικονομικά και αποδοτικά.","tip":"Πράσινο = οικονομία"},{"id":"m17","cat":"mech","n":17,"q":"Στο στροφόμετρο ορισμένων λεωφορείων υπάρχουν χρωματισμένες κλίμακες (περιοχές ενδείξεων στροφών) με κίτρινο, πράσινο, κόκκινο χρώμα. Σε ποια κλίμακα είναι ο δείκτης όταν έχετε υπερβολική κατανάλωση καυσίμου σε σχέση με την αποδιδόμενη ισχύ του κινητήρα:","o":["Στην κίτρινη.","Στην πράσινη.","Στην κόκκινη."],"a":2,"ex":"Κόκκινο = πολλές στροφές. Η μηχανή καίει πολύ καύσιμο χωρίς να δίνει αντίστοιχη δύναμη και μπορεί να πάθει ζημιά.","tip":"Κόκκινο = σπατάλη"},{"id":"m18","cat":"mech","n":18,"q":"Ποια είναι η λειτουργία του βοηθητικού άξονα στο κιβώτιο ταχυτήτων:","o":["Μέσω του συμπλέκτη λαμβάνει την κίνηση από τον κινητήρα.","Μέσω του κεντρικού άξονα και των συνδέσμων, μεταδίδει την κίνηση στους κινητήριους τροχούς.","Λαμβάνει την κίνηση από τον πρωτεύοντα άξονα και τη μεταφέρει στο δευτερεύοντα."],"a":2,"ex":"Ο βοηθητικός άξονας είναι στη μέση: παίρνει την κίνηση από τον πρωτεύοντα και τη δίνει στον δευτερεύοντα, μέσα από τα γρανάζια.","tip":"Βοηθητικός = ο ενδιάμεσος"},{"id":"m21","cat":"mech","n":21,"q":"Το σύστημα αντιμπλοκαρίσματος των τροχών (ABS):","o":["Αποτρέπει το μπλοκάρισμα του διαφορικού στις στροφές.","Αποτρέπει την ολίσθηση των τροχών κατά την επιτάχυνση.","Αποτρέπει το μπλοκάρισμα των τροχών, όταν φρενάρετε (σε βρεγμένο δρόμο)."],"a":2,"ex":"ABS = αντι-μπλοκάρισμα στο φρενάρισμα. Οι τροχοί συνεχίζουν να γυρίζουν, άρα μπορείς ακόμα να στρίψεις με το τιμόνι.","tip":"ABS = φρενάρεις χωρίς να μπλοκάρουν οι ρόδες"},{"id":"m26","cat":"mech","n":26,"q":"Σε ποιες περιοχές κυμαίνεται η μικρότερη επιτρεπόμενη πίεση πεπιεσμένου αέρα σε ένα πνευματικό σύστημα φρένων:","o":["Περίπου 5 - 6 bar.","Περίπου 9 - 10 bar.","Περίπου 14 - 15 bar."],"a":0,"ex":"Αν η πίεση πέσει κάτω από περίπου 5–6 bar, τα αερόφρενα δεν δουλεύουν σωστά. Γι' αυτό ο οδηγός κοιτάζει τα μανόμετρα.","tip":"Ελάχιστη πίεση αέρα = 5–6 bar"},{"id":"m27","cat":"mech","n":27,"q":"Σε ένα σύστημα αναρτήσεως με αέρα τι χρησιμεύει το κύκλωμα υψηλής πιέσεως:","o":["Παρέχει πρόσθετο αέρα και αυξάνει την πίεση στις αερόσουστες, όταν το αυτοκίνητο φορτώνεται, για να διατηρείται πάντα στο ίδιο επίπεδο.","Διατηρεί πάντα σταθερή την πίεση στις αερόσουστες.","Παρέχει αέρα στους σερβομηχανισμούς του οχήματος."],"a":0,"ex":"Όταν ανεβαίνουν επιβάτες, το λεωφορείο «κάθεται». Το κύκλωμα υψηλής πίεσης φουσκώνει περισσότερο τις αερόσουστες, ώστε το όχημα να μένει στο ίδιο ύψος.","tip":"Περισσότερο φορτίο = περισσότερος αέρας στις σούστες"},{"id":"m30","cat":"mech","n":30,"q":"Το μονοξείδιο του άνθρακα (CO) είναι ρύπος, που περιέχεται κυρίως στα προϊόντα καύσεως ενός:","o":["Πετρελαιοκίνητου αυτοκινήτου.","Βενζινοκίνητου αυτοκινήτου.","Ηλεκτροκίνητου αυτοκινήτου."],"a":1,"ex":"Το CO βγαίνει κυρίως από τη βενζίνη. Το ηλεκτρικό δεν έχει καυσαέρια. Από το πετρέλαιο ο χαρακτηριστικός ρύπος είναι το SO2 (θείο).","tip":"CO = βενζίνη, SO2 = πετρέλαιο"},{"id":"m32","cat":"mech","n":32,"q":"Σε ένα πλήρως συγχρονισμένο κιβώτιο ταχυτήτων:","o":["Όλες οι ταχύτητες αλλάζουν συγχρονισμένα.","Όλες οι ταχύτητες αλλάζουν συγχρονισμένα, εκτός από την πρώτη.","Όλες οι ταχύτητες αλλάζουν συγχρονισμένα, εκτός από την όπισθεν."],"a":2,"ex":"Ακόμα και στο «πλήρως» συγχρονισμένο κιβώτιο, η όπισθεν συνήθως δεν έχει συγχρονιστή. Γι' αυτό τη βάζεις μόνο όταν το όχημα έχει σταματήσει.","tip":"Πλήρως συγχρονισμένο… εκτός από την όπισθεν"},{"id":"m33","cat":"mech","n":33,"q":"Πώς μεταδίδουν τα έμβολα την πίεση, που δημιουργείται από την έκρηξη του μείγματος, στο στροφαλοφόρο άξονα:","o":["Με τον εκκεντροφόρο άξονα.","Με τα ωστήρια των βαλβίδων.","Με τη βοήθεια των διωστήρων (μπιέλες)."],"a":2,"ex":"Η έκρηξη σπρώχνει το έμβολο προς τα κάτω. Η μπιέλα (διωστήρας) ενώνει το έμβολο με τον στρόφαλο και μετατρέπει το πάνω-κάτω σε περιστροφή.","tip":"Έμβολο → μπιέλα → στρόφαλος"},{"id":"m34","cat":"mech","n":34,"q":"Ο προορισμός του διωστήρα (μπιέλας) είναι:","o":["Να μεταφέρει την κινητική ενέργεια του εμβόλου στο στροφαλοφόρο άξονα.","Να ανοιγοκλείνει τις βαλβίδες εισαγωγής και εξαγωγής.","Να συνδέει το έμβολο με τον εκκεντροφόρο άξονα."],"a":0,"ex":"Ίδια ιδέα με την προηγούμενη ερώτηση: η μπιέλα είναι η «γέφυρα» από το έμβολο στον στροφαλοφόρο. Τις βαλβίδες τις κινεί ο εκκεντροφόρος.","tip":"Μπιέλα = έμβολο → στροφαλοφόρος"},{"id":"m35","cat":"mech","n":35,"q":"Στο ελαστικό 175/70 R 15 87T το μέγεθος 15 δηλώνει:","o":["Την εξωτερική διάμετρο του ελαστικού σε ίντσες.","Τη διάμετρο της ζάντας σε ίντσες.","Το ύψος του πέλματος του ελαστικού σε ίντσες."],"a":1,"ex":"Ο αριθμός μετά το R είναι η ζάντα σε ίντσες. Το 175 είναι το πλάτος σε mm και το 70 το ύψος του πλαϊνού σε ποσοστό.","tip":"R 15 = ζάντα 15 ιντσών"},{"id":"m36","cat":"mech","n":36,"q":"Το διοξείδιο του θείου (SO2) είναι ρύπος που περιέχεται στα προϊόντα καύσεως ενός:","o":["Βενζινοκίνητου αυτοκινήτου.","Πετρελαιοκίνητου αυτοκινήτου.","Υγραεριοκίνητου αυτοκινήτου."],"a":1,"ex":"Το πετρέλαιο περιέχει θείο. Όταν καίγεται, βγαίνει διοξείδιο του θείου (SO2).","tip":"Θείο (S) = πετρέλαιο"},{"id":"m37","cat":"mech","n":37,"q":"Τι αναρροφά ένας τετράχρονος πετρελαιοκινητήρας κατά το χρόνο της εισαγωγής:","o":["Μείγμα πετρελαίου και αέρα.","Μόνο πετρέλαιο.","Μόνο αέρα."],"a":2,"ex":"Ο πετρελαιοκινητήρας παίρνει μόνο αέρα και τον συμπιέζει πολύ, ώστε να ζεσταθεί. Το πετρέλαιο ψεκάζεται μετά από τους εγχυτήρες και αναφλέγεται μόνο του.","tip":"Diesel εισαγωγή = μόνο αέρας"},{"id":"m38","cat":"mech","n":38,"q":"Ποιος είναι ο προορισμός του κεντρικού άξονα μεταδόσεως της κινήσεως για διάταξη με τον κινητήρα μπροστά και τους κινητήριους τροχούς πίσω:","o":["Να μεταφέρει την κίνηση στους μπροστινούς τροχούς.","Να μεταφέρει την κίνηση από το διαφορικό στο κιβώτιο ταχυτήτων.","Να μεταδίδει τη ροπή στρέψεως από το κιβώτιο ταχυτήτων στους κινητήριους τροχούς."],"a":2,"ex":"Η μηχανή είναι μπροστά, οι τροχοί που κινούν το όχημα πίσω. Ο κεντρικός άξονας (κardan) είναι ο μακρύς άξονας που φέρνει την κίνηση από το κιβώτιο πίσω στους τροχούς.","tip":"Κεντρικός άξονας = από το κιβώτιο προς τις πίσω ρόδες"},{"id":"m40","cat":"mech","n":40,"q":"Ο οξειδωτικός καταλύτης στα λεωφορεία:","o":["Διευκολύνει την εξαγωγή των καυσαερίων.","Μειώνει τους ρύπους που εκπέμπονται από την εξάτμιση.","Αυξάνει την ιπποδύναμη του κινητήρα."],"a":1,"ex":"Ο καταλύτης «καθαρίζει» τα καυσαέρια πριν βγουν από την εξάτμιση, ώστε να μολύνουν λιγότερο.","tip":"Καταλύτης = λιγότεροι ρύποι"},{"id":"m41","cat":"mech","n":41,"q":"Τα ελατήρια συμπιέσεως του εμβόλου έχουν προορισμό:","o":["Να μην αφήνουν τη διαφυγή των αερίων καύσεως προς το στροφαλοθάλαμο.","Να μην αφήνουν το λάδι της λιπάνσεως να φτάνει στο θάλαμο καύσεως.","Να λιπαίνουν τις επιφάνειες εμβόλου - κυλίνδρου."],"a":0,"ex":"Τα ελατήρια συμπίεσης «σφραγίζουν» το έμβολο ώστε τα αέρια της έκρηξης να μένουν πάνω και να μη φεύγουν προς τα κάτω.","tip":"Συμπίεσης = κρατάνε τα αέρια πάνω"},{"id":"m43","cat":"mech","n":43,"q":"Το σύστημα πεδήσεως με πεπιεσμένο αέρα (αερόφρενα) χρησιμοποιείται στα λεωφορεία διότι:","o":["Είναι πιο άνετη η οδήγηση του οχήματος.","Το υδραυλικό σύστημα πεδήσεως δεν επαρκεί για την επιβράδυνση του οχήματος.","Η εξωτερική φθορά στο δίκτυο σωληνώσεων και στους λοιπούς μηχανισμούς των αερόφρενων είναι σπάνια."],"a":1,"ex":"Ένα λεωφορείο ζυγίζει πολλούς τόνους. Τα υδραυλικά φρένα του αυτοκινήτου δεν έχουν αρκετή δύναμη για να το σταματήσουν. Ο πεπιεσμένος αέρας δίνει πολύ μεγαλύτερη δύναμη.","tip":"Βαρύ όχημα = χρειάζεται αέρα"},{"id":"m45","cat":"mech","n":45,"q":"Σε έναν τετράχρονο πετρελαιοκινητήρα, όταν ο στροφαλοφόρος άξονας κάνει δύο στροφές, πόσες στροφές κάνει ο εκκεντροφόρος:","o":["Μία στροφή.","Δύο στροφές.","Τέσσερις στροφές."],"a":0,"ex":"Σε έναν τετράχρονο κινητήρα κάθε βαλβίδα ανοίγει μία φορά σε κάθε δύο στροφές του στροφάλου. Γι' αυτό ο εκκεντροφόρος γυρίζει με τη μισή ταχύτητα: 2 στροφές στρόφαλος = 1 στροφή εκκεντροφόρος.","tip":"Εκκεντροφόρος = μισές στροφές"},{"id":"m46","cat":"mech","n":46,"q":"Η φυγοκεντρική αντλία του νερού του συστήματος ψύξεως παίρνει κίνηση:","o":["Από το στροφαλοφόρο άξονα με τη βοήθεια ιμάντα.","Από τον εκκεντροφόρο άξονα με ειδικά γρανάζια.","Από τον εκκεντροφόρο άξονα με τη βοήθεια ιμάντα."],"a":0,"ex":"Η αντλία νερού γυρίζει με ιμάντα (λουρί) που παίρνει κίνηση από τον στροφαλοφόρο, όπως και ο ανεμιστήρας και ο δυναμό.","tip":"Αντλία νερού = στρόφαλος + ιμάντας"},{"id":"m47","cat":"mech","n":47,"q":"Η λίπανση των τριβομένων επιφανειών των κινητήρων των σημερινών αυτοκινήτων γίνεται:","o":["Με ψεκασμό των λαδιών.","Με αναγκαστική κυκλοφορία του λαδιού.","Με μικτό σύστημα."],"a":1,"ex":"Στις σημερινές μηχανές μια αντλία λαδιού σπρώχνει (αναγκάζει) το λάδι με πίεση σε όλα τα σημεία που τρίβονται.","tip":"Λίπανση = αντλία με πίεση"},{"id":"m48","cat":"mech","n":48,"q":"Το υδραυλικό σύστημα διευθύνσεως χρησιμοποιείται στα λεωφορεία με σκοπό:","o":["Να ελαττώσει το αποτέλεσμα της μυϊκής δυνάμεως του οδηγού κατά το στρίψιμο.","Να αυξήσει το αποτέλεσμα της μυϊκής δυνάμεως του οδηγού κατά το στρίψιμο.","Να αυξήσει την πρόσφυση των ελαστικών στο δρόμο."],"a":1,"ex":"Είναι το «υδραυλικό τιμόνι». Πολλαπλασιάζει τη δύναμη που βάζεις, ώστε να γυρίζεις εύκολα το τιμόνι ενός βαρύ λεωφορείου.","tip":"Υδραυλικό τιμόνι = περισσότερη δύναμη με λιγότερο κόπο"},{"id":"m50","cat":"mech","n":50,"q":"Ο αεροσυμπιεστής:","o":["Αναρροφά τον αέρα, τον συμπιέζει και τον εισάγει στα αεροφυλάκια.","Αναρροφά τον αέρα και τον στέλνει στο σύστημα αναρτήσεως.","Αναρροφά τον αέρα και τον στέλνει στο σύστημα ψύξεως."],"a":0,"ex":"Το όνομα τα λέει: αερο-συμπιεστής = συμπιέζει αέρα. Τον βάζει στα αεροφυλάκια, από όπου τον παίρνουν τα φρένα.","tip":"Συμπιεστής → αεροφυλάκια"},{"id":"m52","cat":"mech","n":52,"q":"Το σερβόφρενο με πεπιεσμένο αέρα έχει εφαρμογή:","o":["Σε μηχανικό σύστημα πεδήσεως.","Σε υδραυλικό-πνευματικό σύστημα πεδήσεως.","Σε ηλεκτρικό σύστημα πεδήσεως."],"a":1,"ex":"Το σερβόφρενο βοηθάει τον οδηγό να πατά το φρένο με λιγότερη δύναμη. Με πεπιεσμένο αέρα (πνευματικό) δουλεύει μαζί με υδραυλικό σύστημα, δηλαδή σε υδραυλικό-πνευματικό σύστημα.","tip":"Σερβόφρενο αέρα = υδραυλικό + πνευματικό"},{"id":"m53","cat":"mech","n":53,"q":"Τα ελατήρια του λαδιού έχουν προορισμό:","o":["Να λιπαίνουν το διανομέα.","Να μην αφήνουν το λάδι της λιπάνσεως να φθάνει στο θάλαμο καύσεως.","Να μην αφήνουν να διαφεύγουν τα αέρια της καύσεως προς το στροφαλοθάλαμο."],"a":1,"ex":"Το αντίστροφο από τα ελατήρια συμπίεσης: τα ελατήρια λαδιού κρατάνε το λάδι κάτω, ώστε να μην ανεβαίνει και να καίγεται.","tip":"Λαδιού = κρατάνε το λάδι κάτω"},{"id":"m54","cat":"mech","n":54,"q":"Οι αποσβεστήρες κραδασμών (αμορτισέρ) είναι μηχανισμοί, που:","o":["Καθιστούν σταθερή την οδήγηση του αυτοκινήτου.","Ελέγχουν και αποσβένουν γρήγορα τις ταλαντώσεις των ελατηρίων όταν οι τροχοί συναντούν ανωμαλία στο δρόμο.","Συνδέουν το πλαίσιο του αυτοκινήτου με τα ελαστικά."],"a":1,"ex":"Μετά από μια λακκούβα το ελατήριο θα αναπηδούσε πολλές φορές. Το αμορτισέρ σταματά γρήγορα αυτό το «κούνημα».","tip":"Αμορτισέρ = σταματά το αναπήδημα"},{"id":"m57","cat":"mech","n":57,"q":"Ο αυτόματος ρυθμιστής πιέσεως (ΑΡΠ) είναι ένας μηχανισμός του συστήματος πεδήσεως, ο οποίος:","o":["Ρυθμίζει αυτόματα την πίεση στους κυλίνδρους πεδήσεως ανάλογα με τη φόρτιση του οχήματος.","Παράγει τον απαιτούμενο πεπιεσμένο αέρα.","Διανέμει τον αέρα σε περισσότερα του ενός κυκλώματα."],"a":0,"ex":"Άδειο λεωφορείο χρειάζεται λιγότερη δύναμη φρεναρίσματος από γεμάτο. Ο ΑΡΠ προσαρμόζει μόνος του την πίεση ανάλογα με το φορτίο, ώστε να μη μπλοκάρουν οι τροχοί.","tip":"ΑΡΠ = πίεση ανάλογα με το φορτίο"},{"id":"m58","cat":"mech","n":58,"q":"Η φυγοκεντρική αντλία του νερού του συστήματος ψύξεως του κινητήρα:","o":["Αναρροφά το ψυκτικό υγρό από τον άνω υδροθάλαμο του ψυγείου και το αποστέλλει με φυσική ροή στα υδροχιτώνια του κινητήρα.","Αναρροφά το ψυκτικό υγρό από τον κάτω υδροθάλαμο του ψυγείου και το αποστέλλει με πίεση στα υδροχιτώνια του κινητήρα.","Με τη βοήθεια του θερμοστάτη αναρροφά το ψυκτικό υγρό και το αποστέλλει στα υδροχιτώνια."],"a":1,"ex":"Το νερό κρυώνει καθώς κατεβαίνει μέσα στο ψυγείο. Η αντλία παίρνει το κρύο νερό από κάτω και το σπρώχνει με πίεση στη μηχανή.","tip":"Αντλία: κρύο νερό από κάτω, με πίεση"},{"id":"m62","cat":"mech","n":62,"q":"Σε τι αποβλέπει η χρήση του μηχανόφρενου (κλαπέτου):","o":["Στην οικονομία καυσίμων.","Στο να περιορίζεται η χρήση του ποδόφρενου κατά την κίνηση του οχήματος σε κατωφέρεια.","Στην ανακούφιση του κινητήρα."],"a":1,"ex":"Το κλαπέτο φρενάρει με τη μηχανή. Στις κατηφόρες το χρησιμοποιείς για να μη ζεσταθούν τα κανονικά φρένα από το συνεχές πάτημα.","tip":"Κλαπέτο = κατηφόρα χωρίς να καίς τα φρένα"},{"id":"m63","cat":"mech","n":63,"q":"Σε ένα λεωφορείο εφοδιασμένο με σύστημα πεδήσεως με πεπιεσμένο αέρα (αερόφρενα), πού κυρίως πρέπει να στρέφεται η προσοχή του οδηγού:","o":["Στον τρόπο με τον οποίο ενεργούν τα φρένα.","Στην ένδειξη των μανομέτρων που βρίσκονται στον πίνακα οργάνων.","Στον τρόπο με τον οποίο, κατά το πάτημα, υποχωρεί ο ποδομοχλός των φρένων."],"a":1,"ex":"Στα αερόφρενα το πρόβλημα (λίγος αέρας) δεν το νιώθεις στο πεντάλ. Το βλέπεις μόνο στα μανόμετρα του ταμπλό.","tip":"Αερόφρενα = κοίτα τα μανόμετρα"},{"id":"m64","cat":"mech","n":64,"q":"Ποια από τα πιο κάτω εξαρτήματα παίρνουν κίνηση από τον εκκεντροφόρο άξονα:","o":["Ο στροφαλοφόρος άξονας.","Ο ανεμιστήρας.","Οι βαλβίδες εισαγωγής και εξαγωγής."],"a":2,"ex":"Ο εκκεντροφόρος έχει «έκκεντρα» (εξογκώματα) που πατάνε τις βαλβίδες και τις ανοίγουν τη σωστή στιγμή.","tip":"Εκκεντροφόρος → βαλβίδες"},{"id":"m65","cat":"mech","n":65,"q":"Ποια είναι η κανονική κυκλοφορία του νερού στο σύστημα ψύξεως:","o":["Ψυγείο-υδροχιτώνια-υδραντλία-θερμοστάτης-ψυγείο.","Ψυγείο-θερμοστάτης-υδροχιτώνια-υδραντλία-ψυγείο.","Ψυγείο-υδραντλία-υδροχιτώνια-θερμοστάτης-ψυγείο."],"a":2,"ex":"Ακολούθησε το νερό: από το ψυγείο το παίρνει η αντλία, το στέλνει στη μηχανή (υδροχιτώνια), βγαίνει ζεστό από τον θερμοστάτη και γυρίζει στο ψυγείο.","tip":"Ψυγείο → αντλία → μηχανή → θερμοστάτης → ψυγείο"},{"id":"m66","cat":"mech","n":66,"q":"Πόσα είναι κατ' ελάχιστον τα εσωτερικά κυκλώματα φωτισμού ενός λεωφορείου:","o":["Ένα (1).","Δύο (2).","Τρία (3)."],"a":1,"ex":"Υπάρχουν τουλάχιστον δύο κυκλώματα. Έτσι, αν χαλάσει το ένα, οι επιβάτες δεν μένουν στο σκοτάδι.","tip":"Φωτισμός = 2 κυκλώματα (για ασφάλεια)"},{"id":"m67","cat":"mech","n":67,"q":"Τι δείχνει το μανόμετρο του λαδιού που είναι τοποθετημένο στον πίνακα οργάνων του λεωφορείου:","o":["Την πίεση του λαδιού των υδραυλικών φρένων.","Την πίεση του λαδιού του κινητήρα.","Την ποσότητα του λαδιού στο κάρτερ."],"a":1,"ex":"Μανόμετρο = όργανο που μετράει πίεση. Αυτό του ταμπλό δείχνει την πίεση του λαδιού της μηχανής. Την ποσότητα τη βλέπεις με τον δείκτη (λαδοβελόνα).","tip":"Μανόμετρο = πίεση, όχι ποσότητα"},{"id":"m68","cat":"mech","n":68,"q":"Πόσους κατ' ελάχιστον εξωτερικούς καθρέπτες οπισθοσκοπήσεως πρέπει να φέρει ένα λεωφορείο:","o":["Δύο (2).","Τρεις (3).","Τέσσερις (4)."],"a":0,"ex":"Το ελάχιστο είναι δύο εξωτερικοί καθρέπτες, ένας αριστερά και ένας δεξιά.","tip":"Καθρέπτες = 2 (αριστερά + δεξιά)"},{"id":"m69","cat":"mech","n":69,"q":"Ποια είναι η βασική λειτουργία του διαφορικού:","o":["Να διαφοροποιεί τις στροφές του ενός κινητήριου τροχού από τον άλλο.","Να αυξάνει τον αριθμό των στροφών των κινητηρίων τροχών σε σχέση με αυτές του κεντρικού άξονα μεταδόσεως της κινήσεως.","Να αλλάξει τη φορά κινήσεως κατά 40 μοίρες."],"a":0,"ex":"Στη στροφή ο εξωτερικός τροχός πρέπει να γυρίσει περισσότερο από τον εσωτερικό. Το διαφορικό επιτρέπει στους δύο τροχούς να γυρίζουν με διαφορετικές στροφές.","tip":"Διαφορικό = διαφορετικές στροφές δεξιά-αριστερά"},{"id":"m70","cat":"mech","n":70,"q":"Ο διακόπτης κινδύνου, με τον οποίο είναι εφοδιασμένο κάθε λεωφορείο, που προορίζεται για να περιορίσει τον κίνδυνο πυρκαϊάς, όταν το όχημα είναι σε στάση, διακόπτει:","o":["Την παροχή του καυσίμου.","Το κύκλωμα του εσωτερικού φωτισμού κινδύνου.","Το κύκλωμα κεντρικού ηλεκτρονικού κλειδώματος θυρών."],"a":0,"ex":"Η φωτιά χρειάζεται καύσιμο. Ο διακόπτης κινδύνου κόβει την παροχή καυσίμου ώστε να μην τροφοδοτείται η φωτιά. Τα φώτα κινδύνου και οι πόρτες πρέπει να συνεχίσουν να λειτουργούν.","tip":"Φωτιά; Κόψε το καύσιμο"},{"id":"m73","cat":"mech","n":73,"q":"Γιατί, όταν πιέζετε το γκάζι, αυξάνεται η ισχύς που παράγεται από έναν κινητήρα Diesel:","o":["Γιατί ανοίγει περισσότερο η βαλβίδα εισαγωγής.","Γιατί φθάνει περισσότερη ποσότητα πετρελαίου στους εγχυτήρες καυσίμου.","Γιατί φθάνει στα μπουζί ρεύμα μεγαλύτερης εντάσεως."],"a":1,"ex":"Στο Diesel το γκάζι ελέγχει πόσο πετρέλαιο ψεκάζεται. Περισσότερο πετρέλαιο = περισσότερη δύναμη. Μπουζί έχει μόνο η βενζινομηχανή.","tip":"Diesel γκάζι = περισσότερο πετρέλαιο"},{"id":"m78","cat":"mech","n":78,"q":"Ποια είναι η λειτουργία του σιγαστήρα της εξατμίσεως:","o":["Να μειώσει την ταχύτητα εξαγωγής των καυσαερίων, για να μειωθεί ο θόρυβος.","Να μειώσει την ταχύτητα εξαγωγής των καυσαερίων, για να μειωθεί η κατανάλωση καυσίμου.","Να μειώσει την ταχύτητα εξαγωγής των καυσαερίων, για να ζεσταίνει τον εσωτερικό χώρο του οχήματος."],"a":0,"ex":"Σιγαστήρας = κάνει «σιγά». Είναι το σιλανσιέ: μειώνει τον θόρυβο της εξάτμισης.","tip":"Σιγαστήρας = σιωπή"},{"id":"e01","cat":"maint","n":1,"q":"Διαπιστώνεται χαμηλή θερμοκρασία στη λειτουργία του κινητήρα. Ποια μπορεί να είναι η πιθανή αιτία γι' αυτό:","o":["Η βλάβη του θερμοστάτη.","Η διακοπή ρεύματος στον ανεμιστήρα.","Η μικρή χωρητικότητα του ψυγείου."],"a":0,"ex":"Ο θερμοστάτης είναι μια «πόρτα» για το νερό. Αν κολλήσει ανοιχτός, το νερό πηγαίνει συνέχεια στο ψυγείο και η μηχανή δεν ζεσταίνεται ποτέ αρκετά. Οι άλλες δύο αιτίες θα έκαναν τη μηχανή να ζεσταθεί υπερβολικά.","tip":"Μηχανή κρύα = θερμοστάτης"},{"id":"e04","cat":"maint","n":4,"q":"Για να εγγυηθείτε την ασφάλεια της κυκλοφορίας και να αποφύγετε ατυχήματα είναι απαραίτητο, μεταξύ των άλλων:","o":["Να αλλάζετε τα λαμπάκια των φώτων με άλλα μεγαλύτερης αποδόσεως για να εξασφαλίσετε μία μεγαλύτερη διάρκεια ζωής.","Να καθαρίζετε συχνά τις φωτιστικές επιφάνειες των φώτων.","Να ελέγχετε περιοδικά την αποτελεσματικότητα και τη λειτουργικότητα των εφεδρικών λαμπτήρων."],"a":1,"ex":"Βρόμικα φανάρια φωτίζουν πολύ λιγότερο. Ο απλός καθαρισμός τους είναι το πιο σημαντικό. Δεν βάζεις ποτέ λάμπες διαφορετικές από αυτές που προβλέπει ο κατασκευαστής.","tip":"Καθαρά φανάρια = καλή ορατότητα"},{"id":"e08","cat":"maint","n":8,"q":"Για να επιτύχετε την ασφάλεια της κυκλοφορίας και να αποφύγετε τα ατυχήματα είναι απαραίτητο, μεταξύ των άλλων:","o":["Να αλλάζετε τις λάμπες με άλλες μεγαλύτερης τάσεως λειτουργίας, για να βελτιώσετε την αποτελεσματικότητα των φώτων.","Να αφήνετε λερωμένα με σκόνη τα τζάμια των φώτων για να αποφεύγετε το ξεθώριασμά τους.","Να ελέγχετε περιοδικά τη λειτουργία των φλάς."],"a":2,"ex":"Τα φλας λένε στους άλλους τι θα κάνεις. Αν δεν δουλεύουν, κανείς δεν ξέρει ότι στρίβεις. Γι' αυτό τα ελέγχεις τακτικά. Οι άλλες δύο απαντήσεις είναι λάθος πρακτικές.","tip":"Ελέγχεις τα φλας"},{"id":"e12","cat":"maint","n":12,"q":"Το ελάχιστο πάχος πέλματος των ελαστικών των κινητήριων αξόνων των λεωφορείων είναι:","o":["1,6 mm.","1,5 mm.","2 mm."],"a":0,"ex":"Το πέλμα είναι το «ανάγλυφο» του ελαστικού. Αν γίνει πιο λεπτό από 1,6 mm, το ελαστικό δεν διώχνει το νερό και γλιστράει. Πρέπει να αλλαχτεί.","tip":"Πέλμα τουλάχιστον 1,6 mm"},{"id":"e13","cat":"maint","n":13,"q":"Τι σημαίνει το άναμμα της ενδείξεως λαδιού στον πίνακα οργάνων κατά τη διάρκεια της κινήσεως του οχήματος:","o":["Ότι η γεννήτρια (δυναμό) δεν φορτίζει την μπαταρία.","Ότι η λίπανση είναι κανονική.","Ότι η πίεση του λαδιού είναι ανεπαρκής."],"a":2,"ex":"Η λυχνία του λαδιού ανάβει όταν η πίεση του λαδιού είναι πολύ χαμηλή. Η μηχανή κινδυνεύει: σταμάτα με ασφάλεια και έλεγξε. Για τη μπαταρία υπάρχει άλλη λυχνία.","tip":"Λυχνία λαδιού = χαμηλή πίεση, σταμάτα"},{"id":"e14","cat":"maint","n":14,"q":"Τι πρέπει να ελέγχετε περιοδικά ώστε να περιορίσετε την κατανάλωση καυσίμου:","o":["Το επίπεδο του υγρού ψύξεως του κινητήρα.","Το βάθος του πέλματος των ελαστικών.","Την πίεση των ελαστικών."],"a":2,"ex":"Ξεφούσκωτα ελαστικά «κολλάνε» στον δρόμο και το όχημα χρειάζεται περισσότερη δύναμη για να κινηθεί. Άρα καίει περισσότερο καύσιμο.","tip":"Σωστή πίεση ελαστικών = λιγότερο καύσιμο"},{"id":"e17","cat":"maint","n":17,"q":"Από τι προκαλείται η υπερθέρμανση των ταμπούρων των τροχών:","o":["Από την κακή λειτουργία του διαφορικού.","Από αντικανονική πίεση στα ελαστικά των τροχών.","Από κακή λειτουργία των επανατατικών ελατηρίων των σιαγόνων."],"a":2,"ex":"Τα επανατατικά ελατήρια τραβούν τις σιαγόνες (τα «τακάκια» του ταμπούρου) πίσω όταν αφήνεις το φρένο. Αν δεν δουλεύουν, οι σιαγόνες τρίβονται συνέχεια και το ταμπούρο ζεσταίνεται.","tip":"Ζεστό ταμπούρο = οι σιαγόνες δεν γυρίζουν πίσω"},{"id":"e19","cat":"maint","n":19,"q":"Κάθε πότε πρέπει ο οδηγός να ελέγχει την ποσότητα λαδιού στον κινητήρα:","o":["Πριν ξεκινήσει για μεγάλη διαδρομή.","Καθημερινά.","Όταν ανάψει η ενδεικτική λυχνία της πιέσεως του λαδιού."],"a":1,"ex":"Ο επαγγελματίας οδηγός ελέγχει το λάδι κάθε μέρα. Αν περιμένεις να ανάψει η λυχνία, είναι ήδη αργά.","tip":"Λάδι = κάθε μέρα","cf":1},{"id":"e20","cat":"maint","n":20,"q":"Όταν ο εκκινητής (μίζα) δεν μπορεί να λειτουργήσει, ποια είναι η πιθανή αιτία γι' αυτό:","o":["Έχει κοπεί ο ιμάντας.","Υπάρχει διακοπή ρεύματος μεταξύ συσσωρευτή και εκκινητήρα.","Δεν λειτουργεί καλά ο πολλαπλασιαστής."],"a":1,"ex":"Η μίζα είναι ηλεκτρικό μοτέρ που παίρνει ρεύμα από τη μπαταρία (συσσωρευτή). Αν το ρεύμα δεν φτάνει, η μίζα δεν γυρίζει.","tip":"Μίζα νεκρή = δεν φτάνει ρεύμα"},{"id":"e23","cat":"maint","n":23,"q":"Όταν ο πετρελαιοκινητήρας εκπέμπει υπερβολική αιθάλη (κάπνα), τι πρέπει να κάνετε:","o":["Να αλλάξετε το λάδι λιπάνσεως.","Να επισκευάσετε αμέσως τον κινητήρα.","Να ελέγξετε και να ρυθμίσετε την αντλία και τους εγχυτήρες καυσίμου (μπεκ) και να καθαρίσετε το φίλτρο αέρα."],"a":2,"ex":"Μαύρη κάπνα σημαίνει πολύ πετρέλαιο και λίγος αέρας. Ρυθμίζεις τα μπεκ (λιγότερο πετρέλαιο) και καθαρίζεις το φίλτρο αέρα (περισσότερος αέρας).","tip":"Μαύρος καπνός = μπεκ + φίλτρο αέρα"},{"id":"e26","cat":"maint","n":26,"q":"Διαπιστώνετε ότι ο πετρελαιοκινητήρας του λεωφορείου σας, ενώ τίθεται σε λειτουργία, σταματά έπειτα από λίγες στροφές. Ποια μπορεί να είναι η αιτία γι' αυτό:","o":["Η χαμηλή συμπίεση των κυλίνδρων.","Η έμφραξη του συστήματος τροφοδοσίας.","Ο κακός εσωτερικός χρονισμός της αντλίας εγχύσεως."],"a":1,"ex":"Η μηχανή παίρνει μπρος, αλλά μετά «πεινάει» και σβήνει. Το καύσιμο δεν φτάνει γιατί κάτι έχει βουλώσει (π.χ. φίλτρο πετρελαίου).","tip":"Παίρνει μπρος και σβήνει = βούλωσε το καύσιμο"},{"id":"e28","cat":"maint","n":28,"q":"Όταν το σύστημα τροφοδοσίας είναι καλά ρυθμισμένο, πού οφείλεται η εκπομπή γαλάζιου καπνού από πετρελαιοκινητήρα:","o":["Στο ότι ο οδηγός χρησιμοποιεί μεγάλη ταχύτητα.","Στο ότι ο κινητήρας δεν έχει το κανονικό αβάνς.","Στο ότι ο κινητήρας έχει μεγάλη κατανάλωση λαδιού."],"a":2,"ex":"Γαλάζιος καπνός = καίγεται λάδι. Τα χρώματα του καπνού: μαύρος = πολύ καύσιμο, γαλάζιος = λάδι, άσπρος = νερό.","tip":"Γαλάζιος = λάδι"},{"id":"e32","cat":"maint","n":32,"q":"Εάν τα ελαστικά του αυτοκινήτου σας έχουν πίεση μεγαλύτερη της κανονικής, πού θα παρουσιάσουν αυξημένη φθορά:","o":["Στις πλευρές του πέλματος.","Στο μέσο (κέντρο) του πέλματος.","Μόνο στην εσωτερική πλευρά του πέλματος."],"a":1,"ex":"Ένα παραφουσκωμένο ελαστικό «φουσκώνει» στη μέση και πατάει κυρίως με το κέντρο, γι' αυτό φθείρεται εκεί. Με λίγη πίεση φθείρονται οι πλευρές.","tip":"Πολύς αέρας = φθορά στη μέση"},{"id":"e35","cat":"maint","n":35,"q":"Διαπιστώνετε ότι ένα αεροφυλάκιο του συστήματος πεδήσεως με πεπιεσμένο αέρα (αερόφρενο) έχει τρυπήσει. Τι πρέπει να κάνετε:","o":["Να φροντίσετε για την επισκευή του με συγκόλληση.","Να το απομονώσετε από το λοιπό κύκλωμα.","Να φροντίσετε για την άμεση αντικατάστασή του."],"a":2,"ex":"Το αεροφυλάκιο κρατάει αέρα με μεγάλη πίεση και είναι κομμάτι των φρένων. Δεν το κολλάς ούτε το βγάζεις από το κύκλωμα: το αλλάζεις αμέσως.","tip":"Τρύπιο αεροφυλάκιο = καινούργιο"},{"id":"e37","cat":"maint","n":37,"q":"Διαπιστώνετε ότι στα καυσαέρια ενός πετρελαιοκινητήρα υπάρχει άσπρος καπνός. Ποια πρέπει να είναι η πιθανή αιτία:","o":["Να έχει εισέλθει νερό στους κυλίνδρους.","Να έχει υπερθερμανθεί ο πετρελαιοκινητήρας.","Να υπάρχει μεγάλη κατανάλωση λαδιού."],"a":0,"ex":"Άσπρος καπνός είναι ατμός: νερό μπήκε στους κυλίνδρους και έγινε ατμός. Θυμήσου: άσπρος = νερό, γαλάζιος = λάδι, μαύρος = καύσιμο.","tip":"Άσπρος = νερό"},{"id":"e38","cat":"maint","n":38,"q":"Τα χαλασμένα αμορτισέρ προκαλούν:","o":["Μικρότερη πλευρική κλίση του οχήματος στις στροφές.","Μη κανονική συμπεριφορά του οχήματος ειδικά στις στροφές.","Μη κανονική λειτουργία του κινητήρα."],"a":1,"ex":"Χωρίς καλά αμορτισέρ το όχημα κουνιέται και γέρνει πολύ, ειδικά στις στροφές. Τα ελαστικά χάνουν επαφή με τον δρόμο. Με τη μηχανή δεν έχουν σχέση.","tip":"Κακά αμορτισέρ = κακή στροφή"},{"id":"e39","cat":"maint","n":39,"q":"Ο σκοπός της αντλίας αντιπηκτικού σε ένα σύστημα πεδήσεως με πεπιεσμένο αέρα είναι:","o":["Να διατηρεί σταθερή την πίεση στο σύστημα.","Να τροφοδοτεί το σύστημα με πεπιεσμένο αέρα για να διατηρούνται σταθερές οι τιμές της ανώτερης και κατώτερης πιέσεως λειτουργίας στα αεροφυλάκια.","Να ψεκάζει με αντιπηκτικό υγρό τον πεπιεσμένο αέρα, για να μην παγώνουν τα διάφορα εξαρτήματα στις πολύ χαμηλές θερμοκρασίες."],"a":2,"ex":"Αντι-πηκτικό = κατά του πάγου. Ο αέρας έχει υγρασία που μπορεί να παγώσει μέσα στις βαλβίδες τον χειμώνα. Η αντλία ψεκάζει αντιπηκτικό για να μην παγώσουν.","tip":"Αντιπηκτικό = να μην παγώσει"},{"id":"e40","cat":"maint","n":40,"q":"Για την ασφάλεια της κυκλοφορίας είναι χρήσιμο:","o":["Να φουσκώσετε τα ελαστικά σε πίεση μικρότερη από εκείνη που συνιστά ο κατασκευαστής.","Να ελέγξετε την πίεση των ελαστικών πριν από το ταξίδι.","Να οδηγείτε με τη χρήση των φώτων πορείας."],"a":1,"ex":"Πριν από κάθε ταξίδι ελέγχεις την πίεση των ελαστικών. Λάθος πίεση σημαίνει χειρότερο φρενάρισμα και κίνδυνο να σκάσει το λάστιχο.","tip":"Πριν το ταξίδι: πίεση ελαστικών"},{"id":"e42","cat":"maint","n":42,"q":"Η πρόσφυση μεταξύ ελαστικών και δρόμου επηρεάζεται από:","o":["Τον αυξημένο αριθμό στροφών του κινητήρα.","Την εξωτερική θερμοκρασία.","Την ποιότητα και την πίεση των ελαστικών."],"a":2,"ex":"Το πόσο «κρατάει» το λάστιχο στον δρόμο εξαρτάται από το ίδιο το λάστιχο: την ποιότητά του και τη σωστή πίεση.","tip":"Κράτημα = ποιότητα + πίεση ελαστικών"},{"id":"e43","cat":"maint","n":43,"q":"Τι θα συμβεί, όταν η κλίση των πίρων των ακραξονίων δεν είναι κανονική:","o":["Δε θα έχετε κανονική επαναφορά του τιμονιού και σταθερότητα διευθύνσεως.","Θα έχομε πρόωρη φθορά του συστήματος διευθύνσεως.","Δεν μπορείτε να στρίψετε εύκολα το όχημα."],"a":0,"ex":"Η κλίση αυτή κάνει το τιμόνι να γυρίζει μόνο του ίσια μετά τη στροφή και κρατά το όχημα σταθερό. Αν είναι λάθος, το τιμόνι δεν επανέρχεται και το όχημα «πλέει».","tip":"Λάθος κλίση = το τιμόνι δεν γυρίζει μόνο του ίσια"},{"id":"t01","cat":"tacho","n":1,"q":"Σε περίπτωση βλάβης της συσκευής του ταχογράφου, ποια υποχρέωση έχει ο οδηγός του αυτοκινήτου:","o":["Να ειδοποιήσει τον ιδιοκτήτη του οχήματος.","Να φροντίσει για την ταχεία επισκευή της, αναφέροντας το γεγονός στην πλησιέστερη αστυνομική αρχή.","Να επισκευάσει τη συσκευή, όταν μπορέσει."],"a":1,"ex":"Ο ταχογράφος είναι υποχρεωτικός. Αν χαλάσει, πρέπει να επισκευαστεί γρήγορα και να το δηλώσεις στην αστυνομία, ώστε να φαίνεται ότι δεν τον χάλασες επίτηδες.","tip":"Χαλασμένος ταχογράφος = αστυνομία + γρήγορη επισκευή"},{"id":"t02","cat":"tacho","n":2,"q":"Για πόσο χρόνο πρέπει να φυλάσσονται τα φύλλα καταγραφής (δίσκοι - ταινίες) των ταχογράφων μετά τη χρήση τους:","o":["6 μήνες.","12 μήνες.","24 μήνες."],"a":1,"ex":"Οι δίσκοι του ταχογράφου φυλάσσονται 12 μήνες (ένα χρόνο). Τους φυλάει ο ιδιοκτήτης του οχήματος.","tip":"Δίσκοι = 1 χρόνος"},{"id":"t04","cat":"tacho","n":4,"q":"Στην άδεια κυκλοφορίας λεωφορείου που φέρει σύστημα περιορισμού ταχύτητας, πρέπει να αναγράφεται η εξής παρατήρηση:","o":["«Φέρει σύστημα περιορισμού ταχύτητας».","«Φέρει σύστημα περιορισμού ταχύτητας. Επιτρέπει ταχύτητα μεγαλύτερη των 100 km/h».","«Φέρει σύστημα περιορισμού ταχύτητας. Μέγιστη ταχύτητα 100 km/h»."],"a":2,"ex":"Η άδεια κυκλοφορίας γράφει και ότι υπάρχει κόφτης και σε ποια ταχύτητα: 100 km/h. Είναι η πιο πλήρης απάντηση.","tip":"Άδεια: κόφτης + 100 km/h"},{"id":"t05","cat":"tacho","n":5,"q":"Το σύστημα περιορισμού ταχύτητας με το οποίο είναι εφοδιασμένο το λεωφορείο επενεργεί:","o":["Στο σύστημα πεδήσεως.","Στο σύστημα τροφοδοσίας καυσίμου.","Στο σύστημα εξαγωγής καυσαερίων."],"a":1,"ex":"Ο κόφτης δεν φρενάρει. Απλώς κόβει το καύσιμο όταν φτάσεις στα 100 km/h, οπότε το λεωφορείο δεν επιταχύνει άλλο.","tip":"Κόφτης = κόβει καύσιμο"},{"id":"t06","cat":"tacho","n":6,"q":"Ο οδηγός λεωφορείου που φέρει σύστημα περιορισμού ταχύτητας:","o":["Δεν επιτρέπεται να αυξήσει προσωρινά ή μόνιμα το όριο ταχύτητας του περιοριστή.","Επιτρέπεται να αυξήσει προσωρινά το όριο ταχύτητας του περιοριστή.","Επιτρέπεται να αυξήσει μόνιμα το όριο ταχύτητας του περιοριστή."],"a":0,"ex":"Ο κόφτης δεν πειράζεται ποτέ: ούτε για λίγο ούτε για πάντα.","tip":"Τον κόφτη δεν τον αγγίζεις"},{"id":"t07","cat":"tacho","n":7,"q":"Ο οδηγός λεωφορείου, το οποίο είναι εφοδιασμένο με σύστημα περιορισμού της ταχύτητας, πρέπει εκτός των άλλων να έχει πάντα μαζί του τα εξής έγγραφα, όσον αφορά το εν λόγω σύστημα:","o":["Βεβαίωση του αντιπροσώπου ή βεβαίωση του εξουσιοδοτημένου συνεργείου τοποθετήσεως.","Τεχνικό εγχειρίδιο του συστήματος (προσπέκτους).","Την εγγύηση του συστήματος."],"a":0,"ex":"Σε έλεγχο πρέπει να αποδείξεις ότι ο κόφτης τοποθετήθηκε σωστά. Αυτό το δείχνει η βεβαίωση του συνεργείου που τον τοποθέτησε.","tip":"Κόφτης: βεβαίωση συνεργείου"},{"id":"t08","cat":"tacho","n":8,"q":"Τα λεωφορεία, που φέρουν σύστημα περιορισμού ταχύτητας, πρέπει να φέρουν ταχογράφο:","o":["Όχι.","Μπορούν να φέρουν προαιρετικά.","Ναι."],"a":2,"ex":"Ο κόφτης και ο ταχογράφος κάνουν διαφορετικές δουλειές. Ο κόφτης περιορίζει την ταχύτητα, ο ταχογράφος καταγράφει τις ώρες. Χρειάζονται και τα δύο.","tip":"Κόφτης ΚΑΙ ταχογράφος"},{"id":"t09","cat":"tacho","n":9,"q":"Τα αστικά λεωφορεία υποχρεούνται να φέρουν σύστημα περιορισμού ταχύτητας σύμφωνα με την οδηγία 92/6/ΕΕ:","o":["Όχι.","Ναι."],"a":0,"ex":"Τα αστικά λεωφορεία κινούνται μέσα στην πόλη και δεν πλησιάζουν ποτέ τα 100 km/h. Γι' αυτό η οδηγία δεν τα υποχρεώνει να έχουν κόφτη.","tip":"Αστικό = δεν χρειάζεται κόφτη"},{"id":"t10","cat":"tacho","n":10,"q":"Τα λεωφορεία πρέπει να φέρουν το σύστημα του περιορισμού ταχύτητας σύμφωνα με την οδηγία 92/6/ΕΕ εφόσον έχουν ταξινομηθεί σε χώρα της Ευρωπαϊκής Ενώσεως για πρώτη φορά μετά την:","o":["1 Ιανουαρίου 1984.","1 Ιανουαρίου 1985.","1 Ιανουαρίου 1988."],"a":2,"ex":"Λεωφορεία που ταξινομήθηκαν μετά την 1η Ιανουαρίου 1988 πρέπει να έχουν κόφτη.","tip":"Κόφτης για λεωφορεία μετά το 1988"},{"id":"t11","cat":"tacho","n":11,"q":"Τα λεωφορεία, που εκ κατασκευής δεν μπορούν να υπερβούν την ταχύτητα των 100 km/h, πρέπει να εφοδιασθούν με σύστημα περιορισμού της ταχύτητας;","o":["Ναι.","Όχι."],"a":1,"ex":"Ο κόφτης υπάρχει για να μην ξεπεράσει το λεωφορείο τα 100 km/h. Αν το λεωφορείο από κατασκευή δεν μπορεί να τα ξεπεράσει, δεν τον χρειάζεται.","tip":"Δεν φτάνει τα 100; Δεν χρειάζεται κόφτη"},{"id":"t12","cat":"tacho","n":12,"q":"Για ποιους λόγους επιβλήθηκε η χρήση του συστήματος περιορισμού της ταχύτητας στα λεωφορεία:","o":["Για τη βελτίωση της οδικής συμπεριφοράς του λεωφορείου.","Για λόγους ανέσεως των επιβατών.","Για περιβαλλοντικούς λόγους και λόγους οδικής ασφάλειας."],"a":2,"ex":"Χαμηλότερη ταχύτητα σημαίνει λιγότερα ατυχήματα (ασφάλεια) και λιγότερο καύσιμο και ρύπους (περιβάλλον).","tip":"Κόφτης = ασφάλεια + περιβάλλον"},{"id":"t13","cat":"tacho","n":13,"q":"Ο περιοριστής ταχύτητας (κόφτης) τοποθετείται στα λεωφορεία, σε εφαρμογή της οδηγίας 92/6/ΕΟΚ, και περιορίζει την ταχύτητα αυτών σε:","o":["90 km/h.","100 km/h.","110 km/h."],"a":1,"ex":"Ο κόφτης των λεωφορείων ρυθμίζεται στα 100 km/h. Πιο γρήγορα το λεωφορείο δεν μπορεί να πάει.","tip":"Κόφτης = 100"},{"id":"t14","cat":"tacho","n":14,"q":"Πριν το φύλλο καταγραφής (δίσκος ή ταινία) εισαχθεί στη συσκευή του ταχογράφου, ο οδηγός πρέπει:","o":["Να συμπληρώσει σε αυτό τα στοιχεία, που προβλέπονται από τις σχετικές για τους ταχογράφους διατάξεις.","Να το τοποθετήσει στη συσκευή χωρίς καμιά συμπλήρωση.","Να αναγράψει σε αυτό μόνο το ονοματεπώνυμό του."],"a":0,"ex":"Πριν βάλεις τον δίσκο, γράφεις όλα τα στοιχεία που ζητά ο νόμος (όνομα, ημερομηνία, τόπο, χιλιόμετρα, πινακίδα). Αλλιώς ο δίσκος δεν αποδεικνύει τίποτα.","tip":"Πρώτα συμπληρώνεις, μετά βάζεις"},{"id":"t15","cat":"tacho","n":15,"q":"Η συσκευή του ταχογράφου πρέπει να ευρίσκεται σε λειτουργία:","o":["Ολόκληρο το εικοσιτετράωρο χωρίς διακοπή.","Για 10 ώρες.","Για 15 ώρες."],"a":0,"ex":"Ο ταχογράφος καταγράφει και την οδήγηση και την ανάπαυση. Γι' αυτό δουλεύει όλο το 24ωρο, χωρίς διακοπή.","tip":"Ταχογράφος = 24 ώρες"},{"id":"t16","cat":"tacho","n":16,"q":"Ποιος έχει την υποχρέωση να φυλάσσει για ένα χρόνο τα φύλλα καταγραφής (δίσκους-ταινίες) του ταχογράφου του λεωφορείου:","o":["Ο ιδιοκτήτης του οχήματος.","Η αρμόδια αστυνομική αρχή.","Ο οδηγός του οχήματος."],"a":0,"ex":"Ο ιδιοκτήτης (η εταιρεία) φυλάει τους δίσκους για ένα χρόνο, για να μπορούν να γίνουν έλεγχοι. Ο οδηγός κρατά μαζί του μόνο τους πρόσφατους.","tip":"Τους φυλάει ο ιδιοκτήτης"},{"id":"t17","cat":"tacho","n":17,"q":"Ο οδηγός του λεωφορείου, εκτός από το κλειδί του ταχογράφου, πρέπει να έχει στο λεωφορείο και να επιδεικνύει, αν του ζητηθεί, τα φύλλα καταγραφής ταχύτητας:","o":["Της προηγούμενης ημέρας.","Των πέντε (5) προηγουμένων ημερών.","Των δεκαπέντε (15) προηγουμένων ημερών."],"a":2,"ex":"Σύμφωνα με το βιβλίο, ο οδηγός έχει μαζί του τους δίσκους των 15 προηγούμενων ημερών, για να τους δείξει σε έλεγχο.","tip":"Μαζί σου: 15 μέρες"},{"id":"a01","cat":"admin","n":1,"q":"Η στάθμευση των λεωφορείων σε οδούς εντός κατοικημένων περιοχών πόσες συνεχείς ώρες επιτρέπεται:","o":["Μέχρι 12 ώρες.","Μέχρι 24 ώρες.","Όσες ώρες θέλει ο ιδιοκτήτης ή ο οδηγός του."],"a":1,"ex":"Ένα λεωφορείο μέσα στην πόλη μπορεί να μείνει σταθμευμένο στον δρόμο το πολύ 24 ώρες συνεχώς.","tip":"Στάθμευση στην πόλη: έως 24 ώρες"},{"id":"a02","cat":"admin","n":2,"q":"Επειδή τα λεωφορεία, όταν είναι σταθμευμένα εντός κατοικημένων περιοχών, προεξέχουν από τα υπόλοιπα οχήματα και παρακωλύουν την ορατότητα των πεζών, πρέπει να αποφεύγεται η στάθμευση στις οδούς:","o":["Ναι.","Όχι."],"a":0,"ex":"Ένα μεγάλο λεωφορείο κρύβει τους πεζούς, ειδικά τα παιδιά, από τους οδηγούς. Γι' αυτό καλύτερα να μη σταθμεύει στους δρόμους της πόλης.","tip":"Το λεωφορείο κρύβει τους πεζούς"},{"id":"a03","cat":"admin","n":3,"q":"Όταν ένα λεωφορείο πάθει βλάβη στο επαρχιακό οδικό δίκτυο σε πόση απόσταση πρέπει ο οδηγός να τοποθετήσει το τρίγωνο προειδοποιήσεως:","o":["Σε απόσταση τουλάχιστον 20 m.","Σε απόσταση τουλάχιστον 50 m.","Σε απόσταση τουλάχιστον 100 m."],"a":1,"ex":"Ο πίνακας λύσεων του βιβλίου δίνει 50 m στο επαρχιακό δίκτυο. Το τρίγωνο πρέπει να είναι αρκετά μακριά ώστε οι άλλοι να προλάβουν να κόψουν ταχύτητα.","tip":"Επαρχία: τρίγωνο στα 50 m","cf":1},{"id":"a05","cat":"admin","n":5,"q":"Μετά από συνεχή οδήγηση τεσσεράμισι ωρών, πόσος είναι ο χρόνος της διακοπής για την ανάπαυση του οδηγού λεωφορείου:","o":["Δέκα πρώτα λεπτά.","Τριάντα πρώτα λεπτά.","Σαράντα πέντε πρώτα λεπτά."],"a":2,"ex":"Μετά από 4,5 ώρες οδήγηση ακολουθεί διάλειμμα 45 λεπτών. Τα νούμερα μοιάζουν: 4 και μισή ώρες → 45 λεπτά.","tip":"4,5 ώρες → 45 λεπτά"},{"id":"a07","cat":"admin","n":7,"q":"Κάθε λεωφορείο πρέπει να είναι εφοδιασμένο με δύο (2) πυροσβεστήρες ξηράς κόνεως ή άλλου εγκεκριμένου από το Πυροσβεστικό Σώμα υλικού ισοδύναμης κατασβεστικής ικανότητας, με καθαρό βάρος ο καθένας:","o":["6 kg.","8 kg.","10 kg."],"a":0,"ex":"Ο πίνακας λύσεων του βιβλίου δίνει 6 kg για κάθε πυροσβεστήρα. Δύο πυροσβεστήρες, ώστε να υπάρχει ένας ακόμα κι αν ο πρώτος αδειάσει.","tip":"2 πυροσβεστήρες × 6 kg","cf":1},{"id":"a08","cat":"admin","n":8,"q":"Οι ζώνες ασφαλείας για τους επιβάτες είναι υποχρεωτικές:","o":["Στα λεωφορεία μεταφοράς προσωπικού.","Στα τουριστικά λεωφορεία.","Στα σχολικά λεωφορεία."],"a":2,"ex":"Τα σχολικά μεταφέρουν παιδιά, που χρειάζονται τη μεγαλύτερη προστασία. Γι' αυτό εκεί οι ζώνες για τους επιβάτες είναι υποχρεωτικές.","tip":"Σχολικά = ζώνες για όλα τα παιδιά"},{"id":"a09","cat":"admin","n":9,"q":"Στα τουριστικά λεωφορεία ζώνες ασφαλείας πρέπει να φορούν:","o":["Ο οδηγός και ο ξεναγός.","Οι επιβάτες.","Ο ξεναγός."],"a":2,"ex":"Σύμφωνα με τον πίνακα λύσεων του βιβλίου, η σωστή απάντηση είναι ο ξεναγός. Ο ξεναγός κάθεται συνήθως μπροστά, στη θέση με τον μεγαλύτερο κίνδυνο.","tip":"Τουριστικό: ζώνη ο ξεναγός"},{"id":"a10","cat":"admin","n":10,"q":"Εάν αλλάξετε τον εξωτερικό χρωματισμό του οχήματός σας:","o":["Έχετε υποχρέωση να το δηλώσετε στην Υπηρεσία που σας εξέδωσε την άδεια κυκλοφορίας του οχήματος.","Δεν έχετε καμιά υποχρέωση, εφόσον γράψετε πάλι τις εξωτερικές ενδείξεις, που πρέπει να φέρει το όχημα.","Η υποχρέωσή σας να το δηλώσετε εξαρτάται από το μέγιστο μικτό φορτίο του οχήματος."],"a":0,"ex":"Το χρώμα είναι γραμμένο στην άδεια κυκλοφορίας. Αν το αλλάξεις, πρέπει να το δηλώσεις στην υπηρεσία που έβγαλε την άδεια.","tip":"Νέο χρώμα = δήλωση"},{"id":"a11","cat":"admin","n":11,"q":"Σε περίπτωση που η εμπρόσθια πινακίδα κυκλοφορίας του οχήματος κοπεί στα δύο, τότε πρέπει:","o":["Να στερεωθούν τα δύο τμήματα μαζί.","Να αποταθείτε στην αρμόδια Υπηρεσία Συγκοινωνιών για αντικατάσταση.","Να αγοράσετε και να τοποθετήσετε μία ανταλλακτική πινακίδα."],"a":1,"ex":"Τις πινακίδες τις δίνει μόνο η Υπηρεσία Συγκοινωνιών. Δεν τις κολλάς και δεν τις αγοράζεις αλλού.","tip":"Σπασμένη πινακίδα = Υπηρεσία Συγκοινωνιών"},{"id":"a12","cat":"admin","n":12,"q":"Κατά την κυκλοφορία, η χρήση των φώτων ομίχλης:","o":["Δεν επιτρέπεται στα τούνελ.","Είναι υποχρεωτική σε περίπτωση πυκνής ομίχλης τόσο στα αστικά κέντρα όσο και εκτός αυτών.","Είναι υποχρεωτική ακόμα και κατά τη διάρκεια της ημέρας, όταν προσπερνάτε στρατιωτική φάλαγγα."],"a":1,"ex":"Τα φώτα ομίχλης ανάβουν όταν υπάρχει πυκνή ομίχλη, μέσα και έξω από την πόλη.","tip":"Πυκνή ομίχλη = φώτα ομίχλης παντού"},{"id":"a13","cat":"admin","n":13,"q":"Οι ζώνες ασφαλείας:","o":["Είναι τα μοναδικά συστήματα ασφαλείας που έχουν προβλεφθεί στα αυτοκίνητα.","Είναι ασήμαντης χρησιμότητας στην κυκλοφορία.","Πρέπει να είναι εγκεκριμένου τύπου και να διατηρούνται πάντα σε καλή κατάσταση."],"a":2,"ex":"Οι ζώνες σώζουν ζωές μόνο αν είναι εγκεκριμένες και σε καλή κατάσταση. Οι άλλες δύο απαντήσεις είναι προφανώς λάθος.","tip":"Ζώνες: εγκεκριμένες + σε καλή κατάσταση"},{"id":"a14","cat":"admin","n":14,"q":"Τα λεωφορεία πρέπει
