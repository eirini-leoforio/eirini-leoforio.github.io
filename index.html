digkeit"}, "s17": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Mindestgeschwindigkeit je Fahrstreifen.", "Höchstgeschwindigkeit je Fahrstreifen.", "Allgemeine Geschwindigkeitsgrenzen."], "ex": "Hier stehen die Zahlen in blauen Kreisen. Blauer Kreis = Gebot, also eine Mindestgeschwindigkeit: auf diesem Fahrstreifen nicht langsamer fahren.", "tip": "Blauer Kreis = MINDESTENS diese Geschwindigkeit"}, "s18": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Mindestgeschwindigkeit je Fahrstreifen.", "Höchstgeschwindigkeit je Fahrstreifen.", "Allgemeine Geschwindigkeitsgrenzen."], "ex": "Das Schild „GREECE“ steht an der Grenze. Es zeigt die allgemeinen Limits des Landes: 50 innerorts, 90 außerorts, 120 auf der Autobahn.", "tip": "GREECE = allgemeine Limits des Landes"}, "s19": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Richtung zur Autobahnausfahrt.", "Richtung zur Autobahnauffahrt.", "Vorankündigung eines Autobahnkreuzes."], "ex": "Ein grüner Pfeil mit dem Autobahnsymbol zeigt, wo du auf die Autobahn kommst. Das Ausfahrtsschild sagt „ΕΞΟΔΟΣ / EXIT“.", "tip": "Autobahnsymbol auf dem Pfeil = Auffahrt"}, "s20": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Richtung zur Autobahnausfahrt.", "Richtung zur Autobahnauffahrt.", "Vorankündigung eines Autobahnkreuzes."], "ex": "„ΚΟΜΒΟΣ / INTERCHANGE 2000 m“: In 2 km kommt ein Autobahnkreuz. Das Schild kündigt es vorher an, damit du dich vorbereiten kannst.", "tip": "Kreuz + Entfernung = Vorankündigung"}, "s21": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Richtung zur Autobahnausfahrt.", "Richtung zur Autobahnauffahrt.", "Vorankündigung eines Autobahnkreuzes."], "ex": "Es steht „ΕΞΟΔΟΣ / EXIT“ darauf und es hat Pfeilform: Es zeigt, wo du die Autobahn verlässt.", "tip": "ΕΞΟΔΟΣ = Ausfahrt"}, "s22": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Kreuzung, an der rechts vor links gilt.", "Einmündung von rechts, deren Verkehr Vorrang gewähren muss.", "Kreuzung mit einer Vorfahrtstraße."], "ex": "Das „X“ im Dreieck bedeutet eine Kreuzung ohne besondere Schilder. Es gilt die Grundregel: Wer von rechts kommt, hat Vorrang.", "tip": "X = rechts vor links"}, "s23": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Kreuzung, an der rechts vor links gilt.", "Einmündung von rechts, deren Verkehr Vorrang gewähren muss.", "Kreuzung mit einer Vorfahrtstraße."], "ex": "Die dicke Linie ist deine Straße (Hauptstraße). Die dünne Linie rechts ist eine kleinere Straße. Der Verkehr von dort muss dich vorlassen.", "tip": "Dicke Linie = du. Dünne Linie = die warten"}, "s24": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Vorfahrt gewähren.", "Vorfahrtstraße.", "Ende der Vorfahrtstraße."], "ex": "Das auf dem Kopf stehende Dreieck ist ein einmaliges Schild: „Vorfahrt gewähren“. Du musst den Verkehr auf der anderen Straße vorlassen.", "tip": "Umgedrehtes Dreieck = du lässt vor"}, "s25": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Vorfahrt gewähren.", "Vorfahrtstraße.", "Ende der Vorfahrtstraße."], "ex": "Die gelbe Raute bedeutet: Du bist auf einer Vorfahrtstraße. An Kreuzungen fährst du zuerst.", "tip": "Gelbe Raute = du hast Vorfahrt"}, "s26": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Vorfahrt gewähren.", "Vorfahrtstraße.", "Ende der Vorfahrtstraße."], "ex": "Dieselbe gelbe Raute mit schwarzem Strich: Die Vorfahrtstraße endet. Ab hier gilt wieder rechts vor links.", "tip": "Raute + Strich = Ende der Vorfahrt"}, "s28": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Gefährliche Rechtskurve.", "Vorgeschriebene Fahrtrichtung rechts.", "Rechts an der Insel oder dem Hindernis vorbeifahren."], "ex": "Ein Dreieck warnt vor einer Gefahr. Die Kurve zeigt: Vorne kommt eine gefährliche Rechtskurve. Langsamer fahren.", "tip": "Dreieck = Warnung, Gefahr"}, "s29": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Gefährliche Rechtskurve.", "Vorgeschriebene Fahrtrichtung rechts.", "Rechts an der Insel oder dem Hindernis vorbeifahren."], "ex": "Blauer Kreis = Gebot. Der Pfeil geht geradeaus und dann nach rechts: Du musst rechts abbiegen.", "tip": "Blauer Kreis = MUSS"}, "s30": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Gefährliche Rechtskurve.", "Vorgeschriebene Fahrtrichtung rechts.", "Rechts an der Insel oder dem Hindernis vorbeifahren."], "ex": "Ein blauer Kreis mit schrägem Pfeil nach rechts unten: Du musst rechts an der Insel oder dem Hindernis vorbeifahren. Steht meist auf Verkehrsinseln.", "tip": "Schräger Pfeil = rechts am Hindernis vorbei"}, "s31": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Schleudergefahr.", "Gefährliche Doppelkurve, zuerst links.", "Gefährliche Doppelkurve, zuerst rechts."], "ex": "Lies die Zeichnung von unten nach oben, so wie du fährst. Von unten geht die Linie zuerst nach links, dann nach rechts.", "tip": "Schild von UNTEN nach oben lesen"}, "s32": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Schleudergefahr.", "Gefährliche Doppelkurve, zuerst links.", "Gefährliche Doppelkurve, zuerst rechts."], "ex": "Dasselbe Schild, andersherum gezeichnet. Von unten nach oben geht die Linie zuerst nach rechts, dann nach links.", "tip": "Von unten: In welche Richtung zuerst?"}, "s33": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Schleudergefahr.", "Gefährliche Doppelkurve, zuerst links.", "Gefährliche Doppelkurve, zuerst rechts."], "ex": "Das Auto mit den Schlangenlinien dahinter rutscht. Das Schild warnt vor rutschiger Fahrbahn (Regen, Öl).", "tip": "Auto mit „Schlangen“ = rutschig"}, "s34": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Fahrstreifen nur für Busse oder Oberleitungsbusse.", "Annäherung an eine Haltestelle für Busse oder Oberleitungsbusse.", "Straße für alle Fahrzeuge außer Busse oder Oberleitungsbusse."], "ex": "Blauer Kreis = Gebot. Mit einem Bus darin heißt das: Nur Busse und Oberleitungsbusse dürfen hier fahren (Busspur).", "tip": "Blauer Kreis mit Bus = nur Busse"}, "w02": {"q": "Laut Gesetz ist das zulässige Gesamtgewicht:", "o": ["Das größte Gewicht, das das Fahrzeug tragen kann.", "Das größte Gewicht des beladenen Fahrzeugs, das als Gesamtgewicht im Fahrzeugschein steht.", "Das größte Gewicht an Ladung, mit dem das Fahrzeug beladen werden darf."], "ex": "Das zulässige Gesamtgewicht ist das ganze beladene Fahrzeug: Fahrzeug + Ladung + Personen. Diese Zahl steht im Fahrzeugschein als „Gesamtgewicht“.", "tip": "Zulässig = Gesamtgewicht im Fahrzeugschein"}, "w03": {"q": "Laut Gesetz ist das tatsächliche Gesamtgewicht:", "o": ["Das größte Gewicht an Ladung, mit dem das Fahrzeug beladen wurde.", "Das größte Gewicht des Fahrzeugs ohne Ladung.", "Das jeweilige tatsächliche Gewicht des Fahrzeugs mit Ladung, Besatzung und Fahrgästen."], "ex": "„Gesamt“ heißt „alles zusammen“: das echte Gewicht in diesem Moment, also Fahrzeug + Ladung + Fahrer + Fahrgäste.", "tip": "Gesamt = alles zusammen, jetzt"}, "w04": {"q": "Laut Gesetz ist die Nutzlast eines Busses:", "o": ["Das zulässige Gesamtgewicht minus das Leergewicht.", "Das Leergewicht plus die Ladung.", "Die Gesamtlast minus die Ladung."], "ex": "Leergewicht = das leere Fahrzeug. Zieht man das leere Fahrzeug vom zulässigen Gesamtgewicht ab, bleibt übrig, wie viel man laden darf. Das ist die Nutzlast.", "tip": "Nutzlast = zulässig − leer"}, "w05": {"q": "Die höchste zulässige Last auf der Straße von einer Lenkachse (angetrieben oder nicht) im Inlandsverkehr ist:", "o": ["7.500 kg.", "8.000 kg.", "7.000 kg."], "ex": "Die Lenkachse ist die vordere, mit dem Lenkrad. Laut Buch darf sie im Inlandsverkehr mit bis zu 7.000 kg auf die Straße drücken.", "tip": "Lenkachse (vorne) = 7 Tonnen"}, "w06": {"q": "Das höchste Gesamtgewicht eines zweiachsigen Busses im Inlandsverkehr ist:", "o": ["16.000 kg.", "19.000 kg.", "20.000 kg."], "ex": "Zweiachsig = 2 Achsen. Laut Lösungstabelle des Buches darf das Gesamtgewicht im Inlandsverkehr bis zu 19.000 kg (19 Tonnen) betragen.", "tip": "2 Achsen, Inland = 19 Tonnen"}, "w07": {"q": "Das höchste Gesamtgewicht eines dreiachsigen Busses im Inlandsverkehr ist:", "o": ["24.000 kg.", "26.000 kg.", "28.000 kg."], "ex": "Drei Achsen tragen mehr als zwei. Laut Buch liegt die Grenze im Inlandsverkehr bei 26.000 kg.", "tip": "3 Achsen, Inland = 26 Tonnen"}, "w08": {"q": "Die höchste Länge eines Gelenkbusses ist:", "o": ["15,00 m.", "16,00 m.", "18,75 m."], "ex": "Ein Gelenkbus hat die „Ziehharmonika“ in der Mitte. Weil er aus zwei Teilen besteht, darf er sehr lang sein: bis zu 18,75 Meter.", "tip": "Ziehharmonika-Bus = 18,75 m"}, "w10": {"q": "Nach geltenden Vorschriften ist die höchste Länge eines Busses im Inlands- oder Auslandsverkehr:", "o": ["11,5 m.", "13,5 m.", "12,5 m."], "ex": "Ein normaler zweiachsiger Bus (kein Gelenkbus) darf bis zu 13,5 Meter lang sein.", "tip": "Normaler Bus = 13,5 m"}, "w11": {"q": "Nach geltenden Vorschriften ist die höchste Breite eines Busses im Inlandsverkehr:", "o": ["2,50 m.", "2,55 m.", "2,60 m."], "ex": "Die höchste Breite ist 2,55 Meter. 2,60 gilt nur für Kühl-Lkw, nicht für Busse.", "tip": "Breite = 2,55 m"}, "w12": {"q": "Nach geltenden Vorschriften ist die höchste Höhe eines Busses im Inlands- oder Auslandsverkehr:", "o": ["3,80 m.", "4,00 m.", "4,20 m."], "ex": "Die höchste Höhe ist 4 Meter. Eine runde Zahl, leicht zu merken, und sie schützt dich vor Brücken und Tunneln.", "tip": "Höhe = 4 m"}, "w13": {"q": "Nach geltenden Vorschriften muss die Mindesthöhe eines Hochbodenbusses mehr betragen als:", "o": ["3 m.", "3,20 m.", "3,50 m."], "ex": "Ein Hochbodenbus hat einen erhöhten Boden (z. B. ein Reisebus). Laut Buch gilt er als Hochbodenbus, wenn er höher als 3,20 m ist.", "tip": "Hochboden = über 3,20 m"}, "w15": {"q": "Das zulässige Gesamtgewicht eines zweiachsigen Busses im Auslandsverkehr ist:", "o": ["16.000 kg.", "18.000 kg.", "19.000 kg."], "ex": "Im Auslandsverkehr gelten die europäischen Grenzen, die etwas strenger sind. Zweiachsiger Bus: bis zu 18.000 kg.", "tip": "2 Achsen, Ausland = 18 Tonnen"}, "w16": {"q": "Das höchste Gewicht eines dreiachsigen Busses mit mechanischer Federung im Auslandsverkehr ist:", "o": ["25.000 kg.", "26.000 kg.", "28.000 kg."], "ex": "Dreiachsiger Bus, Auslandsverkehr, einfache (mechanische) Federung: bis zu 25.000 kg. Mit Luftfederung oder Zwillingsreifen ist etwas mehr erlaubt (26.000 kg).", "tip": "3 Achsen, mechanische Federung = 25 Tonnen"}, "w17": {"q": "Das höchste Gewicht eines dreiachsigen Gelenkbusses im Inlandsverkehr ist:", "o": ["28.000 kg.", "29.000 kg.", "32.000 kg."], "ex": "Gelenkbus, 3 Achsen, Inlandsverkehr: laut Lösungstabelle bis zu 29.000 kg. Im Auslandsverkehr liegt die Grenze bei 28.000 kg.", "tip": "Gelenkbus, Inland = 29 Tonnen"}, "w18": {"q": "Das höchste Gewicht eines dreiachsigen Gelenkbusses im Auslandsverkehr ist:", "o": ["28.000 kg.", "29.000 kg.", "32.000 kg."], "ex": "Derselbe Bus wie in der vorigen Frage, aber Auslandsverkehr: laut Lösungstabelle 28.000 kg, eine Tonne weniger als im Inland.", "tip": "Gelenkbus, Ausland = 28 Tonnen"}, "w19": {"q": "Das zulässige Gewicht einer einzelnen nicht gelenkten, nicht angetriebenen Achse eines Busses ist:", "o": ["10.000 kg.", "11.500 kg.", "13.000 kg."], "ex": "Eine Achse, die weder lenkt noch antreibt (sie „trägt“ nur), darf bis zu 10.000 kg tragen. Eine Antriebsachse darf mehr.", "tip": "Einfache Achse = 10 Tonnen"}, "w20": {"q": "Das höchste Gewicht eines dreiachsigen Busses im Auslandsverkehr, bei dem jede Antriebsachse Zwillingsreifen hat und keine Achse mehr als 9.500 kg trägt, ist:", "o": ["25.000 kg.", "26.000 kg.", "28.000 kg."], "ex": "Mit Zwillingsreifen verteilt sich das Gewicht besser auf der Straße. Deshalb ist 1 Tonne mehr erlaubt als beim einfachen Dreiachser: 26.000 kg statt 25.000 kg.", "tip": "Zwillingsreifen = +1 Tonne (26)"}, "w21": {"q": "Die höchste zulässige Straßenlast von einem Paar nicht gelenkter Achsen mit einem Abstand von mehr als 1 m und höchstens 2 m im Inlandsverkehr ist:", "o": ["17.000 kg.", "20.000 kg.", "22.000 kg."], "ex": "Zwei Achsen sehr nah beieinander (1–2 m) wirken als Paar. Laut Buch dürfen sie im Inlandsverkehr zusammen mit bis zu 20.000 kg auf die Straße drücken.", "tip": "Achspaar = 20 Tonnen"}, "w25": {"q": "Das zulässige Gewicht auf der Antriebsachse eines zweiachsigen Busses im Inlandsverkehr ist:", "o": ["11.500 kg.", "12.000 kg.", "13.000 kg."], "ex": "Die Antriebsachse bekommt die Kraft vom Motor (meist die hintere). Im Inlandsverkehr sind bis zu 13.000 kg erlaubt.", "tip": "Antriebsachse, Inland = 13 Tonnen"}, "w26": {"q": "Das zulässige Gewicht auf der Antriebsachse eines zweiachsigen Busses im Auslandsverkehr ist:", "o": ["12.000 kg.", "11.500 kg.", "13.000 kg."], "ex": "Im Auslandsverkehr gilt die niedrigere europäische Grenze: 11.500 kg für die Antriebsachse.", "tip": "Antriebsachse, Ausland = 11,5 Tonnen"}, "k04": {"q": "Wenn ein Schulbus hält, um Schüler ein- oder aussteigen zu lassen, wie werden andere Fahrer hauptsächlich gewarnt?", "o": ["Mit eingeschaltetem rechten Blinker.", "Mit eingeschalteter Warnblinkanlage."], "ex": "Die Warnblinkanlage (alle Blinker zusammen) sagt den anderen: „Vorsicht, hier passiert etwas.“ Der rechte Blinker allein heißt nur, dass du abbiegst oder an den Rand fährst.", "tip": "Kinder steigen ein/aus = Warnblinker"}, "k05": {"q": "Ein Schulbus hat auf einer Straße mit zwei Fahrstreifen gehalten, um Schüler ein- oder aussteigen zu lassen. Was müssen Fahrer in derselben Richtung tun?", "o": ["Langsamer fahren und den Schulbus vorsichtig überholen.", "Bis zur Höchstgeschwindigkeit (50 km/h) fahren und den Schulbus vorsichtig überholen.", "Anhalten und warten, bis alle Schüler ein- oder ausgestiegen sind, und erst weiterfahren, wenn der Schulbus losfährt."], "ex": "Ein Kind kann plötzlich vor den Bus laufen. Deshalb halten die Fahrzeuge dahinter an und warten, bis der Schulbus losfährt. Sie überholen nicht.", "tip": "Schulbus hält = du hältst auch"}, "k06": {"q": "Um störenden Lärm im Verkehr zu vermeiden, solltest du unter anderem:", "o": ["Plötzliches Bremsen vermeiden, außer wenn es unbedingt nötig ist.", "Die Hupe als Warnung nur nach langem Warten benutzen.", "Die Hupe nur benutzen, um einen anderen Fahrer auf seinen Fehler dir gegenüber hinzuweisen."], "ex": "Plötzliches Bremsen macht Lärm (quietschende Reifen). Die Hupe ist nicht zum Warten oder zum „Bestrafen“ anderer Fahrer da, sondern nur, um Gefahr abzuwenden.", "tip": "Leise fahren = kein plötzliches Bremsen"}, "k08": {"q": "Die Haftung der Reifen auf der Fahrbahn wird verringert durch:", "o": ["Öl oder Wasser auf der Straße.", "Fahren in einem niedrigen Gang.", "Häufiges Bremsen."], "ex": "Haftung bedeutet, wie gut die Reifen die Straße „festhalten“. Öl und Wasser machen die Straße rutschig, die Reifen halten weniger.", "tip": "Öl oder Wasser = rutschig"}, "k09": {"q": "Die Haftung der Reifen auf der Straße wird verringert durch:", "o": ["Laub auf der Fahrbahn.", "Hohe Motordrehzahl.", "Niedrige Fahrzeuggeschwindigkeit."], "ex": "Laub, besonders nasses, bildet eine rutschige Schicht zwischen Reifen und Straße. Drehzahl und niedrige Geschwindigkeit verringern die Haftung nicht.", "tip": "Laub auf der Straße = wie Eis"}, "k10": {"q": "Aquaplaning führt zu:", "o": ["Reifenverschleiß.", "Verlust der Lenkfähigkeit.", "Verlust der Motorleistung."], "ex": "Aquaplaning: Bei hoher Geschwindigkeit in tiefem Wasser „schwimmt“ der Reifen auf dem Wasser und berührt die Straße nicht. Dann lenkt das Lenkrad das Fahrzeug nicht mehr.", "tip": "Aquaplaning = Lenkung reagiert nicht"}, "k11": {"q": "Außerorts müssen Fahrer vom Fernlicht auf Abblend- oder Nebellicht umschalten:", "o": ["Wenn die Gefahr besteht, entgegenkommende Fahrer zu blenden.", "Eine halbe Stunde vor Sonnenaufgang.", "Wenn sie keinen sicheren Abstand halten."], "ex": "Fernlicht blendet den entgegenkommenden Fahrer. Wenn dir ein Fahrzeug entgegenkommt, blendest du ab.", "tip": "Jemand kommt entgegen = Abblendlicht"}, "k12": {"q": "Der kürzeste gesamte Anhalteweg eines Fahrzeugs:", "o": ["Hängt nicht vom Zustand der Reifen ab.", "Wird kürzer, wenn das Reifenprofil abgefahren ist.", "Wird kürzer, wenn der Fahrer aufmerksamer ist."], "ex": "Anhalteweg = Reaktionsweg + Bremsweg. Ein aufmerksamer Fahrer reagiert schneller und hält deshalb früher an. Abgefahrene Reifen machen ihn länger.", "tip": "Aufmerksamer Fahrer = hält früher an"}, "k15": {"q": "Die Verzögerung, die ein Fahrzeug beim Bremsen erreicht, wird beeinflusst durch:", "o": ["Art und Zustand der Fahrbahn.", "Die Außentemperatur.", "Den Luftdruck."], "ex": "Wie schnell das Fahrzeug langsamer wird, hängt davon ab, wie gut die Reifen haften. Trockener Asphalt hält gut, Schotter oder nasse Straße weniger.", "tip": "Bremsen hängt von der Straße ab"}, "k16": {"q": "Wovon hängt der Bremsweg beim Bremsen unter normalen Bedingungen hauptsächlich ab?", "o": ["Von der Geschwindigkeit des Fahrzeugs.", "Von der Art der Bremsanlage.", "Davon, wie stark du das Bremspedal drückst."], "ex": "Die Geschwindigkeit ist der wichtigste Faktor. Doppelte Geschwindigkeit, und der Bremsweg wird etwa viermal so lang.", "tip": "Doppelt so schnell = viermal Bremsweg"}, "k18": {"q": "Wenn ein Fahrzeug nach links abbiegt, welches Rad legt den längeren Weg zurück?", "o": ["Das linke.", "Das rechte.", "Beide gleich."], "ex": "In einer Linkskurve ist das rechte Rad außen. Der äußere Kreis ist größer, also fährt das rechte Rad mehr Strecke.", "tip": "Das äußere Rad fährt weiter"}, "k19": {"q": "Wenn ein Auto durch eine Kurve fährt, welche Räder fahren den längeren Weg?", "o": ["Die äußeren Räder.", "Die inneren Räder.", "Die Hinterräder."], "ex": "Wie auf der Laufbahn: Der Läufer auf der Außenbahn läuft weiter. Die äußeren Räder machen den größeren Kreis.", "tip": "Äußerer Kreis = größer"}, "k21": {"q": "Schneeketten werden montiert:", "o": ["An den Rädern der Lenkachse.", "An einem Rad der Lenkachse und dem diagonal gegenüberliegenden Rad der Antriebsachse.", "An den Rädern der Antriebsachse."], "ex": "Ketten helfen den Rädern, die das Fahrzeug schieben, im Schnee nicht durchzudrehen. Das sind die Räder der Antriebsachse.", "tip": "Ketten dort, wo der Motor „schiebt“"}, "k22": {"q": "Wenn die Bremswirkung nicht an allen Rädern gleich ist, besteht dann Gefahr für das Fahrzeug?", "o": ["Nur auf kurvigen Straßen.", "Nur auf rutschigen Straßen.", "Immer, weil das Fahrzeug beim Bremsen von der Spur abkommt."], "ex": "Wenn die Bremsen auf einer Seite stärker greifen, zieht das Fahrzeug beim Bremsen zu dieser Seite. Das passiert immer, auch auf gerader Straße.", "tip": "Ungleiche Bremsen = Fahrzeug zieht zur Seite"}, "k23": {"q": "Warum darf man, besonders mit Druckluftbremsen, nicht mit ausgeschaltetem Motor fahren?", "o": ["Weil sich das Fahrzeug nicht lenken lässt.", "Weil ständiges Bremsen die Kupplung schnell verschleißt.", "Weil man bei ständigem Bremsen die Bremsen verlieren kann."], "ex": "Druckluftbremsen arbeiten mit Druckluft, die der Kompressor des Motors nachfüllt. Bei ausgeschaltetem Motor wird nichts nachgefüllt. Jedes Bremsen verbraucht Luft, und am Ende hast du keine Bremsen mehr.", "tip": "Motor aus = Bremsluft geht aus"}, "k24": {"q": "Wie fährst du am sichersten durch ein rutschiges Straßenstück?", "o": ["Indem du Gas gibst.", "Indem du langsam fährst und Bremsen vermeidest.", "Indem du ständig bremst."], "ex": "Auf rutschiger Straße kann jede plötzliche Aktion (Gas geben oder Bremsen) die Räder rutschen lassen. Langsam und gleichmäßig fahren.", "tip": "Rutschig? Langsam und nicht bremsen"}, "k25": {"q": "Nach dem Waschen des Fahrzeugs merkst du, dass die Bremsen beim Bremsen rutschen. Was solltest du tun?", "o": ["Das Fahrzeug sofort zu einer Fachwerkstatt fahren.", "Bei langsamer Fahrt das Bremspedal mehrmals drücken.", "Die Handbremse statt der Fußbremse benutzen."], "ex": "Nach dem Waschen sind die Bremsen nass und greifen weniger. Wenn du bei langsamer Fahrt ein paarmal leicht bremst, werden sie warm und trocknen.", "tip": "Nasse Bremsen = leicht bremsen zum Trocknen"}, "k26": {"q": "Wann bremst du am besten (kürzester Bremsweg)?", "o": ["Wenn du das Bremspedal mit voller Kraft drückst.", "Wenn du das Pedal je nach Straße gerade so stark drückst, dass die Räder nicht blockieren.", "Wenn du das Pedal immer wieder stark drückst und loslässt."], "ex": "Ein rollendes Rad haftet besser als ein blockiertes Rad, das rutscht. Also stark bremsen, aber nicht so stark, dass die Räder blockieren.", "tip": "Stark, aber ohne zu blockieren"}, "k28": {"q": "Welche(n) Fahrstreifen dürfen Busse auf Autobahnen und Kraftfahrstraßen mit drei oder mehr Fahrstreifen benutzen?", "o": ["Den Fahrstreifen ganz rechts.", "Die zwei rechten Fahrstreifen.", "Alle Fahrstreifen, je nach Verkehr."], "ex": "Bei 3 oder mehr Fahrstreifen nutzt der Bus die zwei rechten. Der linke bleibt für schnellere Fahrzeuge frei.", "tip": "3+ Fahrstreifen: Bus auf den 2 rechten"}, "k29": {"q": "Welche(n) Fahrstreifen dürfen Busse auf Straßen mit zwei Fahrstreifen je Richtung benutzen?", "o": ["Nur den rechten Fahrstreifen.", "Beide Fahrstreifen.", "Den rechten, und den linken nur kurz in besonderen Fällen (Überholen usw.)."], "ex": "Bei 2 Fahrstreifen fährt der Bus rechts. Auf den linken wechselt er nur kurz, z. B. zum Überholen, und kehrt dann nach rechts zurück.", "tip": "2 Fahrstreifen: rechts, links nur zum Überholen"}, "v01": {"q": "Wie schnell dürfen Busse höchstens auf Autobahnen fahren, wenn Schilder nichts anderes vorschreiben?", "o": ["80 km/h.", "90 km/h.", "100 km/h."], "ex": "Laut Lösungstabelle des Buches dürfen Busse auf der Autobahn bis zu 90 km/h fahren (der Begrenzer steht auf 100, aber das Limit ist niedriger).", "tip": "Autobahn = 90"}, "v07": {"q": "Wie schnell dürfen Busse höchstens auf Kraftfahrstraßen fahren, wenn Schilder nichts anderes vorschreiben?", "o": ["80 km/h.", "90 km/h.", "100 km/h."], "ex": "Laut Lösungstabelle liegt das Limit für Busse auf Kraftfahrstraßen ebenfalls bei 90 km/h, wie auf der Autobahn.", "tip": "Kraftfahrstraße = 90"}, "v06": {"q": "Wie schnell dürfen Busse höchstens außerhalb von Autobahnen, Kraftfahrstraßen und geschlossenen Ortschaften fahren, wenn Schilder nichts anderes vorschreiben?", "o": ["80 km/h.", "90 km/h.", "100 km/h."], "ex": "Auf normalen Straßen außerorts (keine Autobahn oder Kraftfahrstraße) fährt der Bus bis zu 80 km/h. Reihenfolge: 90 Autobahn und Kraftfahrstraße, 80 Landstraße, 50 innerorts.", "tip": "Landstraße = 80"}, "v05": {"q": "Wie schnell dürfen Busse höchstens innerhalb geschlossener Ortschaften fahren, wenn Schilder nichts anderes vorschreiben?", "o": ["50 km/h.", "60 km/h.", "70 km/h."], "ex": "Innerorts gilt das Stadtlimit: 50 km/h, wenn kein Schild etwas anderes zeigt.", "tip": "Innerorts = 50"}, "v02": {"q": "Wenn ein Stadt- oder Überlandbus stehende Fahrgäste befördert, wie schnell darf er höchstens fahren?", "o": ["50 km/h.", "60 km/h.", "70 km/h."], "ex": "Stehende Fahrgäste können beim Bremsen stürzen. Deshalb fährt der Bus mit stehenden Fahrgästen nicht schneller als 60 km/h.", "tip": "Stehende Fahrgäste = 60"}, "v08": {"q": "Wie schnell dürfen Schulbusse höchstens außerorts fahren, wenn Schilder nichts anderes vorschreiben?", "o": ["50 km/h.", "60 km/h.", "70 km/h."], "ex": "Schulbusse befördern Kinder, deshalb haben sie ein niedrigeres Limit: bis zu 60 km/h außerorts.", "tip": "Schulbus = 60"}, "v03": {"q": "Wie schnell dürfen Busse mit leichtem Anhänger höchstens außerorts fahren, wenn Schilder nichts anderes vorschreiben?", "o": ["70 km/h.", "80 km/h.", "90 km/h."], "ex": "Mit Anhänger bremst das Fahrzeug schlechter. Außerorts liegt das Limit bei 80 km/h.", "tip": "Mit Anhänger = 80"}, "v04": {"q": "Wie schnell dürfen Doppeldeckerbusse höchstens außerorts fahren, wenn Schilder nichts anderes vorschreiben?", "o": ["70 km/h.", "80 km/h.", "90 km/h."], "ex": "Ein Doppeldecker ist hoch und empfindlich für Wind und Kurven. Außerorts fährt er bis zu 80 km/h.", "tip": "Doppeldecker = 80"}, "v09": {"q": "Wie schnell dürfen Gelenkbusse höchstens außerorts fahren, wenn Schilder nichts anderes vorschreiben?", "o": ["70 km/h.", "80 km/h.", "90 km/h."], "ex": "Ein Gelenkbus (Ziehharmonika) ist sehr lang und schwerer zu beherrschen. Er hat das niedrigste Limit: 70 km/h außerorts.", "tip": "Gelenkbus = 70 (der langsamste)"}, "p01": {"q": "Wenn ein Fahrer in einen Verkehrsunfall verwickelt ist und unter Alkoholeinfluss steht, zahlt die Versicherung dann den ganzen Schaden, ohne etwas von ihm zurückzufordern?", "o": ["Nein. Sie zahlt den Geschädigten eine Entschädigung, fordert sie aber danach vom Fahrer zurück.", "Ja. Sie zahlt die Entschädigung ohne Folgen für den Fahrer."], "ex": "Die Versicherung zahlt zuerst die Opfer, damit sie nicht leer ausgehen. Aber danach fordert sie das Geld vom betrunkenen Fahrer zurück.", "tip": "Betrunken = am Ende zahlst du"}, "p02": {"q": "Welche zusätzlichen Strafen gelten, wenn jemand ohne gültigen Führerschein fährt und einen Unfall mit schwerer Verletzung oder Tod verursacht?", "o": ["Verbot, einen Führerschein zu erwerben, für mindestens 10 Jahre.", "Verbot, einen Führerschein zu erwerben, für mindestens 15 Jahre.", "Verbot, einen Führerschein zu erwerben, für mindestens 20 Jahre."], "ex": "Kein Führerschein plus schwerer Unfall: Man darf mindestens 10 Jahre lang keinen Führerschein machen.", "tip": "Kein Führerschein + Unfall = 10 Jahre"}, "p03": {"q": "Welche zusätzlichen Strafen gelten, wenn jemand ohne gültigen Führerschein fährt?", "o": ["Verbot, einen Führerschein zu erwerben, für mindestens 3 Jahre.", "Verbot, einen Führerschein zu erwerben, für mindestens 5 Jahre.", "Verbot, einen Führerschein zu erwerben, für mindestens 10 Jahre."], "ex": "Wer ohne Führerschein fährt (ohne Unfall), darf mindestens 3 Jahre lang keinen Führerschein machen. Mit Unfall werden es 10.", "tip": "Kein Führerschein = 3 Jahre"}, "p07": {"q": "Welche Verwaltungsstrafen gelten, wenn jemand fährt, obwohl ihm der Führerschein entzogen wurde?", "o": ["Verbot der Rückgabe für mindestens 3 Jahre.", "Verbot der Rückgabe für mindestens 5 Jahre.", "Verbot der Rückgabe für mindestens 10 Jahre."], "ex": "Wie bei „kein Führerschein“: Wer fährt, obwohl der Führerschein entzogen ist, bekommt ihn mindestens 3 Jahre lang nicht zurück.", "tip": "Fahren trotz Entzug = 3 Jahre"}, "p11": {"q": "Welche Verwaltungsstrafen gelten, wenn jemand fährt, obwohl ihm der Führerschein entzogen wurde, und einen Unfall mit schwerer Verletzung oder Tod verursacht?", "o": ["Verbot der Rückgabe für 10 Jahre.", "Verbot der Rückgabe für 20 Jahre.", "Bis hin zum dauerhaften Verbot, je wieder einen Führerschein zu bekommen."], "ex": "Der schlimmste Fall: Der Führerschein war schon entzogen, trotzdem gefahren und einen schweren Unfall verursacht. Man kann ihn für immer verlieren.", "tip": "Schlimmster Fall = für immer"}, "p08": {"q": "Welche Verwaltungsstrafen gelten, wenn ein Fahrer einen Unfall mit schwerer Verletzung verursacht?", "o": ["Führerscheinentzug für 1 Monat bis 1 Jahr.", "Führerscheinentzug für 2 Monate bis 3 Jahre.", "Führerscheinentzug für 3 Monate bis 2 Jahre."], "ex": "Schwere Verletzung: Führerscheinentzug für 3 Monate bis 2 Jahre. Wenn jemand stirbt, sind es 2 bis 5 Jahre.", "tip": "Verletzung = 3 Monate bis 2 Jahre"}, "p09": {"q": "Welche Verwaltungsstrafen gelten, wenn ein Fahrer einen Unfall mit Todesfolge verursacht?", "o": ["Führerscheinentzug für 2 bis 3 Jahre.", "Führerscheinentzug für 2 bis 4 Jahre.", "Führerscheinentzug für 2 bis 5 Jahre."], "ex": "Bei einem Todesfall ist die Strafe härter als bei einer Verletzung: Führerscheinentzug für 2 bis 5 Jahre.", "tip": "Tod = 2 bis 5 Jahre"}, "p05": {"q": "Wenn bei einem Fahrer bei der Alkoholkontrolle ein Blutalkohol von 0,5 bis 0,8 Gramm pro Liter festgestellt wird, welche Strafe gilt?", "o": ["Geldstrafe von 100.000 Drachmen.", "Geldstrafe von 50.000 Drachmen.", "Geldstrafe von 50.000 Drachmen und Führerscheinentzug für 1 Monat."], "ex": "Das Buch ist alt und nennt Beträge in Drachmen. Laut Lösungstabelle ist die Strafe bei 0,5 bis 0,8 eine Geldstrafe von 50.000 Drachmen. Ab 0,8 kommt der Führerscheinentzug dazu.", "tip": "0,5–0,8 = nur 50.000 Geldstrafe"}, "p06": {"q": "Wenn bei einem Fahrer bei der Alkoholkontrolle ein Blutalkohol von 0,8 bis 1,10 Gramm pro Liter festgestellt wird, welche Strafen gelten?", "o": ["Geldstrafe von 100.000 Drachmen.", "Geldstrafe von 100.000 Drachmen und Führerscheinentzug für 3 Monate.", "Geldstrafe von 200.000 Drachmen und Führerscheinentzug für 1 Monat."], "ex": "Die nächste Stufe: Bei 0,8 bis 1,10 verdoppelt sich die Geldstrafe (100.000 Drachmen) und der Führerschein wird für 3 Monate entzogen.", "tip": "0,8–1,10 = 100.000 + 3 Monate"}, "p04": {"q": "Wenn bei einem Fahrer bei der Alkoholkontrolle ein Blutalkohol von über 1,10 Gramm pro Liter festgestellt wird, welche Strafen gelten?", "o": ["Geldstrafe von 200.000 Drachmen, mindestens 2 Monate Gefängnis, Führerscheinentzug für 6 Monate sowie Entzug von Kennzeichen und Fahrzeugschein für 10 Tage bis 6 Monate.", "Geldstrafe von 200.000 Drachmen und Führerscheinentzug für 3 Monate.", "Führerscheinentzug für 5 Jahre."], "ex": "Über 1,10 ist eine Straftat. Deshalb gibt es auch Gefängnis, und die Kennzeichen werden ebenfalls eingezogen. Es ist die längste Antwort.", "tip": "Über 1,10 = Gefängnis + alles"}, "p10": {"q": "Welche Strafen gelten, wenn ein Fahrer innerhalb von zwei Jahren zum zweiten Mal mit über 1,10 Gramm pro Liter erwischt wird (Wiederholungstäter), egal wie hoch der Wert beim ersten Mal war?", "o": ["Führerscheinentzug für 5 Jahre.", "Führerscheinentzug für 3 Jahre.", "Führerscheinentzug für 2 Jahre."], "ex": "Wiederholungstäter heißt, er hat es wieder getan. Zum zweiten Mal innerhalb von 2 Jahren mit über 1,10: Führerschein für 5 Jahre weg.", "tip": "Wieder betrunken = 5 Jahre"}, "m10": {"q": "Bei einem Fahrzeug mit Druckluftbremse darf die Füllzeit der Luftbehälter nicht länger sein als:", "o": ["Drei (3) Minuten, um den Druck von 0 auf 65 % des Höchstwerts zu bringen.", "Es gibt keine Grenze, solange die Behälter sich füllen.", "Zehn (10) Minuten, um den Druck von 0 auf 65 % des Höchstwerts zu bringen."], "ex": "Die Luftbehälter sind die „Vorratstanks“ der Bremsen. Sie müssen sich schnell füllen, damit du bald Bremsen hast: bis 65 % Druck innerhalb von 3 Minuten.", "tip": "Bremsluft: 3 Minuten bis 65 %"}, "m26": {"q": "In welchem Bereich liegt der niedrigste zulässige Druckluftdruck in einer Druckluftbremsanlage?", "o": ["Etwa 5 - 6 bar.", "Etwa 9 - 10 bar.", "Etwa 14 - 15 bar."], "ex": "Wenn der Druck unter etwa 5–6 bar fällt, funktionieren die Druckluftbremsen nicht richtig. Deshalb beobachtet der Fahrer die Anzeigen.", "tip": "Mindestluftdruck = 5–6 bar"}, "m63": {"q": "Worauf sollte der Fahrer bei einem Bus mit Druckluftbremse vor allem achten?", "o": ["Wie die Bremsen wirken.", "Auf die Werte der Anzeigen am Armaturenbrett.", "Wie das Bremspedal beim Drücken nachgibt."], "ex": "Bei Druckluftbremsen spürst du das Problem (zu wenig Luft) nicht im Pedal. Du siehst es nur an den Anzeigen am Armaturenbrett.", "tip": "Druckluftbremse = Anzeigen beobachten"}, "m43": {"q": "Druckluftbremsen werden bei Bussen verwendet, weil:", "o": ["Das Fahren bequemer ist.", "Hydraulische Bremsen nicht ausreichen, um das Fahrzeug abzubremsen.", "Äußerer Verschleiß an Leitungen und Teilen der Druckluftbremse selten ist."], "ex": "Ein Bus wiegt viele Tonnen. Hydraulische Bremsen wie beim Pkw haben nicht genug Kraft, um ihn zu stoppen. Druckluft gibt viel mehr Kraft.", "tip": "Schweres Fahrzeug = braucht Luft"}, "m50": {"q": "Der Luftpresser (Kompressor):", "o": ["Saugt Luft an, verdichtet sie und schickt sie in die Luftbehälter.", "Saugt Luft an und schickt sie zur Federung.", "Saugt Luft an und schickt sie zum Kühlsystem."], "ex": "Der Name sagt es: Kompressor = verdichtet Luft. Er füllt sie in die Luftbehälter, aus denen die Bremsen sie nehmen.", "tip": "Kompressor → Luftbehälter"}, "m52": {"q": "Der Druckluft-Bremskraftverstärker wird verwendet:", "o": ["In einer mechanischen Bremsanlage.", "In einer hydraulisch-pneumatischen Bremsanlage.", "In einer elektrischen Bremsanlage."], "ex": "Der Bremskraftverstärker hilft dem Fahrer, mit weniger Kraft zu bremsen. Mit Druckluft (pneumatisch) arbeitet er mit einem hydraulischen System zusammen: eine hydraulisch-pneumatische Anlage.", "tip": "Luftverstärker = hydraulisch + pneumatisch"}, "m57": {"q": "Das automatische lastabhängige Bremsventil (ΑΡΠ) ist ein Teil der Bremsanlage, das:", "o": ["Den Druck in den Bremszylindern automatisch an die Beladung des Fahrzeugs anpasst.", "Die nötige Druckluft erzeugt.", "Die Luft auf mehr als einen Kreis verteilt."], "ex": "Ein leerer Bus braucht weniger Bremskraft als ein voller. Das Ventil passt den Druck je nach Beladung selbst an, damit die Räder nicht blockieren.", "tip": "ΑΡΠ = Druck je nach Last"}, "m62": {"q": "Wozu dient die Motorbremse (Auspuffklappenbremse)?", "o": ["Zum Kraftstoffsparen.", "Um bei Bergabfahrt die Fußbremse weniger zu benutzen.", "Um den Motor zu entlasten."], "ex": "Die Motorbremse bremst das Fahrzeug mit dem Motor. Bergab nutzt du sie, damit die normalen Bremsen durch Dauerbremsen nicht überhitzen.", "tip": "Motorbremse = bergab, ohne die Bremsen zu verbrennen"}, "m21": {"q": "Das Antiblockiersystem (ABS):", "o": ["Verhindert, dass das Differential in Kurven sperrt.", "Verhindert das Durchdrehen der Räder beim Anfahren.", "Verhindert das Blockieren der Räder beim Bremsen (auf nasser Straße)."], "ex": "ABS = Antiblockier beim Bremsen. Die Räder drehen weiter, so kannst du noch lenken.", "tip": "ABS = bremsen ohne zu blockieren"}, "m27": {"q": "Wozu dient bei einer Luftfederung der Hochdruckkreis?", "o": ["Er füllt Luft nach und erhöht den Druck in den Luftbälgen, wenn das Fahrzeug beladen wird, damit es auf gleicher Höhe bleibt.", "Er hält den Druck in den Luftbälgen immer konstant.", "Er versorgt die Hilfssysteme des Fahrzeugs mit Luft."], "ex": "Wenn Fahrgäste einsteigen, „sinkt“ der Bus. Der Hochdruckkreis pumpt die Luftbälge mehr auf, damit das Fahrzeug auf gleicher Höhe bleibt.", "tip": "Mehr Last = mehr Luft in den Bälgen"}, "m54": {"q": "Stoßdämpfer sind Teile, die:", "o": ["Das Fahren stabil machen.", "Das Nachschwingen der Federn kontrollieren und schnell dämpfen, wenn die Räder über Unebenheiten fahren.", "Das Fahrgestell mit den Reifen verbinden."], "ex": "Nach einem Schlagloch würde die Feder oft nachschwingen. Der Stoßdämpfer stoppt dieses Schwingen schnell.", "tip": "Stoßdämpfer = stoppt das Wippen"}, "m48": {"q": "Die hydraulische Servolenkung wird bei Bussen verwendet, um:", "o": ["Die Wirkung der Muskelkraft des Fahrers beim Lenken zu verringern.", "Die Wirkung der Muskelkraft des Fahrers beim Lenken zu verstärken.", "Die Haftung der Reifen auf der Straße zu verbessern."], "ex": "Sie vervielfacht die Kraft, die du aufbringst. So kannst du das Lenkrad eines schweren Busses leicht drehen.", "tip": "Servolenkung = mehr Kraft, weniger Mühe"}, "m35": {"q": "Beim Reifen 175/70 R 15 87T bedeutet die Zahl 15:", "o": ["Den Außendurchmesser des Reifens in Zoll.", "Den Felgendurchmesser in Zoll.", "Die Profilhöhe in Zoll."], "ex": "Die Zahl nach dem R ist die Felgengröße in Zoll. 175 ist die Breite in mm und 70 die Flankenhöhe in Prozent.", "tip": "R 15 = 15-Zoll-Felge"}, "m68": {"q": "Wie viele Außenspiegel muss ein Bus mindestens haben?", "o": ["Zwei (2).", "Drei (3).", "Vier (4)."], "ex": "Mindestens zwei Außenspiegel, einer links und einer rechts.", "tip": "Spiegel = 2 (links + rechts)"}, "m66": {"q": "Wie viele Stromkreise für die Innenbeleuchtung muss ein Bus mindestens haben?", "o": ["Einen (1).", "Zwei (2).", "Drei (3)."], "ex": "Es gibt mindestens zwei Kreise. Wenn einer ausfällt, sitzen die Fahrgäste nicht im Dunkeln.", "tip": "Licht = 2 Kreise (zur Sicherheit)"}, "m70": {"q": "Der Notschalter, den jeder Bus hat, um bei stehendem Fahrzeug die Brandgefahr zu verringern, unterbricht:", "o": ["Die Kraftstoffzufuhr.", "Den Stromkreis der Notbeleuchtung innen.", "Den Stromkreis der zentralen elektronischen Türverriegelung."], "ex": "Feuer braucht Brennstoff. Der Notschalter unterbricht die Kraftstoffzufuhr, damit das Feuer keine Nahrung bekommt. Notlicht und Türen müssen weiter funktionieren.", "tip": "Feuer? Kraftstoff abstellen"}, "m67": {"q": "Was zeigt die Ölanzeige am Armaturenbrett des Busses?", "o": ["Den Öldruck in den hydraulischen Bremsen.", "Den Motoröldruck.", "Die Ölmenge in der Ölwanne."], "ex": "Ein Manometer misst Druck. Das am Armaturenbrett zeigt den Motoröldruck. Die Menge prüfst du mit dem Ölmessstab.", "tip": "Manometer = Druck, nicht Menge"}, "m16": {"q": "Wo sollte die Nadel auf einem Drehzahlmesser mit gelbem, grünem und rotem Bereich für gute Motorleistung und wenig Verbrauch stehen?", "o": ["Im Gelben.", "Im Grünen.", "Im Roten."], "ex": "Wie bei der Ampel: Grün = alles gut. Im grünen Bereich läuft der Motor sparsam und wirkungsvoll.", "tip": "Grün = sparsam"}, "m17": {"q": "Manche Drehzahlmesser im Bus haben gelbe, grüne und rote Bereiche. Wo steht die Nadel, wenn der Verbrauch im Verhältnis zur erzeugten Leistung zu hoch ist?", "o": ["Im Gelben.", "Im Grünen.", "Im Roten."], "ex": "Rot = hohe Drehzahl. Der Motor verbrennt viel Kraftstoff, ohne passende Leistung zu bringen, und kann Schaden nehmen.", "tip": "Rot = Verschwendung"}, "m14": {"q": "Was macht die Eingangswelle (Primärwelle) im Getriebe?", "o": ["Sie nimmt den Antrieb vom Motor über die Kupplung auf.", "Sie gibt den Antrieb über Kardanwelle und Gelenke an die Antriebsräder weiter.", "Sie nimmt den Antrieb von der Kardanwelle und gibt ihn an die Ausgangswelle weiter."], "ex": "Primär = erste. Sie ist die erste Welle im Getriebe und nimmt den Antrieb vom Motor über die Kupplung auf.", "tip": "Primär = erste, vom Motor"}, "m18": {"q": "Was macht die Vorgelegewelle (Hilfswelle) im Getriebe?", "o": ["Sie nimmt den Antrieb vom Motor über die Kupplung auf.", "Sie gibt den Antrieb über Kardanwelle und Gelenke an die Antriebsräder weiter.", "Sie nimmt den Antrieb von der Eingangswelle und gibt ihn an die Ausgangswelle weiter."], "ex": "Die Vorgelegewelle liegt in der Mitte: Sie nimmt den Antrieb von der Eingangswelle und gibt ihn über die Zahnräder an die Ausgangswelle weiter.", "tip": "Vorgelegewelle = die dazwischen"}, "m32": {"q": "Bei einem vollsynchronisierten Getriebe:", "o": ["Werden alle Gänge synchronisiert geschaltet.", "Werden alle Gänge außer dem ersten synchronisiert geschaltet.", "Werden alle Gänge außer dem Rückwärtsgang synchronisiert geschaltet."], "ex": "Auch bei einem „voll“ synchronisierten Getriebe hat der Rückwärtsgang meist keine Synchronisierung. Deshalb legst du ihn nur ein, wenn das Fahrzeug steht.", "tip": "Vollsynchron… außer Rückwärtsgang"}, "m38": {"q": "Wozu dient die Kardanwelle, wenn der Motor vorne und die Antriebsräder hinten sind?", "o": ["Um den Antrieb an die Vorderräder zu geben.", "Um den Antrieb vom Differential zum Getriebe zu geben.", "Um das Drehmoment vom Getriebe zu den Antriebsrädern zu übertragen."], "ex": "Der Motor ist vorne, die Antriebsräder hinten. Die Kardanwelle ist die lange Welle, die den Antrieb vom Getriebe nach hinten zu den Rädern bringt.", "tip": "Kardanwelle = Getriebe zu den Hinterrädern"}, "m69": {"q": "Was ist die Grundaufgabe des Differentials?", "o": ["Ein Antriebsrad mit anderer Geschwindigkeit drehen zu lassen als das andere.", "Die Antriebsräder schneller drehen zu lassen als die Kardanwelle.", "Die Antriebsrichtung um 40 Grad zu ändern."], "ex": "In der Kurve muss sich das äußere Rad mehr drehen als das innere. Das Differential lässt die beiden Räder unterschiedlich schnell drehen.", "tip": "Differential = verschiedene Geschwindigkeit links und rechts"}, "m33": {"q": "Wie übertragen die Kolben den Verbrennungsdruck auf die Kurbelwelle?", "o": ["Über die Nockenwelle.", "Über die Ventilstößel.", "Über die Pleuelstangen."], "ex": "Die Verbrennung drückt den Kolben nach unten. Die Pleuelstange verbindet Kolben und Kurbelwelle und macht aus dem Auf und Ab eine Drehung.", "tip": "Kolben → Pleuel → Kurbelwelle"}, "m34": {"q": "Die Aufgabe der Pleuelstange ist:", "o": ["Die Bewegungsenergie des Kolbens auf die Kurbelwelle zu übertragen.", "Die Einlass- und Auslassventile zu öffnen und zu schließen.", "Den Kolben mit der Nockenwelle zu verbinden."], "ex": "Dieselbe Idee wie in der vorigen Frage: Die Pleuelstange ist die „Brücke“ vom Kolben zur Kurbelwelle. Die Ventile bewegt die Nockenwelle.", "tip": "Pleuel = Kolben → Kurbelwelle"}, "m64": {"q": "Welche dieser Teile werden von der Nockenwelle angetrieben?", "o": ["Die Kurbelwelle.", "Der Lüfter.", "Die Einlass- und Auslassventile."], "ex": "Die Nockenwelle hat „Nocken“ (Buckel), die auf die Ventile drücken und sie im richtigen Moment öffnen.", "tip": "Nockenwelle → Ventile"}, "m45": {"q": "Wenn sich bei einem Viertakt-Dieselmotor die Kurbelwelle zweimal dreht, wie oft dreht sich die Nockenwelle?", "o": ["Einmal.", "Zweimal.", "Viermal."], "ex": "Beim Viertakter öffnet jedes Ventil einmal pro zwei Kurbelwellenumdrehungen. Die Nockenwelle dreht sich also halb so schnell: 2 Umdrehungen Kurbelwelle = 1 Umdrehung Nockenwelle.", "tip": "Nockenwelle = halbe Umdrehungen"}, "m41": {"q": "Die Kompressionsringe am Kolben sind dafür da:", "o": ["Dass Verbrennungsgase nicht ins Kurbelgehäuse entweichen.", "Dass Schmieröl nicht in den Brennraum gelangt.", "Um die Flächen von Kolben und Zylinder zu schmieren."], "ex": "Die Kompressionsringe „dichten“ den Kolben ab, damit die Verbrennungsgase oben bleiben und nicht nach unten entweichen.", "tip": "Kompressionsringe = Gase bleiben oben"}, "m53": {"q": "Die Ölabstreifringe sind dafür da:", "o": ["Den Verteiler zu schmieren.", "Dass Schmieröl nicht in den Brennraum gelangt.", "Dass Verbrennungsgase nicht ins Kurbelgehäuse entweichen."], "ex": "Das Gegenteil der Kompressionsringe: Die Ölabstreifringe halten das Öl unten, damit es nicht hochsteigt und verbrennt.", "tip": "Ölringe = Öl bleibt unten"}, "m37": {"q": "Was saugt ein Viertakt-Dieselmotor im Ansaugtakt an?", "o": ["Ein Gemisch aus Diesel und Luft.", "Nur Diesel.", "Nur Luft."], "ex": "Ein Dieselmotor saugt nur Luft an und verdichtet sie stark, sodass sie heiß wird. Dann wird der Diesel eingespritzt und entzündet sich von selbst.", "tip": "Diesel saugt = nur Luft"}, "m73": {"q": "Warum bringt ein Dieselmotor mehr Leistung, wenn du Gas gibst?", "o": ["Weil sich das Einlassventil weiter öffnet.", "Weil mehr Diesel zu den Einspritzdüsen gelangt.", "Weil stärkerer Strom zu den Zündkerzen fließt."], "ex": "Beim Diesel steuert das Gaspedal, wie viel Diesel eingespritzt wird. Mehr Diesel = mehr Leistung. Zündkerzen haben nur Benzinmotoren.", "tip": "Diesel-Gaspedal = mehr Diesel"}, "m30": {"q": "Kohlenmonoxid (CO) ist ein Schadstoff, der vor allem im Abgas eines … vorkommt:", "o": ["Dieselfahrzeugs.", "Benzinfahrzeugs.", "Elektrofahrzeugs."], "ex": "CO kommt vor allem vom Benzin. Elektrofahrzeuge haben keinen Auspuff. Der typische Diesel-Schadstoff ist SO2 (Schwefel).", "tip": "CO = Benzin, SO2 = Diesel"}, "m36": {"q": "Schwefeldioxid (SO2) ist ein Schadstoff im Abgas eines:", "o": ["Benzinfahrzeugs.", "Dieselfahrzeugs.", "Autogas-Fahrzeugs (LPG)."], "ex": "Diesel enthält Schwefel. Wenn er verbrennt, entsteht Schwefeldioxid (SO2).", "tip": "Schwefel (S) = Diesel"}, "m40": {"q": "Der Oxidationskatalysator bei Bussen:", "o": ["Hilft den Abgasen, hinauszukommen.", "Verringert die Schadstoffe, die aus dem Auspuff kommen.", "Erhöht die Motorleistung."], "ex": "Der Katalysator „reinigt“ die Abgase, bevor sie den Auspuff verlassen, damit sie weniger verschmutzen.", "tip": "Katalysator = weniger Schadstoffe"}, "m78": {"q": "Was macht der Auspuff-Schalldämpfer?", "o": ["Er bremst die Abgase, um Lärm zu verringern.", "Er bremst die Abgase, um Kraftstoff zu sparen.", "Er bremst die Abgase, um den Innenraum zu heizen."], "ex": "Schalldämpfer = dämpft den Schall. Er verringert den Lärm des Auspuffs.", "tip": "Schalldämpfer = Ruhe"}, "m46": {"q": "Die Kreiselpumpe (Wasserpumpe) des Kühlsystems wird angetrieben:", "o": ["Von der Kurbelwelle über einen Riemen.", "Von der Nockenwelle über besondere Zahnräder.", "Von der Nockenwelle über einen Riemen."], "ex": "Die Wasserpumpe dreht sich über einen Riemen, den die Kurbelwelle antreibt, wie Lüfter und Lichtmaschine.", "tip": "Wasserpumpe = Kurbelwelle + Riemen"}, "m58": {"q": "Die Kreiselpumpe (Wasserpumpe) des Motorkühlsystems:", "o": ["Saugt Kühlmittel aus dem oberen Kühlerkasten und schickt es durch natürlichen Umlauf in die Wassermäntel des Motors.", "Saugt Kühlmittel aus dem unteren Kühlerkasten und drückt es unter Druck in die Wassermäntel des Motors.", "Saugt mit Hilfe des Thermostats Kühlmittel an und schickt es in die Wassermäntel."], "ex": "Das Wasser kühlt ab, während es durch den Kühler nach unten läuft. Die Pumpe nimmt das kühle Wasser unten und drückt es unter Druck in den Motor.", "tip": "Pumpe: kühles Wasser von unten, unter Druck"}, "m65": {"q": "Wie ist der normale Wasserkreislauf im Kühlsystem?", "o": ["Kühler - Wassermäntel - Wasserpumpe - Thermostat - Kühler.", "Kühler - Thermostat - Wassermäntel - Wasserpumpe - Kühler.", "Kühler - Wasserpumpe - Wassermäntel - Thermostat - Kühler."], "ex": "Folge dem Wasser: Aus dem Kühler nimmt es die Pumpe, schickt es in den Motor (Wassermäntel), es kommt heiß über das Thermostat heraus und fließt zurück zum Kühler.", "tip": "Kühler → Pumpe → Motor → Thermostat → Kühler"}, "m47": {"q": "Bei heutigen Motoren werden die reibenden Flächen geschmiert:", "o": ["Durch Ölspritzen.", "Durch Druckumlaufschmierung.", "Durch ein gemischtes System."], "ex": "Bei heutigen Motoren drückt eine Ölpumpe das Öl unter Druck zu allen Stellen, die reiben.", "tip": "Schmierung = Pumpe unter Druck"}, "e01": {"q": "Der Motor läuft mit zu niedriger Temperatur. Was ist wahrscheinlich die Ursache?", "o": ["Ein defektes Thermostat.", "Keine Stromversorgung für den Lüfter.", "Ein zu kleiner Kühler."], "ex": "Das Thermostat ist eine „Tür“ für das Wasser. Wenn es offen hängen bleibt, fließt das Wasser immer durch den Kühler und der Motor wird nie warm genug. Die anderen beiden Ursachen würden ihn überhitzen.", "tip": "Motor zu kalt = Thermostat"}, "e04": {"q": "Für die Verkehrssicherheit und um Unfälle zu vermeiden ist unter anderem nötig:", "o": ["Glühbirnen durch stärkere zu ersetzen, damit sie länger halten.", "Die Scheinwerfergläser oft zu reinigen.", "Die Ersatzbirnen regelmäßig zu prüfen."], "ex": "Schmutzige Scheinwerfer leuchten viel schwächer. Einfach reinigen ist das Wichtigste. Nie andere Birnen einsetzen als die vom Hersteller vorgeschriebenen.", "tip": "Saubere Lichter = gute Sicht"}, "e08": {"q": "Für die Verkehrssicherheit und um Unfälle zu vermeiden ist unter anderem nötig:", "o": ["Birnen durch solche mit höherer Spannung zu ersetzen, um das Licht zu verbessern.", "Das Scheinwerferglas staubig zu lassen, damit es nicht ausbleicht.", "Die Blinker regelmäßig zu prüfen."], "ex": "Blinker zeigen den anderen, was du vorhast. Wenn sie nicht gehen, weiß niemand, dass du abbiegst. Deshalb prüfst du sie regelmäßig. Die anderen beiden Antworten sind schlechte Praxis.", "tip": "Blinker prüfen"}, "e12": {"q": "Die Mindestprofiltiefe der Reifen an den Antriebsachsen von Bussen ist:", "o": ["1,6 mm.", "1,5 mm.", "2 mm."], "ex": "Das Profil ist das Muster des Reifens. Wird es dünner als 1,6 mm, kann der Reifen kein Wasser mehr verdrängen und rutscht. Er muss ersetzt werden.", "tip": "Profil mindestens 1,6 mm"}, "e13": {"q": "Was bedeutet es, wenn während der Fahrt die Öl-Warnleuchte aufleuchtet?", "o": ["Die Lichtmaschine lädt die Batterie nicht.", "Die Schmierung ist normal.", "Der Öldruck ist zu niedrig."], "ex": "Die Öl-Leuchte geht an, wenn der Öldruck zu niedrig ist. Der Motor ist in Gefahr: sicher anhalten und prüfen. Die Batterie hat eine andere Leuchte.", "tip": "Öl-Leuchte = niedriger Druck, anhalten"}, "e14": {"q": "Was solltest du regelmäßig prüfen, um Kraftstoff zu sparen?", "o": ["Den Kühlmittelstand des Motors.", "Die Profiltiefe der Reifen.", "Den Reifendruck."], "ex": "Reifen mit zu wenig Luft „kleben“ an der Straße und das Fahrzeug braucht mehr Kraft zum Fahren. Es verbraucht also mehr Kraftstoff.", "tip": "Richtiger Reifendruck = weniger Kraftstoff"}, "e17": {"q": "Was führt zum Überhitzen der Bremstrommeln?", "o": ["Ein defektes Differential.", "Falscher Reifendruck.", "Defekte Rückholfedern der Bremsbacken."], "ex": "Die Rückholfedern ziehen die Bremsbacken zurück, wenn du die Bremse loslässt. Wenn sie nicht funktionieren, schleifen die Backen ständig und die Trommel wird heiß.", "tip": "Heiße Trommel = Backen gehen nicht zurück"}, "e19": {"q": "Wie oft sollte der Fahrer den Motorölstand prüfen?", "o": ["Vor einer langen Fahrt.", "Jeden Tag.", "Wenn die Öldruck-Warnleuchte aufleuchtet."], "ex": "Ein Berufsfahrer prüft das Öl jeden Tag. Wenn du auf die Leuchte wartest, ist es schon zu spät.", "tip": "Öl = jeden Tag"}, "e20": {"q": "Wenn der Anlasser nicht funktioniert, was ist wahrscheinlich die Ursache?", "o": ["Der Riemen ist gerissen.", "Es fließt kein Strom zwischen Batterie und Anlasser.", "Der Multiplikator funktioniert nicht richtig."], "ex": "Der Anlasser ist ein Elektromotor, den die Batterie versorgt. Wenn der Strom nicht ankommt, dreht er sich nicht.", "tip": "Anlasser tot = kein Strom"}, "e23": {"q": "Wenn ein Dieselmotor zu viel schwarzen Rauch ausstößt, was solltest du tun?", "o": ["Das Motoröl wechseln.", "Den Motor sofort reparieren.", "Einspritzpumpe und Einspritzdüsen prüfen und einstellen und den Luftfilter reinigen."], "ex": "Schwarzer Rauch bedeutet zu viel Diesel und zu wenig Luft. Du stellst die Düsen ein (weniger Diesel) und reinigst den Luftfilter (mehr Luft).", "tip": "Schwarzer Rauch = Düsen + Luftfilter"}, "e26": {"q": "Der Dieselmotor deines Busses springt an, geht aber nach ein paar Umdrehungen wieder aus. Was kann die Ursache sein?", "o": ["Zu niedrige Verdichtung in den Zylindern.", "Eine verstopfte Kraftstoffversorgung.", "Falsche innere Einstellung der Einspritzpumpe."], "ex": "Der Motor springt an, „verhungert“ dann aber und geht aus. Der Kraftstoff kommt nicht durch, weil etwas verstopft ist (z. B. der Kraftstofffilter).", "tip": "Springt an, geht aus = Kraftstoff verstopft"}, "e28": {"q": "Wenn die Kraftstoffanlage gut eingestellt ist, was verursacht blauen Rauch bei einem Dieselmotor?", "o": ["Der Fahrer fährt in einem hohen Gang.", "Die Motorsteuerung ist falsch eingestellt.", "Der Motor verbrennt viel Öl."], "ex": "Blauer Rauch = Öl verbrennt. Rauchfarben: schwarz = zu viel Kraftstoff, blau = Öl, weiß = Wasser.", "tip": "Blau = Öl"}, "e32": {"q": "Wenn deine Reifen mehr Druck als normal haben, wo nutzen sie sich mehr ab?", "o": ["An den Seiten der Lauffläche.", "In der Mitte der Lauffläche.", "Nur an der Innenseite der Lauffläche."], "ex": "Ein zu stark aufgepumpter Reifen wölbt sich in der Mitte und läuft vor allem auf der Mitte, deshalb nutzt er sich dort ab. Zu wenig Druck nutzt die Seiten ab.", "tip": "Zu viel Luft = Abrieb in der Mitte"}, "e35": {"q": "Du stellst fest, dass ein Luftbehälter der Druckluftbremse ein Loch hat. Was solltest du tun?", "o": ["Ihn schweißen lassen.", "Ihn vom übrigen Kreis abtrennen.", "Ihn sofort ersetzen lassen."], "ex": "Der Luftbehälter hält Luft unter hohem Druck und gehört zu den Bremsen. Man schweißt ihn nicht und nimmt ihn nicht aus dem Kreis: Er wird sofort ersetzt.", "tip": "Undichter Luftbehälter = neuer"}, "e37": {"q": "Du bemerkst weißen Rauch im Abgas eines Dieselmotors. Was ist wahrscheinlich die Ursache?", "o": ["Wasser ist in die Zylinder gelangt.", "Der Dieselmotor ist überhitzt.", "Hoher Ölverbrauch."], "ex": "Weißer Rauch ist Dampf: Wasser ist in die Zylinder gelangt und wird zu Dampf. Merke: weiß = Wasser, blau = Öl, schwarz = Kraftstoff.", "tip": "Weiß = Wasser"}, "e38": {"q": "Abgenutzte Stoßdämpfer verursachen:", "o": ["Weniger Seitenneigung in Kurven.", "Ungewöhnliches Fahrverhalten, besonders in Kurven.", "Ungewöhnlichen Motorlauf."], "ex": "Ohne gute Stoßdämpfer wippt und neigt sich das Fahrzeug stark, besonders in Kurven. Die Reifen verlieren den Kontakt zur Straße. Mit dem Motor haben sie nichts zu tun.", "tip": "Schlechte Stoßdämpfer = schlechte Kurvenlage"}, "e39": {"q": "Die Aufgabe der Frostschutzpumpe in einer Druckluftbremsanlage ist:", "o": ["Den Druck im System konstant zu halten.", "Druckluft zu liefern, damit der obere und untere Arbeitsdruck in den Luftbehältern konstant bleibt.", "Frostschutzmittel in die Druckluft zu sprühen, damit Teile bei sehr niedrigen Temperaturen nicht einfrieren."], "ex": "Frostschutz = gegen Eis. Die Luft enthält Feuchtigkeit, die im Winter in den Ventilen gefrieren kann. Die Pumpe sprüht Frostschutzmittel, damit sie nicht einfrieren.", "tip": "Frostschutz = damit nichts einfriert"}, "e40": {"q": "Für die Verkehrssicherheit ist es sinnvoll:", "o": ["Die Reifen mit weniger Druck zu füllen, als der Hersteller empfiehlt.", "Vor der Fahrt den Reifendruck zu prüfen.", "Mit Fernlicht zu fahren."], "ex": "Vor jeder Fahrt prüfst du den Reifendruck. Falscher Druck bedeutet schlechteres Bremsen und Gefahr eines Reifenplatzers.", "tip": "Vor der Fahrt: Reifendruck"}, "e42": {"q": "Die Haftung zwischen Reifen und Straße wird beeinflusst durch:", "o": ["Hohe Motordrehzahl.", "Die Außentemperatur.", "Die Qualität und den Druck der Reifen."], "ex": "Wie gut der Reifen die Straße „festhält“, hängt vom Reifen selbst ab: seiner Qualität und dem richtigen Druck.", "tip": "Haftung = Reifenqualität + Druck"}, "e43": {"q": "Was passiert, wenn die Spreizung (Neigung des Achsschenkelbolzens) nicht stimmt?", "o": ["Die Lenkung kehrt nicht normal zurück und ist nicht stabil.", "Die Lenkanlage verschleißt früh.", "Du kannst das Fahrzeug nicht leicht lenken."], "ex": "Dieser Winkel sorgt dafür, dass das Lenkrad nach einer Kurve von selbst geradeaus zurückkehrt und das Fahrzeug stabil bleibt. Wenn er falsch ist, kehrt das Lenkrad nicht zurück und das Fahrzeug „wandert“.", "tip": "Falscher Winkel = Lenkrad kehrt nicht zurück"}, "t01": {"q": "Wenn der Fahrtenschreiber kaputtgeht, was muss der Fahrer tun?", "o": ["Den Fahrzeughalter informieren.", "Ihn schnell reparieren lassen und es der nächsten Polizeidienststelle melden.", "Ihn reparieren, wenn es passt."], "ex": "Der Fahrtenschreiber ist Pflicht. Wenn er kaputtgeht, muss er schnell repariert werden und du meldest es der Polizei, damit klar ist, dass du ihn nicht absichtlich beschädigt hast.", "tip": "Fahrtenschreiber kaputt = Polizei + schnell reparieren"}, "t02": {"q": "Wie lange müssen die Schaublätter (Scheiben/Streifen) des Fahrtenschreibers nach Gebrauch aufbewahrt werden?", "o": ["6 Monate.", "12 Monate.", "24 Monate."], "ex": "Die Schaublätter werden 12 Monate (ein Jahr) aufbewahrt. Der Fahrzeughalter bewahrt sie auf.", "tip": "Schaublätter = 1 Jahr"}, "t16": {"q": "Wer muss die Schaublätter (Scheiben/Streifen) des Fahrtenschreibers ein Jahr lang aufbewahren?", "o": ["Der Fahrzeughalter.", "Die örtliche Polizei.", "Der Fahrer des Fahrzeugs."], "ex": "Der Halter (die Firma) bewahrt die Scheiben ein Jahr auf, damit Kontrollen möglich sind. Der Fahrer hat nur die aktuellen dabei.", "tip": "Der Halter bewahrt sie auf"}, "t17": {"q": "Außer dem Schlüssel des Fahrtenschreibers muss der Busfahrer die Schaublätter folgender Zeit mitführen und auf Verlangen vorzeigen:", "o": ["Des Vortags.", "Der letzten fünf (5) Tage.", "Der letzten fünfzehn (15) Tage."], "ex": "Laut Buch hat der Fahrer die Scheiben der letzten 15 Tage dabei, um sie bei einer Kontrolle zu zeigen.", "tip": "Dabei: 15 Tage"}, "t14": {"q": "Bevor das Schaublatt (Scheibe oder Streifen) in den Fahrtenschreiber kommt, muss der Fahrer:", "o": ["Die nach den Fahrtenschreiber-Vorschriften nötigen Angaben eintragen.", "Es einlegen, ohne etwas einzutragen.", "Nur seinen Namen darauf schreiben."], "ex": "Vor dem Einlegen schreibst du alle Angaben, die das Gesetz verlangt (Name, Datum, Ort, Kilometerstand, Kennzeichen). Sonst beweist die Scheibe nichts.", "tip": "Erst ausfüllen, dann einlegen"}, "t15": {"q": "Der Fahrtenschreiber muss laufen:", "o": ["Die ganzen 24 Stunden ohne Unterbrechung.", "10 Stunden lang.", "15 Stunden lang."], "ex": "Der Fahrtenschreiber zeichnet Fahren und Ruhe auf. Deshalb läuft er alle 24 Stunden ohne Unterbrechung.", "tip": "Fahrtenschreiber = 24 Stunden"}, "t13": {"q": "Der Geschwindigkeitsbegrenzer, der nach Richtlinie 92/6/EWG in Busse eingebaut wird, begrenzt ihre Geschwindigkeit auf:", "o": ["90 km/h.", "100 km/h.", "110 km/h."], "ex": "Der Geschwindigkeitsbegrenzer im Bus ist auf 100 km/h eingestellt. Schneller kann der Bus nicht fahren.", "tip": "Begrenzer = 100"}, "t05": {"q": "Der Geschwindigkeitsbegrenzer im Bus wirkt auf:", "o": ["Die Bremsanlage.", "Die Kraftstoffversorgung.", "Die Auspuffanlage."], "ex": "Der Begrenzer bremst nicht. Er nimmt einfach den Kraftstoff weg, wenn du 100 km/h erreichst, sodass der Bus nicht weiter beschleunigt.", "tip": "Begrenzer = nimmt Kraftstoff weg"}, "t06": {"q": "Der Fahrer eines Busses mit Geschwindigkeitsbegrenzer:", "o": ["Darf die Geschwindigkeit des Begrenzers weder vorübergehend noch dauerhaft erhöhen.", "Darf die Geschwindigkeit des Begrenzers vorübergehend erhöhen.", "Darf die Geschwindigkeit des Begrenzers dauerhaft erhöhen."], "ex": "Am Begrenzer wird nie manipuliert: nicht für eine Weile und nicht für immer.", "tip": "Finger weg vom Begrenzer"}, "t04": {"q": "Im Fahrzeugschein eines Busses mit Geschwindigkeitsbegrenzer muss der Vermerk stehen:", "o": ["„Mit Geschwindigkeitsbegrenzer ausgestattet“.", "„Mit Geschwindigkeitsbegrenzer ausgestattet. Erlaubt Geschwindigkeiten über 100 km/h“.", "„Mit Geschwindigkeitsbegrenzer ausgestattet. Höchstgeschwindigkeit 100 km/h“."], "ex": "Im Fahrzeugschein steht beides: dass es einen Begrenzer gibt und bei welcher Geschwindigkeit: 100 km/h. Das ist die vollständigste Antwort.", "tip": "Fahrzeugschein: Begrenzer + 100 km/h"}, "t07": {"q": "Der Fahrer eines Busses mit Geschwindigkeitsbegrenzer muss unter anderem immer dieses Dokument zum System dabeihaben:", "o": ["Eine Bescheinigung des Händlers oder der zugelassenen Werkstatt, die ihn eingebaut hat.", "Die technische Anleitung (Prospekt) des Systems.", "Die Garantie des Systems."], "ex": "Bei einer Kontrolle musst du beweisen, dass der Begrenzer richtig eingebaut wurde. Das zeigt die Bescheinigung der Werkstatt, die ihn eingebaut hat.", "tip": "Begrenzer: Werkstatt-Bescheinigung"}, "t08": {"q": "Müssen Busse mit Geschwindigkeitsbegrenzer auch einen Fahrtenschreiber haben?", "o": ["Nein.", "Sie können freiwillig einen haben.", "Ja."], "ex": "Begrenzer und Fahrtenschreiber haben verschiedene Aufgaben. Der Begrenzer begrenzt die Geschwindigkeit, der Fahrtenschreiber zeichnet die Stunden auf. Beide sind nötig.", "tip": "Begrenzer UND Fahrtenschreiber"}, "t09": {"q": "Müssen Stadtbusse nach Richtlinie 92/6/EWG einen Geschwindigkeitsbegrenzer haben?", "o": ["Nein.", "Ja."], "ex": "Stadtbusse fahren in der Stadt und kommen nie an 100 km/h heran. Deshalb verlangt die Richtlinie keinen Begrenzer für sie.", "tip": "Stadtbus = kein Begrenzer nötig"}, "t10": {"q": "Busse müssen nach Richtlinie 92/6/EWG einen Geschwindigkeitsbegrenzer haben, wenn sie in einem EU-Land erstmals zugelassen wurden nach dem:", "o": ["1. Januar 1984.", "1. Januar 1985.", "1. Januar 1988."], "ex": "Busse, die nach dem 1. Januar 1988 zugelassen wurden, müssen einen Geschwindigkeitsbegrenzer haben.", "tip": "Begrenzer für Busse ab 1988"}, "t11": {"q": "Müssen Busse, die bauartbedingt nicht schneller als 100 km/h fahren können, einen Geschwindigkeitsbegrenzer haben?", "o": ["Ja.", "Nein."], "ex": "Der Begrenzer sorgt dafür, dass der Bus nicht schneller als 100 km/h fährt. Wenn der Bus bauartbedingt nicht schneller kann, braucht er keinen.", "tip": "Schafft keine 100? Kein Begrenzer nötig"}, "t12": {"q": "Warum wurde der Geschwindigkeitsbegrenzer in Bussen Pflicht?", "o": ["Um das Fahrverhalten des Busses zu verbessern.", "Für den Komfort der Fahrgäste.", " en) eines Busfahrers mindestens dauern?", "o": ["11 Stunden.", "14 Stunden.", "15 Stunden."], "ex": "Innerhalb von 24 Stunden muss der Fahrer mindestens 11 Stunden ruhen.", "tip": "Tägliche Ruhe = 11 Stunden"}, "a23": {"q": "Wie oft pro Woche darf ein Busfahrer 10 Stunden am Tag fahren?", "o": ["Einmal (1).", "Zweimal (2).", "Dreimal (3)."], "ex": "Normalerweise fährst du bis zu 9 Stunden am Tag. Zweimal pro Woche sind 10 Stunden erlaubt.", "tip": "10 Stunden: nur zweimal pro Woche"}, "a24": {"q": "Wie viele Arbeitsstunden darf ein Busfahrer in zwei Wochen höchstens haben?", "o": ["80 Stunden.", "90 Stunden.", "100 Stunden."], "ex": "In zwei aufeinanderfolgenden Wochen darf der Fahrer höchstens 90 Stunden fahren.", "tip": "2 Wochen = 90 Stunden"}, "a07": {"q": "Jeder Bus muss zwei (2) Pulverlöscher (oder ein anderes von der Feuerwehr zugelassenes Mittel mit gleicher Leistung) mitführen, jeweils mit einem Nettogewicht von:", "o": ["6 kg.", "8 kg.", "10 kg."], "ex": "Die Lösungstabelle des Buches nennt 6 kg pro Feuerlöscher. Zwei Löscher, damit noch einer da ist, wenn der erste leer ist.", "tip": "2 Löscher × 6 kg"}, "a08": {"q": "Sicherheitsgurte für Fahrgäste sind Pflicht:", "o": ["In Bussen für Personalbeförderung.", "In Reisebussen.", "In Schulbussen."], "ex": "Schulbusse befördern Kinder, die am meisten Schutz brauchen. Deshalb sind dort Gurte für die Fahrgäste Pflicht.", "tip": "Schulbus = Gurte für alle Kinder"}, "a09": {"q": "Wer muss in Reisebussen einen Sicherheitsgurt tragen?", "o": ["Der Fahrer und der Reiseleiter.", "Die Fahrgäste.", "Der Reiseleiter."], "ex": "Laut Lösungstabelle des Buches ist die richtige Antwort der Reiseleiter. Er sitzt meist vorne, auf dem gefährlichsten Platz.", "tip": "Reisebus: der Reiseleiter schnallt sich an"}, "a10": {"q": "Wenn du die Außenfarbe deines Fahrzeugs änderst:", "o": ["Musst du es der Stelle melden, die den Fahrzeugschein ausgestellt hat.", "Hast du keine Pflicht, solange du die vorgeschriebenen Aufschriften wieder anbringst.", "Hängt die Meldepflicht vom zulässigen Gesamtgewicht ab."], "ex": "Die Farbe steht im Fahrzeugschein. Wenn du sie änderst, musst du es der Stelle melden, die den Fahrzeugschein ausgestellt hat.", "tip": "Neue Farbe = melden"}, "a11": {"q": "Wenn das vordere Kennzeichen des Fahrzeugs in zwei Teile bricht, musst du:", "o": ["Die beiden Teile zusammenfügen.", "Zur Verkehrsbehörde gehen, um Ersatz zu bekommen.", "Ein Ersatzschild kaufen und anbringen."], "ex": "Kennzeichen gibt nur die Verkehrsbehörde aus. Man klebt sie nicht und kauft sie nicht woanders.", "tip": "Kaputtes Kennzeichen = Verkehrsbehörde"}, "a12": {"q": "Beim Fahren sind Nebelscheinwerfer:", "o": ["In Tunneln nicht erlaubt.", "Bei dichtem Nebel Pflicht, innerorts und außerorts.", "Auch tagsüber Pflicht, wenn man eine Militärkolonne überholt."], "ex": "Nebelscheinwerfer schaltet man bei dichtem Nebel ein, innerorts und außerorts.", "tip": "Dichter Nebel = Nebellicht überall"}, "a13": {"q": "Sicherheitsgurte:", "o": ["Sind die einzigen Sicherheitssysteme in Autos.", "Nützen im Verkehr wenig.", "Müssen von zugelassener Bauart sein und immer in gutem Zustand gehalten werden."], "ex": "Gurte retten nur Leben, wenn sie zugelassen und in gutem Zustand sind. Die anderen beiden Antworten sind offensichtlich falsch.", "tip": "Gurte: zugelassen + in gutem Zustand"}, "a14": {"q": "Busse müssen geprüft werden und eine Abgaskarte (ΚΕΚ) bekommen:", "o": ["Alle 6 Monate.", "Jedes Jahr.", "Alle zwei Jahre."], "ex": "Busse fahren viele Kilometer, deshalb wird ihr Abgas oft geprüft: alle 6 Monate.", "tip": "Abgaskarte = alle 6 Monate"}, "a21": {"q": "Ein Bus muss beim KTEO (TÜV) geprüft werden:", "o": ["Alle 6 Monate.", "Jedes Jahr.", "Alle zwei Jahre."], "ex": "Der Bus kommt jedes Jahr zum KTEO. Nicht mit der Abgaskarte verwechseln, die gibt es alle 6 Monate.", "tip": "KTEO = jedes Jahr"}, "a16": {"q": "Wie oft wird ein Führerschein der Klasse D oder D+E verlängert?", "o": ["Alle drei (3) Jahre.", "Alle fünf (5) Jahre.", "Bis 65 alle fünf (5) Jahre und nach 65 alle drei (3) Jahre."], "ex": "Bis 65 wird der Führerschein alle 5 Jahre verlängert. Nach 65 öfter, alle 3 Jahre, weil die Gesundheit des Fahrers geprüft wird.", "tip": "5 Jahre, ab 65 alle 3"}, "a17": {"q": "Wann dürfen Stadt- oder Überlandbusse stehende Fahrgäste befördern?", "o": ["Wenn es im Fahrzeugschein des Busses steht.", "Wenn der Hersteller des Busses es erlaubt.", "Wenn es an der Decke und im Gang genug Haltegriffe gibt, an denen sie sich festhalten können."], "ex": "Ein stehender Fahrgast muss sich irgendwo festhalten können. Ohne genug Haltegriffe keine stehenden Fahrgäste.", "tip": "Stehen = braucht Haltegriffe"}, "a18": {"q": "Dürfen Stadtbusse stehende Fahrgäste befördern? Wenn ja, wie viele?", "o": ["Ja, so viele wie in den Bus passen.", "Ja, so viele wie im Fahrzeugschein des Busses stehen.", "Ja, so viele wie es sitzende Fahrgäste gibt."], "ex": "Die Zahl der Stehplätze steht im Fahrzeugschein. Nicht „so viele wie reinpassen“.", "tip": "Wie viele stehen? Was im Fahrzeugschein steht"}, "a19": {"q": "Kinder unter 6 Jahren dürfen in Stadt- oder Überlandbussen mitfahren, wenn:", "o": ["Sie hinter einem anderen Fahrgastsitz sitzen.", "Sie mit einer Begleitperson fahren, die auf sie aufpasst, und zusammen auf einem Sitz sitzen, vor dem ein anderer Sitz ist.", "Sie einen Sicherheitsgurt tragen."], "ex": "Ein kleines Kind braucht eine Begleitperson und muss auf einem Sitz sitzen, vor dem ein anderer Sitz ist (zum Schutz). Das ist die vollständigste Antwort.", "tip": "Kind unter 6 = Begleitung + Sitz davor"}, "a20": {"q": "Wie hoch ist der Anteil (in Prozent) stehender Fahrgäste im Verhältnis zu sitzenden in einem Überlandbus höchstens?", "o": ["25 %.", "30 %.", "50 %."], "ex": "Die Lösungstabelle des Buches nennt 25 %: höchstens 1 stehender Fahrgast auf 4 sitzende. Überlandbusse fahren schneller, deshalb wenige Stehende.", "tip": "Überland: Stehende bis 25 %"}}};

function load(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign(blank(),JSON.parse(r))}catch(e){}return blank()}
let S=load();
let cloud=null,saving=false,again=false,saveT=null,syncState="local";
function save(){S.updatedAt=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(cloud){clearTimeout(saveT);saveT=setTimeout(flush,1200)}}
async function flush(){if(!cloud)return;if(saving){again=true;return}saving=true;
  try{await cloud.set({state:JSON.stringify(S),updatedAt:S.updatedAt});setSync("ok")}catch(e){setSync("err")}
  saving=false;if(again){again=false;flush()}}
function setSync(s){syncState=s;const el=document.getElementById("sync");if(el)el.outerHTML=syncHTML()}
function syncHTML(){return `<span id="sync" class="sync ${syncState}"><i></i>${u("sync_"+syncState)}</span>`}
(async()=>{try{
  if(!window.claude||!window.claude.use)return;
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(!db||!user)return;const uid=await user.id();if(!uid)return;
  const ref=db.collection("data/users/"+uid).doc("progress");
  const snap=await ref.get();
  if(snap.exists){const d=snap.data();try{const r=JSON.parse(d.state);if((r.updatedAt||0)>(S.updatedAt||0)){S=Object.assign(blank(),r);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!busy())render()}}catch(e){}}
  cloud=ref;setSync("ok");
  if(!snap.exists||(snap.data().updatedAt||0)<S.updatedAt)flush();
}catch(e){}})();

/* ---------- Βοηθητικά ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dk=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const yday=()=>{const d=new Date();d.setDate(d.getDate()-1);return dk(d)};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const streakNow=()=>(S.streak.last===dk()||S.streak.last===yday())?S.streak.count:0;
const todayN=()=>S.days[dk()]||0;
function addTime(ms){ms=Math.max(0,Math.min(ms,180000));S.timeMs=(S.timeMs||0)+ms;S.dayTime=S.dayTime||{};const t=dk();S.dayTime[t]=(S.dayTime[t]||0)+ms}
function fmtDur(ms){const m=Math.round((ms||0)/60000);if(m<60)return m+" "+u("min");return Math.floor(m/60)+" "+u("hr")+" "+(m%60)+" "+u("min")}
const pick1=a=>a[Math.random()*a.length|0];
const level=()=>Math.floor(S.xp/100)+1;
const boxOf=id=>(S.cards[id]||{box:0}).box;
const mastered=()=>Q.filter(q=>boxOf(q.id)>=4).length;
const dueCount=()=>{const n=Date.now();return Q.filter(q=>{const c=S.cards[q.id];return c&&c.due<=n}).length};
const newCount=()=>Q.filter(q=>!S.cards[q.id]).length;
const weakList=()=>Q.filter(q=>{const c=S.cards[q.id];return c&&c.bad>0&&c.box<=2});
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
const flame=`<svg class="flame" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2c1 3.5 5 6 5 11a5 5 0 0 1-10 0c0-2.2 1-3.6 2-4.6.2 1.6 1 2.6 2 3.1C10.6 8.6 11.3 5 12 2z"/></svg>`;

/* ---------- Παράσημα ---------- */
const BADGES=[
 {id:"first",m:"1",ok:()=>Object.keys(S.cards).length>0},
 {id:"s3",m:"3",ok:()=>S.streak.best>=3},
 {id:"s7",m:"7",ok:()=>S.streak.best>=7},
 {id:"c10",m:"×10",ok:()=>S.bestCombo>=10},
 {id:"m10",m:"10",ok:()=>mastered()>=10},
 {id:"seen50",m:"50",ok:()=>Object.keys(S.cards).length>=50},
 {id:"seenall",m:"Δ",ok:()=>Q.every(q=>S.cards[q.id])},
 {id:"h1",m:"1h",ok:()=>(S.timeMs||0)>=3600e3},
 {id:"m100",m:"100",ok:()=>mastered()>=100},
 {id:"ep",m:"✓",ok:()=>S.exams.some(e=>e.passed)},
 {id:"e0",m:"0",ok:()=>S.exams.some(e=>e.err===0)}
];
const bt=id=>u("badges")[id];
function checkBadges(){for(const b of BADGES){if(!S.badges[b.id]&&b.ok()){S.badges[b.id]=Date.now();toast(u("newBadge")+bt(b.id)[0])}}}
