 να ελέγχονται και να εφοδιάζονται με Κάρτα Ελέγχου Καυσαερίων:","o":["Κάθε 6 μήνες.","Κάθε χρόνο.","Κάθε δύο χρόνια."],"a":0,"ex":"Τα λεωφορεία κάνουν πολλά χιλιόμετρα, γι' αυτό τα καυσαέριά τους ελέγχονται συχνά: κάθε 6 μήνες.","tip":"Κάρτα καυσαερίων = κάθε 6 μήνες"},{"id":"a16","cat":"admin","n":16,"q":"Η άδεια οδηγήσεως Δ ή Δ+Ε κάθε πότε ανανεώνεται:","o":["Κάθε τρία (3) χρόνια.","Κάθε πέντε (5) χρόνια.","Κάθε πέντε (5) χρόνια μέχρι το 65ο έτος και κάθε τρία (3) χρόνια μετά το 65ο έτος."],"a":2,"ex":"Μέχρι τα 65 το δίπλωμα ανανεώνεται κάθε 5 χρόνια. Μετά τα 65 πιο συχνά, κάθε 3 χρόνια, γιατί ελέγχεται η υγεία του οδηγού.","tip":"5 χρόνια, μετά τα 65 κάθε 3"},{"id":"a17","cat":"admin","n":17,"q":"Πότε επιτρέπεται η μεταφορά ορθίων επιβατών με τα αστικά ή υπεραστικά λεωφορεία:","o":["Όταν αναφέρεται στην άδεια κυκλοφορίας του λεωφορείου.","Όταν το προβλέπει το εργοστάσιο κατασκευής του λεωφορείου.","Όταν στην οροφή του αμαξώματος και στο διάδρομο υπάρχει ανάλογος αριθμός χειρολαβών για τη στήριξή τους."],"a":2,"ex":"Ο όρθιος επιβάτης πρέπει να έχει από πού να κρατηθεί. Χωρίς αρκετές χειρολαβές δεν επιτρέπονται όρθιοι.","tip":"Όρθιοι = χρειάζονται χειρολαβές"},{"id":"a18","cat":"admin","n":18,"q":"Επιτρέπεται η μεταφορά ορθίων επιβατών με τα αστικά λεωφορεία; Αν ναι, μέχρι ποιο αριθμό:","o":["Ναι, όσους χωράει το λεωφορείο.","Ναι, όσους αναφέρει η άδεια κυκλοφορίας του λεωφορείου.","Ναι, σε αριθμό ίσο με τον αριθμό των καθημένων επιβατών."],"a":1,"ex":"Ο αριθμός των όρθιων επιβατών είναι γραμμένος στην άδεια κυκλοφορίας. Όχι «όσους χωράνε».","tip":"Πόσοι όρθιοι; Όσους γράφει η άδεια"},{"id":"a19","cat":"admin","n":19,"q":"Η μεταφορά παιδιών ηλικίας κάτω των 6 ετών με τα αστικά ή υπεραστικά λεωφορεία επιτρέπεται, όταν:","o":["Καταλαμβάνουν θέση όπισθεν άλλου καθίσματος επιβάτη.","Συνοδεύονται από άλλο πρόσωπο, που επιμελείται της μεταφοράς τους, και κάθονται μαζί σε κάθισμα επιβάτη, εμπρός από το οποίο υπάρχει άλλο κάθισμα επιβάτη.","Φορούν ζώνη ασφαλείας."],"a":1,"ex":"Ένα μικρό παιδί χρειάζεται συνοδό και πρέπει να κάθεται σε θέση που έχει μπροστά της άλλο κάθισμα (για προστασία). Είναι η πιο πλήρης απάντηση.","tip":"Παιδί κάτω των 6 = συνοδός + κάθισμα μπροστά"},{"id":"a20","cat":"admin","n":20,"q":"Ο μέγιστος αριθμός (σε ποσοστό) των ορθίων επιβατών έναντι των καθημένων ενός υπεραστικού λεωφορείου ποιος είναι:","o":["25%.","30%.","50%."],"a":0,"ex":"Ο πίνακας λύσεων του βιβλίου δίνει 25%: για κάθε 4 καθήμενους επιτρέπεται το πολύ 1 όρθιος. Το υπεραστικό πηγαίνει γρηγορότερα, γι' αυτό λίγοι όρθιοι.","tip":"Υπεραστικό: όρθιοι έως 25%","cf":1},{"id":"a21","cat":"admin","n":21,"q":"Ο έλεγχος λεωφορείου στο ΚΤΕΟ πρέπει να γίνεται:","o":["Κάθε 6 μήνες.","Κάθε χρόνο.","Κάθε δύο χρόνια."],"a":1,"ex":"Το λεωφορείο πηγαίνει στο ΚΤΕΟ κάθε χρόνο. Μην το μπερδέψεις με την κάρτα καυσαερίων, που είναι κάθε 6 μήνες.","tip":"ΚΤΕΟ = κάθε χρόνο"},{"id":"a22","cat":"admin","n":22,"q":"Πόσες ώρες τουλάχιστον πρέπει να διαρκεί η ημερήσια (περίοδος 24 ωρών) ανάπαυση του οδηγού ενός λεωφορείου:","o":["11 ώρες.","14 ώρες.","15 ώρες."],"a":0,"ex":"Μέσα σε κάθε 24ωρο ο οδηγός πρέπει να ξεκουραστεί τουλάχιστον 11 ώρες.","tip":"Ημερήσια ανάπαυση = 11 ώρες"},{"id":"a23","cat":"admin","n":23,"q":"Πόσες φορές σε μία εβδομάδα ο οδηγός ενός λεωφορείου μπορεί να οδηγεί επί 10 ώρες την ημέρα:","o":["Μία (1) φορά.","Δύο (2) φορές.","Τρεις (3) φορές."],"a":1,"ex":"Κανονικά οδηγείς έως 9 ώρες τη μέρα. Δύο φορές την εβδομάδα επιτρέπονται 10 ώρες.","tip":"10 ώρες: μόνο 2 φορές την εβδομάδα"},{"id":"a24","cat":"admin","n":24,"q":"Ποιος είναι ο μέγιστος αριθμός ωρών εργασίας ενός οδηγού λεωφορείου στη διάρκεια δύο εβδομάδων:","o":["80 ώρες.","90 ώρες.","100 ώρες."],"a":1,"ex":"Σε δύο συνεχόμενες εβδομάδες ο οδηγός μπορεί να οδηγήσει το πολύ 90 ώρες.","tip":"2 εβδομάδες = 90 ώρες"},{"id":"a25","cat":"admin","n":25,"q":"Η διάρκεια της συνεχούς οδηγήσεως από τον οδηγό ενός λεωφορείου είναι:","o":["5 ώρες και 30 πρώτα λεπτά.","4 ώρες και 30 πρώτα λεπτά.","3 ώρες και 30 πρώτα λεπτά."],"a":1,"ex":"Χωρίς διάλειμμα ο οδηγός μπορεί να οδηγήσει έως 4 ώρες και 30 λεπτά. Μετά πρέπει να σταματήσει για 45 λεπτά.","tip":"Συνεχής οδήγηση: έως 4,5 ώρες"}];
const TR={"en": {"s01": {"q": "What does this sign mean?", "o": ["Lane reserved for buses or trolleybuses.", "End of lane reserved for buses or trolleybuses.", "No entry for buses or trolleybuses."], "ex": "A blue circle means an obligation (here: a lane only for buses). A red diagonal line across a blue sign always means \"end\". So: the bus lane ends here.", "tip": "Blue + red line = END"}, "s02": {"q": "What does this sign mean?", "o": ["No entry for passenger cars.", "No entry for all vehicles except passenger cars.", "No entry for motor vehicles except two-wheeled motorcycles."], "ex": "A red circle means a ban. The car seen from the front stands for all motor vehicles, buses included. Only two-wheeled motorcycles are allowed.", "tip": "Red circle with car: no motor vehicles except motorbikes"}, "s03": {"q": "What does this sign mean?", "o": ["Priority over oncoming traffic.", "Give way to oncoming traffic because the road narrows.", "Warning of two-way traffic ahead."], "ex": "The road narrows and two vehicles don't fit. On this round sign (a ban), the red arrow is yours: you must wait and let the oncoming vehicle go first.", "tip": "Round sign = you wait. Blue square = you go first"}, "s04": {"q": "What does this sign mean?", "o": ["Priority over oncoming traffic.", "Give way to oncoming traffic.", "Warning of two-way traffic ahead."], "ex": "The opposite of the previous sign. A blue square gives information. Your white arrow is big, the oncoming red one small: at the narrow point you go first.", "tip": "Blue square = you have priority"}, "s05": {"q": "What does this sign mean?", "o": ["Priority over oncoming traffic.", "Give way to oncoming traffic.", "Warning of two-way traffic ahead."], "ex": "A triangle warns of danger. Two arrows in opposite directions warn you that the road ahead becomes two-way: traffic will come towards you.", "tip": "Triangle with two arrows = oncoming traffic ahead"}, "s06": {"q": "What does this sign mean?", "o": ["Expressway.", "Motorway.", "Passenger cars allowed."], "ex": "A blue square with a white car = expressway. Don't mix it up with the motorway, which has a green sign with a bridge.", "tip": "Blue with car = expressway. Green with bridge = motorway"}, "s07": {"q": "What does this sign mean?", "o": ["No entry for passenger cars.", "End of motorway.", "End of expressway."], "ex": "It is the expressway sign (blue with car) with a red diagonal line. The line means \"end\".", "tip": "Blue car + line = end of expressway"}, "s08": {"q": "What does this sign mean?", "o": ["Expressway.", "Motorway.", "Dead end."], "ex": "A green sign with a road and a bridge over it = motorway. In Greece, motorway signs are green.", "tip": "Green + bridge = motorway"}, "s09": {"q": "What does this sign mean?", "o": ["End of expressway.", "End of dead end.", "End of motorway."], "ex": "The green motorway sign with a red diagonal line means the motorway ends.", "tip": "Green + line = end of motorway"}, "s10": {"q": "What does this sign mean?", "o": ["No pedestrians.", "Pedestrian crossing.", "Underpass for pedestrians."], "ex": "A blue square gives information. The person on the white stripes shows a pedestrian crossing. A ban would be a red circle.", "tip": "Blue with person on stripes = crossing"}, "s11": {"q": "What does this sign mean?", "o": ["Numbering of national roads.", "Numbering of international routes.", "Kilometre markers."], "ex": "Blue numbers in a shield shape (8, 67) are national road numbers.", "tip": "Blue shield with number = national road"}, "s12": {"q": "What does this sign mean?", "o": ["Numbering of national roads.", "Numbering of international routes.", "Kilometre markers."], "ex": "The \"E\" before the number means a European (international) route. International routes have a green sign.", "tip": "E = Europe = international route"}, "s13": {"q": "What does this sign mean?", "o": ["Numbering of national roads.", "Numbering of international routes.", "Kilometre markers."], "ex": "\"Χμ / Km\" means kilometres. The sign shows which kilometre of the road you are at.", "tip": "Χμ/Km = kilometre marker"}, "s14": {"q": "What does this sign mean?", "o": ["Arrow-shaped direction sign for one place.", "Warning of a compulsory route.", "Arrow-shaped direction sign for a place of major tourist or archaeological interest."], "ex": "The sign is arrow-shaped and names only one place (Piraeus, 9 km). So it shows the direction to one place.", "tip": "One name on an arrow = one place"}, "s15": {"q": "What does this sign mean?", "o": ["Arrow-shaped direction sign for more than one place.", "Warning of a compulsory route.", "Arrow-shaped direction sign for a place of major tourist or archaeological interest."], "ex": "The same arrow, but now with two destinations (Airport and Piraeus). So: direction to more than one place.", "tip": "Several names on an arrow = several places"}, "s16": {"q": "What does this sign mean?", "o": ["Minimum speed per lane.", "Maximum speed per lane.", "General speed limits."], "ex": "Each lane has its own limit. A number in a red circle always means a maximum (don't go faster).", "tip": "Red circle = UP TO this speed"}, "s17": {"q": "What does this sign mean?", "o": ["Minimum speed per lane.", "Maximum speed per lane.", "General speed limits."], "ex": "Here the numbers are in blue circles. Blue circle = obligation, i.e. a minimum speed: don't go slower in this lane.", "tip": "Blue circle = AT LEAST this speed"}, "s18": {"q": "What does this sign mean?", "o": ["Minimum speed per lane.", "Maximum speed per lane.", "General speed limits."], "ex": "The \"GREECE\" sign stands at the border. It shows the country's general limits: 50 in towns, 90 outside towns, 120 on motorways.", "tip": "GREECE = the country's general limits"}, "s19": {"q": "What does this sign mean?", "o": ["Direction to motorway exit.", "Direction to motorway entrance.", "Advance notice of a motorway interchange."], "ex": "A green arrow with the motorway symbol shows where you get onto the motorway. The exit sign says \"ΕΞΟΔΟΣ / EXIT\".", "tip": "Motorway symbol on the arrow = entrance"}, "s20": {"q": "What does this sign mean?", "o": ["Direction to motorway exit.", "Direction to motorway entrance.", "Advance notice of a motorway interchange."], "ex": "\"ΚΟΜΒΟΣ / INTERCHANGE 2000 m\": there is an interchange in 2 km. The sign tells you in advance so you can get ready.", "tip": "Interchange + distance = advance notice"}, "s21": {"q": "What does this sign mean?", "o": ["Direction to motorway exit.", "Direction to motorway entrance.", "Advance notice of a motorway interchange."], "ex": "It says \"ΕΞΟΔΟΣ / EXIT\" and is arrow-shaped: it shows where you leave the motorway.", "tip": "ΕΞΟΔΟΣ = exit"}, "s22": {"q": "What does this sign mean?", "o": ["Crossroads where priority from the right applies.", "Side road on the right whose traffic must give way.", "Crossroads with a priority road."], "ex": "The \"X\" in the triangle means a crossroads without special signs. The basic rule applies: whoever comes from the right has priority.", "tip": "X = right has priority"}, "s23": {"q": "What does this sign mean?", "o": ["Crossroads where priority from the right applies.", "Side road on the right whose traffic must give way.", "Crossroads with a priority road."], "ex": "The thick line is your road (main road). The thin line on the right is a smaller road. Traffic from there must let you pass.", "tip": "Thick line = you. Thin line = they wait"}, "s24": {"q": "What does this sign mean?", "o": ["Give way.", "Priority road.", "End of priority road."], "ex": "The upside-down triangle is a unique sign: \"give way\". You must let traffic on the other road pass.", "tip": "Upside-down triangle = you give way"}, "s25": {"q": "What does this sign mean?", "o": ["Give way.", "Priority road.", "End of priority road."], "ex": "The yellow diamond means you are on a priority road: at junctions you go first.", "tip": "Yellow diamond = you have priority"}, "s26": {"q": "What does this sign mean?", "o": ["Give way.", "Priority road.", "End of priority road."], "ex": "The same yellow diamond with a black line: the priority road ends. From here, priority from the right applies again.", "tip": "Diamond + line = end of priority"}, "s28": {"q": "What does this sign mean?", "o": ["Dangerous bend to the right.", "Compulsory turn right.", "Pass only on the right of the island or obstacle."], "ex": "A triangle warns of danger. The curve shows a dangerous bend to the right ahead. Slow down.", "tip": "Triangle = warning, danger"}, "s29": {"q": "What does this sign mean?", "o": ["Dangerous bend to the right.", "Compulsory turn right.", "Pass only on the right of the island or obstacle."], "ex": "Blue circle = obligation. The arrow going straight and then turning right means you must turn right.", "tip": "Blue circle = MUST"}, "s30": {"q": "What does this sign mean?", "o": ["Dangerous bend to the right.", "Compulsory turn right.", "Pass only on the right of the island or obstacle."], "ex": "A blue circle with a slanted arrow pointing down-right: you must pass on the right side of the island or obstacle. Usually seen on traffic islands.", "tip": "Slanted arrow = pass right of the obstacle"}, "s31": {"q": "What does this sign mean?", "o": ["Slippery road.", "Dangerous double bend, first to the left.", "Dangerous double bend, first to the right."], "ex": "Read the drawing from bottom to top, the way you drive. From the bottom, the line bends left first, then right.", "tip": "Read the sign from the BOTTOM up"}, "s32": {"q": "What does this sign mean?", "o": ["Slippery road.", "Dangerous double bend, first to the left.", "Dangerous double bend, first to the right."], "ex": "Same sign, drawn the other way. From bottom to top the line bends right first, then left.", "tip": "From the bottom: which way first?"}, "s33": {"q": "What does this sign mean?", "o": ["Slippery road.", "Dangerous double bend, first to the left.", "Dangerous double bend, first to the right."], "ex": "The car with wiggly lines behind it is skidding. The sign warns of a slippery road (rain, oil).", "tip": "Car with \"snakes\" = slippery"}, "s34": {"q": "What does this sign mean?", "o": ["Lane reserved for buses or trolleybuses.", "Approaching a buses or trolleybuses stop.", "Road open to all vehicles except buses or trolleybuses."], "ex": "Blue circle = obligation. With a bus inside it means only buses and trolleybuses may use it (bus lane).", "tip": "Blue circle with bus = buses only"}, "w02": {"q": "By law, the maximum permitted weight is:", "o": ["The maximum weight the vehicle can carry.", "The maximum weight of the loaded vehicle, written as gross weight in its registration certificate.", "The maximum weight of load the vehicle may be loaded with."], "ex": "The maximum permitted weight is the whole loaded vehicle: vehicle + load + people. This number is written in the registration certificate as \"gross weight\".", "tip": "Max permitted = the gross weight in the registration"}, "w03": {"q": "By law, gross weight is:", "o": ["The maximum weight of load the vehicle has been loaded with.", "The maximum weight of the vehicle without the load.", "The actual weight at any time of the vehicle with load, crew and passengers."], "ex": "\"Gross\" means \"everything together\": the real weight right now, i.e. vehicle + load + driver + passengers.", "tip": "Gross = everything together, right now"}, "w04": {"q": "By law, the payload of a bus is:", "o": ["The maximum permitted weight minus the unladen weight.", "The unladen weight plus the load.", "The gross load minus the load."], "ex": "Unladen weight = the empty vehicle. Take the empty vehicle away from the maximum permitted weight and what is left is how much you can load. That is the payload.", "tip": "Payload = maximum − empty"}, "w05": {"q": "The maximum permitted load on the road from one steering axle (driven or not) for national transport is:", "o": ["7,500 kg.", "8,000 kg.", "7,000 kg."], "ex": "The steering axle is the front one, with the steering wheel. According to the book, for national transport it may press on the road with up to 7,000 kg.", "tip": "Steering (front) = 7 tonnes"}, "w06": {"q": "The maximum gross weight of a two-axle bus for national transport is:", "o": ["16,000 kg.", "19,000 kg.", "20,000 kg."], "ex": "Two-axle = 2 axles. According to the book's answer table, for national transport its gross weight may be up to 19,000 kg (19 tonnes).", "tip": "2 axles, national = 19 tonnes"}, "w07": {"q": "The maximum gross weight of a three-axle bus for national transport is:", "o": ["24,000 kg.", "26,000 kg.", "28,000 kg."], "ex": "Three axles can carry more than two. According to the book, the limit for national transport is 26,000 kg.", "tip": "3 axles, national = 26 tonnes"}, "w08": {"q": "The maximum length of an articulated bus is:", "o": ["15.00 m.", "16.00 m.", "18.75 m."], "ex": "An articulated bus has the \"accordion\" in the middle. Because it is two parts, it may be very long: up to 18.75 metres.", "tip": "Accordion bus = 18.75 m"}, "w10": {"q": "Under current rules, the maximum length of a bus for national or international transport is:", "o": ["11.5 m.", "13.5 m.", "12.5 m."], "ex": "A normal (non-articulated) two-axle bus may be up to 13.5 metres long.", "tip": "Normal bus = 13.5 m"}, "w11": {"q": "Under current rules, the maximum width of a bus for national transport is:", "o": ["2.50 m.", "2.55 m.", "2.60 m."], "ex": "The maximum width is 2.55 metres. 2.60 applies only to refrigerated lorries, not buses.", "tip": "Width = 2.55 m"}, "w12": {"q": "Under current rules, the maximum height of a bus for national or international transport is:", "o": ["3.80 m.", "4.00 m.", "4.20 m."], "ex": "The maximum height is 4 metres. A round number, easy to remember, and it protects you from bridges and tunnels.", "tip": "Height = 4 m"}, "w13": {"q": "Under current rules, the minimum height of a high-floor bus must exceed:", "o": ["3 m.", "3.20 m.", "3.50 m."], "ex": "A high-floor bus has a raised floor (e.g. a coach). According to the book it counts as high-floor when its height is over 3.20 m.", "tip": "High-floor = over 3.20 m"}, "w15": {"q": "The maximum permitted weight of a two-axle bus in international transport is:", "o": ["16,000 kg.", "18,000 kg.", "19,000 kg."], "ex": "For international transport the European limits apply, which are a bit stricter. Two-axle bus: up to 18,000 kg.", "tip": "2 axles, international = 18 tonnes"}, "w16": {"q": "The maximum weight of a three-axle bus with mechanical suspension in international transport is:", "o": ["25,000 kg.", "26,000 kg.", "28,000 kg."], "ex": "Three-axle bus, international transport, simple (mechanical) suspension: up to 25,000 kg. With air suspension or twin tyres a little more is allowed (26,000 kg).", "tip": "3 axles, mechanical suspension = 25 tonnes"}, "w17": {"q": "The maximum weight of a three-axle articulated bus in national transport is:", "o": ["28,000 kg.", "29,000 kg.", "32,000 kg."], "ex": "Articulated, 3 axles, national transport: according to the answer table up to 29,000 kg. For international transport the limit is 28,000 kg.", "tip": "Articulated, national = 29 tonnes"}, "w18": {"q": "The maximum weight of a three-axle articulated bus in international transport is:", "o": ["28,000 kg.", "29,000 kg.", "32,000 kg."], "ex": "Same bus as the previous question, but international transport: according to the answer table 28,000 kg, one tonne less than national.", "tip": "Articulated, international = 28 tonnes"}, "w19": {"q": "The maximum permitted weight of a single non-steering, non-driven axle on a bus is:", "o": ["10,000 kg.", "11,500 kg.", "13,000 kg."], "ex": "An axle that neither steers nor drives (it just \"carries\") may take up to 10,000 kg. A driven axle may take more.", "tip": "Simple axle = 10 tonnes"}, "w20": {"q": "The maximum weight of a three-axle bus in international transport, where each driven axle has twin tyres and no axle carries more than 9,500 kg, is:", "o": ["25,000 kg.", "26,000 kg.", "28,000 kg."], "ex": "With twin tyres the weight is spread better on the road. So 1 tonne more is allowed than for the simple three-axle bus: 26,000 kg instead of 25,000 kg.", "tip": "Twin tyres = +1 tonne (26)"}, "w21": {"q": "The maximum permitted road load from a pair of non-steering axles more than 1 m and no more than 2 m apart, for national transport, is:", "o": ["17,000 kg.", "20,000 kg.", "22,000 kg."], "ex": "Two axles very close together (1–2 m) work as a pair. According to the book, together they may press on the road with up to 20,000 kg for national transport.", "tip": "Axle pair = 20 tonnes"}, "w25": {"q": "The maximum permitted weight on the driven axle of a two-axle bus in national transport is:", "o": ["11,500 kg.", "12,000 kg.", "13,000 kg."], "ex": "The driven axle gets power from the engine (usually the rear one). For national transport up to 13,000 kg is allowed.", "tip": "Driven axle, national = 13 tonnes"}, "w26": {"q": "The maximum permitted weight on the driven axle of a two-axle bus in international transport is:", "o": ["12,000 kg.", "11,500 kg.", "13,000 kg."], "ex": "For international transport the lower European limit applies: 11,500 kg for the driven axle.", "tip": "Driven axle, international = 11.5 tonnes"}, "k04": {"q": "When a school bus stops to let pupils on or off, how are other drivers mainly warned?", "o": ["With the right indicator on.", "With the hazard warning lights on."], "ex": "Hazard lights (all indicators together) tell others \"careful, something is happening here\". The right indicator alone just means you are turning or pulling over.", "tip": "Children getting on/off = hazard lights"}, "k05": {"q": "A school bus on a road with two lanes has stopped to let pupils on or off. What must drivers going in the same direction do?", "o": ["Slow down and overtake the school bus carefully.", "Drive at up to the speed limit (50 km/h) and overtake the school bus carefully.", "Stop and wait until all pupils are on or off and, once the school bus moves off, continue."], "ex": "A child may suddenly run out in front of the bus. So vehicles behind stop and wait until the school bus moves off. They don't overtake.", "tip": "School bus stopped = you stop too"}, "k06": {"q": "To avoid annoying noise in traffic you should, among other things:", "o": ["Avoid sudden braking unless absolutely necessary.", "Use the horn as a warning only when waiting a long time.", "Use the horn to alert another driver only if they made a mistake against you."], "ex": "Sudden braking makes noise (squealing tyres). The horn is not for waiting or for \"punishing\" another driver, only to avoid danger.", "tip": "Quiet driving = no sudden braking"}, "k08": {"q": "Tyre grip on the road surface is reduced by:", "o": ["Oil or water on the road.", "Using a low gear.", "Frequent use of the brakes."], "ex": "Grip is how well the tyres \"hold\" the road. Oil and water make the road slippery, so the tyres hold less.", "tip": "Oil or water = slippery"}, "k09": {"q": "Tyre grip on the road is reduced by:", "o": ["Leaves on the road surface.", "High engine revs.", "Low vehicle speed."], "ex": "Leaves, especially wet ones, form a slippery layer between tyre and road. Engine revs and low speed don't reduce grip.", "tip": "Leaves on the road = like ice"}, "k10": {"q": "Aquaplaning results in:", "o": ["Tyre wear.", "Loss of steering control.", "Loss of engine power."], "ex": "Aquaplaning: at high speed in deep water the tyre \"floats\" on the water and doesn't touch the road. Then the steering doesn't turn the vehicle.", "tip": "Aquaplaning = steering doesn't respond"}, "k11": {"q": "Outside built-up areas, drivers must switch from main beam to dipped or fog lights:", "o": ["If there is a risk of dazzling drivers coming from the opposite direction.", "Half an hour before sunrise.", "When they are not keeping a safe distance."], "ex": "Main beam dazzles the oncoming driver. When a vehicle approaches, you dip your lights.", "tip": "Someone coming towards you = dipped lights"}, "k12": {"q": "The minimum total stopping distance of a vehicle:", "o": ["Doesn't depend on the condition of the tyres.", "Gets shorter if the tyre tread is worn.", "Gets shorter if the driver is more alert."], "ex": "Stopping distance = reaction distance + braking distance. An alert driver reacts faster, so stops sooner. Worn tyres make it longer.", "tip": "Alert driver = stops sooner"}, "k15": {"q": "The deceleration a vehicle achieves when braking is affected by:", "o": ["The type and condition of the road surface.", "The outside temperature.", "The air pressure."], "ex": "How fast the vehicle loses speed depends on how well the tyres grip. Dry asphalt grips well, gravel or wet road less.", "tip": "Braking depends on the road"}, "k16": {"q": "When braking in normal conditions, what does the braking distance mainly depend on?", "o": ["The speed of the vehicle.", "The type of braking system.", "How hard you press the brake pedal."], "ex": "Speed is the most important factor. Double the speed and the braking distance becomes about four times longer.", "tip": "Double speed = four times the braking"}, "k18": {"q": "When a vehicle turns left, which wheel travels further?", "o": ["The left one.", "The right one.", "Both the same."], "ex": "In a left turn the right wheel is on the outside of the curve. The outer circle is bigger, so the right wheel covers more distance.", "tip": "The outer wheel travels further"}, "k19": {"q": "When a car drives round a bend, which wheels follow the longer path?", "o": ["The outer wheels.", "The inner wheels.", "The rear wheels."], "ex": "Like on a running track: the athlete in the outer lane runs further. The outer wheels make the bigger circle.", "tip": "Outer circle = bigger"}, "k21": {"q": "Snow chains are fitted:", "o": ["On the wheels of the steering axle.", "On one wheel of the steering axle and the diagonally opposite wheel of the driven axle.", "On the wheels of the driven axle."], "ex": "Chains help the wheels that push the vehicle not to spin in the snow. Those are the wheels of the driven axle.", "tip": "Chains where the engine \"pushes\""}, "k22": {"q": "If the braking effect is not the same on all wheels, is there a danger for the vehicle?", "o": ["Only on roads with bends.", "Only on slippery roads.", "Always, because when braking the vehicle veers off course."], "ex": "If the brakes on one side grip harder, the vehicle pulls to that side when you brake. This always happens, even on a straight road.", "tip": "Uneven brakes = vehicle pulls sideways"}, "k23": {"q": "Why is it not allowed to drive with the engine off, especially with air brakes?", "o": ["Because the vehicle can't be steered.", "Because constant braking quickly wears the clutch.", "Because with constant braking you risk losing your brakes."], "ex": "Air brakes work with compressed air refilled by the engine's compressor. With the engine off it is not refilled. Each braking uses air, and in the end you have no brakes.", "tip": "Engine off = brake air runs out"}, "k24": {"q": "How can you most safely drive through a slippery stretch of road?", "o": ["By accelerating.", "By driving slowly and avoiding braking.", "By braking constantly."], "ex": "On a slippery road every sudden action (accelerating or braking) can make the wheels slide. Go slowly and smoothly.", "tip": "Slippery? Slow and no braking"}, "k25": {"q": "After washing the vehicle you notice the brakes slip when braking. What should you do?", "o": ["Drive the vehicle straight to a specialist garage.", "Press the brake pedal repeatedly while driving slowly.", "Use the handbrake instead of the foot brake."], "ex": "After washing, the brakes are wet and grip less. Pressing the brake lightly a few times while driving slowly warms and dries them.", "tip": "Wet brakes = press lightly to dry them"}, "k26": {"q": "When do you get the best braking (shortest braking distance)?", "o": ["When you press the brake pedal with full force.", "When you press the pedal just hard enough, depending on the road, that the wheels don't lock.", "When you press hard and release the pedal repeatedly."], "ex": "A rolling wheel grips better than a locked wheel that slides. So brake hard, but not so hard that the wheels lock.", "tip": "Hard, but without locking the wheels"}, "k28": {"q": "On motorways and expressways with three or more lanes, which lane(s) may buses use?", "o": ["The lane nearest the right edge.", "The two lanes nearest the right edge.", "All lanes, depending on traffic."], "ex": "With 3 or more lanes, the bus uses the two right-hand lanes. The left lane is kept for faster vehicles.", "tip": "3+ lanes: bus in the 2 right lanes"}, "k29": {"q": "On roads with two lanes in each direction, which lane(s) may buses use?", "o": ["Only the lane nearest the right edge.", "Both lanes.", "The right lane, and the left one only briefly in special cases (overtaking etc.)."], "ex": "With 2 lanes the bus keeps right. It goes into the left lane only briefly, e.g. to overtake, and then returns right.", "tip": "2 lanes: right, left only to overtake"}, "v01": {"q": "What is the maximum speed for buses on motorways, unless signs say otherwise?", "o": ["80 km/h.", "90 km/h.", "100 km/h."], "ex": "According to the book's answer table, buses may go up to 90 km/h on the motorway (the speed limiter is set at 100, but the limit is lower).", "tip": "Motorway = 90"}, "v07": {"q": "What is the maximum speed for buses on expressways, unless signs say otherwise?", "o": ["80 km/h.", "90 km/h.", "100 km/h."], "ex": "According to the answer table, on expressways the bus limit is also 90 km/h, the same as on motorways.", "tip": "Expressway = 90"}, "v06": {"q": "What is the maximum speed for buses outside motorways, expressways and built-up areas, unless signs say otherwise?", "o": ["80 km/h.", "90 km/h.", "100 km/h."], "ex": "On normal roads outside towns (not motorway or expressway) the bus goes up to 80 km/h. Order: 90 motorway and expressway, 80 country roads, 50 in town.", "tip": "Country roads = 80"}, "v05": {"q": "What is the maximum speed for buses in built-up areas, unless signs say otherwise?", "o": ["50 km/h.", "60 km/h.", "70 km/h."], "ex": "In built-up areas the town limit applies: 50 km/h, unless a sign shows otherwise.", "tip": "Town = 50"}, "v02": {"q": "If a city or intercity bus carries standing passengers, what is its maximum speed?", "o": ["50 km/h.", "60 km/h.", "70 km/h."], "ex": "Standing passengers can fall when you brake. So with standing passengers the bus doesn't go over 60 km/h.", "tip": "Standing passengers = 60"}, "v08": {"q": "What is the maximum speed for school buses outside built-up areas, unless signs say otherwise?", "o": ["50 km/h.", "60 km/h.", "70 km/h."], "ex": "School buses carry children, so they have a lower limit: up to 60 km/h outside towns.", "tip": "School bus = 60"}, "v03": {"q": "What is the maximum speed for buses with a light trailer outside built-up areas, unless signs say otherwise?", "o": ["70 km/h.", "80 km/h.", "90 km/h."], "ex": "With a trailer the vehicle brakes less easily. Outside towns the limit is 80 km/h.", "tip": "With trailer = 80"}, "v04": {"q": "What is the maximum speed for double-decker buses outside built-up areas, unless signs say otherwise?", "o": ["70 km/h.", "80 km/h.", "90 km/h."], "ex": "A double-decker is tall and affected by wind and bends. Outside towns it goes up to 80 km/h.", "tip": "Double-decker = 80"}, "v09": {"q": "What is the maximum speed for articulated buses outside built-up areas, unless signs say otherwise?", "o": ["70 km/h.", "80 km/h.", "90 km/h."], "ex": "An articulated (accordion) bus is very long and harder to control. It has the lowest limit: 70 km/h outside towns.", "tip": "Articulated = 70 (the slowest)"}, "p01": {"q": "If a driver is in a road accident and found to be under the influence of alcohol, will the insurance company pay all damage without claiming anything from them?", "o": ["No. It will pay compensation to third parties, but then claim it back from the driver.", "Yes. It will pay compensation with no consequence for the driver."], "ex": "The insurer pays the victims first so they are not left unpaid. But then it claims the money back from the drunk driver.", "tip": "Drunk = in the end you pay"}, "p02": {"q": "What additional penalties apply if someone drives without a valid licence and causes an accident with serious injury or death?", "o": ["Ban on getting a licence for at least 10 years.", "Ban on getting a licence for at least 15 years.", "Ban on getting a licence for at least 20 years."], "ex": "No licence plus a serious accident: they cannot get a licence for at least 10 years.", "tip": "No licence + accident = 10 years"}, "p03": {"q": "What additional penalties apply if someone drives without a valid licence?", "o": ["Ban on getting a licence for at least 3 years.", "Ban on getting a licence for at least 5 years.", "Ban on getting a licence for at least 10 years."], "ex": "If you drive without a licence (no accident), you can't get a licence for at least 3 years. With an accident it becomes 10.", "tip": "No licence = 3 years"}, "p07": {"q": "What administrative penalties apply if someone drives while their licence has been taken away?", "o": ["Ban on getting it back for at least 3 years.", "Ban on getting it back for at least 5 years.", "Ban on getting it back for at least 10 years."], "ex": "Same as \"no licence\": if you drive while your licence is suspended, you don't get it back for at least 3 years.", "tip": "Driving while suspended = 3 years"}, "p11": {"q": "What administrative penalties apply if someone drives while their licence has been taken away and causes an accident with serious injury or death?", "o": ["Ban on getting it back for 10 years.", "Ban on getting it back for 20 years.", "Up to a permanent ban on ever getting a licence again."], "ex": "The most serious case: the licence was already taken, they drove anyway and caused a serious accident. They can lose it forever.", "tip": "Worst case = forever"}, "p08": {"q": "What administrative penalties apply if a driver causes an accident with serious injury?", "o": ["Licence taken away for 1 month to 1 year.", "Licence taken away for 2 months to 3 years.", "Licence taken away for 3 months to 2 years."], "ex": "Serious injury: licence taken away for 3 months to 2 years. If someone dies, it is 2 to 5 years.", "tip": "Injury = 3 months to 2 years"}, "p09": {"q": "What administrative penalties apply if a driver causes an accident with a death?", "o": ["Licence taken away for 2 to 3 years.", "Licence taken away for 2 to 4 years.", "Licence taken away for 2 to 5 years."], "ex": "With a death the penalty is heavier than for injury: licence taken away for 2 to 5 years.", "tip": "Death = 2 to 5 years"}, "p05": {"q": "If a driver is breathalysed and found with a blood alcohol level of 0.5 to 0.8 grams per litre, what penalty applies?", "o": ["Fine of 100,000 drachmas.", "Fine of 50,000 drachmas.", "Fine of 50,000 drachmas and licence taken away for 1 month."], "ex": "The book is old and gives amounts in drachmas. According to the answer table, for 0.5 to 0.8 the penalty is a fine of 50,000 drachmas. From 0.8 up, losing the licence is added.", "tip": "0.5–0.8 = only a 50,000 fine"}, "p06": {"q": "If a driver is breathalysed and found with a blood alcohol level of 0.8 to 1.10 grams per litre, what penalties apply?", "o": ["Fine of 100,000 drachmas.", "Fine of 100,000 drachmas and licence taken away for 3 months.", "Fine of 200,000 drachmas and licence taken away for 1 month."], "ex": "The next step: for 0.8 to 1.10 the fine doubles (100,000 drachmas) and the licence is taken away for 3 months.", "tip": "0.8–1.10 = 100,000 + 3 months"}, "p04": {"q": "If a driver is breathalysed and found with a blood alcohol level of over 1.10 grams per litre, what penalties apply?", "o": ["Fine of 200,000 drachmas, at least 2 months in prison, licence taken away for 6 months, and number plates and registration taken away for 10 days to 6 months.", "Fine of 200,000 drachmas and licence taken away for 3 months.", "Licence taken away for 5 years."], "ex": "Over 1.10 is a criminal offence. So there is also prison, and the number plates are taken too. It is the longest answer.", "tip": "Over 1.10 = prison + everything"}, "p10": {"q": "What penalties apply if a driver is found over 1.10 grams per litre for the second time within two years (repeat offender), whatever the level the first time?", "o": ["Licence taken away for 5 years.", "Licence taken away for 3 years.", "Licence taken away for 2 years."], "ex": "Repeat offender means they did it again. Second time within 2 years with over 1.10: licence gone for 5 years.", "tip": "Drunk again = 5 years"}, "m10": {"q": "On a vehicle with air brakes, the time to fill the air tanks must not be longer than:", "o": ["Three (3) minutes to raise the pressure from 0 to 65% of maximum.", "There is no limit, as long as the tanks fill.", "Ten (10) minutes to raise the pressure from 0 to 65% of maximum."], "ex": "The air tanks are the brakes' air \"reservoirs\". They must fill quickly so you have brakes soon: up to 65% pressure within 3 minutes.", "tip": "Brake air: 3 minutes to 65%"}, "m26": {"q": "In what range is the lowest permitted compressed air pressure in an air brake system?", "o": ["About 5 - 6 bar.", "About 9 - 10 bar.", "About 14 - 15 bar."], "ex": "If the pressure drops below about 5–6 bar, the air brakes don't work properly. That's why the driver watches the gauges.", "tip": "Minimum air pressure = 5–6 bar"}, "m63": {"q": "On a bus with air brakes, what should the driver mainly watch?", "o": ["How the brakes act.", "The readings of the gauges on the dashboard.", "How the brake pedal gives way when pressed."], "ex": "With air brakes you don't feel the problem (too little air) in the pedal. You only see it on the dashboard gauges.", "tip": "Air brakes = watch the gauges"}, "m43": {"q": "Air brakes are used on buses because:", "o": ["Driving is more comfortable.", "Hydraulic brakes are not enough to slow the vehicle.", "External wear on the air brake pipes and parts is rare."], "ex": "A bus weighs many tonnes. Car-type hydraulic brakes don't have enough force to stop it. Compressed air gives much more force.", "tip": "Heavy vehicle = needs air"}, "m50": {"q": "The air compressor:", "o": ["Draws in air, compresses it and sends it to the air tanks.", "Draws in air and sends it to the suspension.", "Draws in air and sends it to the cooling system."], "ex": "The name says it: air compressor = compresses air. It puts it in the air tanks, where the brakes take it from.", "tip": "Compressor → air tanks"}, "m52": {"q": "The compressed-air brake servo is used:", "o": ["In a mechanical brake system.", "In a hydraulic-pneumatic brake system.", "In an electric brake system."], "ex": "The brake servo helps the driver press the brake with less force. With compressed air (pneumatic) it works together with a hydraulic system: a hydraulic-pneumatic system.", "tip": "Air servo = hydraulic + pneumatic"}, "m57": {"q": "The automatic load-sensing valve (ΑΡΠ) is a part of the brake system that:", "o": ["Automatically adjusts the pressure in the brake cylinders according to the vehicle's load.", "Produces the compressed air needed.", "Distributes air to more than one circuit."], "ex": "An empty bus needs less braking force than a full one. The valve adjusts the pressure by itself according to the load, so the wheels don't lock.", "tip": "ΑΡΠ = pressure according to load"}, "m62": {"q": "What is the purpose of the engine brake (exhaust brake)?", "o": ["Fuel economy.", "To use the foot brake less when driving downhill.", "To relieve the engine."], "ex": "The engine brake slows the vehicle using the engine. On descents you use it so the normal brakes don't overheat from constant use.", "tip": "Engine brake = downhill without burning the brakes"}, "m21": {"q": "The anti-lock braking system (ABS):", "o": ["Prevents the differential locking in bends.", "Prevents wheel spin when accelerating.", "Prevents the wheels locking when you brake (on a wet road)."], "ex": "ABS = anti-lock when braking. The wheels keep turning, so you can still steer.", "tip": "ABS = brake without locking the wheels"}, "m27": {"q": "In an air suspension system, what is the high-pressure circuit for?", "o": ["It adds air and raises the pressure in the air springs when the vehicle is loaded, to keep it at the same level.", "It keeps the pressure in the air springs always constant.", "It supplies air to the vehicle's servo systems."], "ex": "When passengers get on, the bus \"sinks\". The high-pressure circuit inflates the air springs more so the vehicle stays at the same height.", "tip": "More load = more air in the springs"}, "m54": {"q": "Shock absorbers are parts that:", "o": ["Make driving stable.", "Control and quickly damp the bouncing of the springs when the wheels hit bumps.", "Connect the chassis to the tyres."], "ex": "After a pothole the spring would bounce many times. The shock absorber stops this bouncing quickly.", "tip": "Shock absorber = stops the bouncing"}, "m48": {"q": "Hydraulic power steering is used on buses to:", "o": ["Reduce the effect of the driver's muscle force when steering.", "Increase the effect of the driver's muscle force when steering.", "Improve tyre grip on the road."], "ex": "It multiplies the force you apply, so you can turn the steering wheel of a heavy bus easily.", "tip": "Power steering = more force, less effort"}, "m35": {"q": "On the tyre 175/70 R 15 87T, the number 15 means:", "o": ["The outer diameter of the tyre in inches.", "The rim diameter in inches.", "The tread height in inches."], "ex": "The number after R is the rim size in inches. 175 is the width in mm and 70 the sidewall height as a percentage.", "tip": "R 15 = 15-inch rim"}, "m68": {"q": "How many outside rear-view mirrors must a bus have at least?", "o": ["Two (2).", "Three (3).", "Four (4)."], "ex": "The minimum is two outside mirrors, one on the left and one on the right.", "tip": "Mirrors = 2 (left + right)"}, "m66": {"q": "How many interior lighting circuits must a bus have at least?", "o": ["One (1).", "Two (2).", "Three (3)."], "ex": "There are at least two circuits. So if one fails, the passengers are not left in the dark.", "tip": "Lighting = 2 circuits (for safety)"}, "m70": {"q": "The emergency switch every bus has, to limit the risk of fire when the vehicle is stopped, cuts off:", "o": ["The fuel supply.", "The emergency interior lighting circuit.", "The central electronic door locking circuit."], "ex": "Fire needs fuel. The emergency switch cuts the fuel supply so the fire isn't fed. Emergency lights and doors must keep working.", "tip": "Fire? Cut the fuel"}, "m67": {"q": "What does the oil gauge on the bus dashboard show?", "o": ["The oil pressure in the hydraulic brakes.", "The engine oil pressure.", "The amount of oil in the sump."], "ex": "A gauge (manometer) measures pressure. The dashboard one shows engine oil pressure. You check the amount with the dipstick.", "tip": "Gauge = pressure, not amount"}, "m16": {"q": "On a bus rev counter with yellow, green and red zones, where should the needle be for good engine performance and low fuel use?", "o": ["In the yellow.", "In the green.", "In the red."], "ex": "Like a traffic light: green = all good. In the green zone the engine runs economically and efficiently.", "tip": "Green = economy"}, "m17": {"q": "On some bus rev counters there are yellow, green and red zones. Where is the needle when fuel use is excessive compared to the engine power produced?", "o": ["In the yellow.", "In the green.", "In the red."], "ex": "Red = high revs. The engine burns a lot of fuel without giving matching power and can be damaged.", "tip": "Red = waste"}, "m14": {"q": "What does the primary shaft in the gearbox do?", "o": ["It receives the drive from the engine through the clutch.", "It passes the drive to the driven wheels through the propeller shaft and joints.", "It takes the drive from the propeller shaft and passes it to the secondary shaft."], "ex": "Primary = first. It is the gearbox's first shaft and takes the drive from the engine through the clutch.", "tip": "Primary = first, from the engine"}, "m18": {"q": "What does the layshaft (auxiliary shaft) in the gearbox do?", "o": ["It receives the drive from the engine through the clutch.", "It passes the drive to the driven wheels through the propeller shaft and joints.", "It takes the drive from the primary shaft and passes it to the secondary shaft."], "ex": "The layshaft is in the middle: it takes the drive from the primary shaft and gives it to the secondary shaft, through the gears.", "tip": "Layshaft = the one in between"}, "m32": {"q": "In a fully synchronised gearbox:", "o": ["All gears change synchronised.", "All gears change synchronised except first.", "All gears change synchronised except reverse."], "ex": "Even in a \"fully\" synchronised gearbox, reverse usually has no synchroniser. That's why you only engage it when the vehicle has stopped.", "tip": "Fully synchronised… except reverse"}, "m38": {"q": "With the engine at the front and the driven wheels at the rear, what is the propeller shaft for?", "o": ["To pass the drive to the front wheels.", "To pass the drive from the differential to the gearbox.", "To pass the torque from the gearbox to the driven wheels."], "ex": "The engine is at the front, the driving wheels at the back. The propeller shaft (cardan) is the long shaft that brings the drive from the gearbox back to the wheels.", "tip": "Propeller shaft = gearbox to rear wheels"}, "m69": {"q": "What is the basic job of the differential?", "o": ["To let one driven wheel turn at a different speed from the other.", "To make the driven wheels turn faster than the propeller shaft.", "To change the direction of drive by 40 degrees."], "ex": "In a bend the outer wheel must turn more than the inner one. The differential lets the two wheels turn at different speeds.", "tip": "Differential = different speeds left and right"}, "m33": {"q": "How do the pistons pass the pressure from the combustion to the crankshaft?", "o": ["Through the camshaft.", "Through the valve tappets.", "Through the connecting rods."], "ex": "The combustion pushes the piston down. The connecting rod joins the piston to the crankshaft and turns the up-and-down into rotation.", "tip": "Piston → connecting rod → crankshaft"}, "m34": {"q": "The connecting rod's purpose is:", "o": ["To pass the piston's kinetic energy to the crankshaft.", "To open and close the intake and exhaust valves.", "To connect the piston to the camshaft."], "ex": "Same idea as the previous question: the connecting rod is the \"bridge\" from piston to crankshaft. The valves are moved by the camshaft.", "tip": "Connecting rod = piston → crankshaft"}, "m64": {"q": "Which of these parts are driven by the camshaft?", "o": ["The crankshaft.", "The fan.", "The intake and exhaust valves."], "ex": "The camshaft has \"cams\" (bumps) that press the valves and open them at the right moment.", "tip": "Camshaft → valves"}, "m45": {"q": "In a four-stroke diesel engine, when the crankshaft turns twice, how many times does the camshaft turn?", "o": ["Once.", "Twice.", "Four times."], "ex": "In a four-stroke engine each valve opens once every two crankshaft turns. So the camshaft turns at half speed: 2 crankshaft turns = 1 camshaft turn.", "tip": "Camshaft = half the turns"}, "m41": {"q": "The piston compression rings are there:", "o": ["So that combustion gases don't escape into the crankcase.", "So that lubricating oil doesn't reach the combustion chamber.", "To lubricate the piston and cylinder surfaces."], "ex": "The compression rings \"seal\" the piston so the combustion gases stay above and don't escape below.", "tip": "Compression rings = keep the gases above"}, "m53": {"q": "The oil rings are there:", "o": ["To lubricate the distributor.", "So that lubricating oil doesn't reach the combustion chamber.", "So that combustion gases don't escape into the crankcase."], "ex": "The opposite of the compression rings: the oil rings keep the oil below, so it doesn't rise and burn.", "tip": "Oil rings = keep the oil below"}, "m37": {"q": "What does a four-stroke diesel engine draw in during the intake stroke?", "o": ["A mixture of diesel and air.", "Diesel only.", "Air only."], "ex": "A diesel engine takes in only air and compresses it a lot so it gets hot. The diesel is then injected and ignites by itself.", "tip": "Diesel intake = air only"}, "m73": {"q": "Why does a diesel engine produce more power when you press the accelerator?", "o": ["Because the intake valve opens wider.", "Because more diesel reaches the fuel injectors.", "Because a stronger current reaches the spark plugs."], "ex": "In a diesel, the accelerator controls how much diesel is injected. More diesel = more power. Only petrol engines have spark plugs.", "tip": "Diesel accelerator = more diesel"}, "m30": {"q": "Carbon monoxide (CO) is a pollutant found mainly in the exhaust of a:", "o": ["Diesel vehicle.", "Petrol vehicle.", "Electric vehicle."], "ex": "CO comes mainly from petrol. Electric vehicles have no exhaust. The typical diesel pollutant is SO2 (sulphur).", "tip": "CO = petrol, SO2 = diesel"}, "m36": {"q": "Sulphur dioxide (SO2) is a pollutant found in the exhaust of a:", "o": ["Petrol vehicle.", "Diesel vehicle.", "LPG vehicle."], "ex": "Diesel contains sulphur. When it burns, sulphur dioxide (SO2) comes out.", "tip": "Sulphur (S) = diesel"}, "m40": {"q": "The oxidation catalyst on buses:", "o": ["Helps the exhaust gases get out.", "Reduces the pollutants coming out of the exhaust.", "Increases engine power."], "ex": "The catalyst \"cleans\" the exhaust gases before they leave the exhaust, so they pollute less.", "tip": "Catalyst = fewer pollutants"}, "m78": {"q": "What does the exhaust silencer do?", "o": ["Slows the exhaust gases to reduce noise.", "Slows the exhaust gases to reduce fuel use.", "Slows the exhaust gases to heat the inside of the vehicle."], "ex": "Silencer = makes it quiet. It reduces the noise of the exhaust.", "tip": "Silencer = silence"}, "m46": {"q": "The centrifugal water pump of the cooling system is driven:", "o": ["By the crankshaft through a belt.", "By the camshaft through special gears.", "By the camshaft through a belt."], "ex": "The water pump turns by a belt driven by the crankshaft, like the fan and the alternator.", "tip": "Water pump = crankshaft + belt"}, "m58": {"q": "The centrifugal water pump of the engine cooling system:", "o": ["Draws coolant from the top tank of the radiator and sends it by natural flow to the engine's water jackets.", "Draws coolant from the bottom tank of the radiator and sends it under pressure to the engine's water jackets.", "With the help of the thermostat draws in coolant and sends it to the water jackets."], "ex": "The water cools as it runs down through the radiator. The pump takes the cool water from the bottom and pushes it under pressure into the engine.", "tip": "Pump: cool water from the bottom, under pressure"}, "m65": {"q": "What is the normal flow of water in the cooling system?", "o": ["Radiator - water jackets - water pump - thermostat - radiator.", "Radiator - thermostat - water jackets - water pump - radiator.", "Radiator - water pump - water jackets - thermostat - radiator."], "ex": "Follow the water: from the radiator the pump takes it, sends it into the engine (water jackets), it leaves hot through the thermostat and returns to the radiator.", "tip": "Radiator → pump → engine → thermostat → radiator"}, "m47": {"q": "In today's engines, the rubbing surfaces are lubricated:", "o": ["By spraying oil.", "By forced circulation of oil.", "By a mixed system."], "ex": "In today's engines an oil pump pushes (forces) the oil under pressure to all the points that rub.", "tip": "Lubrication = pump under pressure"}, "e01": {"q": "The engine runs at a low temperature. What could be the likely cause?", "o": ["A faulty thermostat.", "No power to the fan.", "A small radiator capacity."], "ex": "The thermostat is a \"door\" for the water. If it sticks open, the water always goes to the radiator and the engine never gets warm enough. The other two causes would make it overheat.", "tip": "Engine too cold = thermostat"}, "e04": {"q": "To ensure road safety and avoid accidents it is necessary, among other things:", "o": ["To replace bulbs with more powerful ones for a longer life.", "To clean the light lenses often.", "To check the spare bulbs regularly."], "ex": "Dirty lights shine much less. Simply cleaning them is the most important thing. Never fit bulbs other than those the manufacturer specifies.", "tip": "Clean lights = good visibility"}, "e08": {"q": "To achieve road safety and avoid accidents it is necessary, among other things:", "o": ["To replace bulbs with higher-voltage ones to improve the lights.", "To leave the light glass dusty to stop it fading.", "To check the indicators regularly."], "ex": "Indicators tell others what you will do. If they don't work, nobody knows you are turning. So you check them regularly. The other two answers are bad practice.", "tip": "Check the indicators"}, "e12": {"q": "The minimum tread depth for tyres on bus driven axles is:", "o": ["1.6 mm.", "1.5 mm.", "2 mm."], "ex": "The tread is the tyre's pattern. If it gets thinner than 1.6 mm, the tyre can't clear water and slides. It must be replaced.", "tip": "Tread at least 1.6 mm"}, "e13": {"q": "What does it mean if the oil warning light comes on while driving?", "o": ["The alternator isn't charging the battery.", "Lubrication is normal.", "The oil pressure is too low."], "ex": "The oil light comes on when oil pressure is too low. The engine is at risk: stop safely and check. The battery has a different light.", "tip": "Oil light = low pressure, stop"}, "e14": {"q": "What should you check regularly to reduce fuel use?", "o": ["The engine coolant level.", "The tyre tread depth.", "The tyre pressure."], "ex": "Under-inflated tyres \"stick\" to the road and the vehicle needs more power to move. So it burns more fuel.", "tip": "Right tyre pressure = less fuel"}, "e17": {"q": "What causes brake drums to overheat?", "o": ["A faulty differential.", "Wrong tyre pressure.", "Faulty return springs on the brake shoes."], "ex": "The return springs pull the brake shoes back when you release the brake. If they don't work, the shoes rub all the time and the drum gets hot.", "tip": "Hot drum = shoes don't return"}, "e19": {"q": "How often should the driver check the engine oil level?", "o": ["Before a long journey.", "Every day.", "When the oil pressure warning light comes on."], "ex": "A professional driver checks the oil every day. If you wait for the light, it's already too late.", "tip": "Oil = every day"}, "e20": {"q": "When the starter motor won't work, what is the likely cause?", "o": ["The belt has broken.", "There is no current between the battery and the starter.", "The multiplier isn't working properly."], "ex": "The starter is an electric motor powered by the battery. If the current doesn't get there, the starter doesn't turn.", "tip": "Dead starter = no current"}, "e23": {"q": "When a diesel engine gives off too much black smoke, what should you do?", "o": ["Change the engine oil.", "Repair the engine immediately.", "Check and adjust the fuel pump and injectors and clean the air filter."], "ex": "Black smoke means too much diesel and too little air. You adjust the injectors (less diesel) and clean the air filter (more air).", "tip": "Black smoke = injectors + air filter"}, "e26": {"q": "Your bus's diesel engine starts but stops after a few turns. What could be the cause?", "o": ["Low cylinder compression.", "A blocked fuel supply system.", "Wrong internal timing of the injection pump."], "ex": "The engine starts, but then \"starves\" and stops. Fuel isn't getting through because something is blocked (e.g. the fuel filter).", "tip": "Starts then stops = fuel blocked"}, "e28": {"q": "When the fuel system is well adjusted, what causes blue smoke from a diesel engine?", "o": ["The driver uses a high gear.", "The engine timing is wrong.", "The engine burns a lot of oil."], "ex": "Blue smoke = oil is burning. Smoke colours: black = too much fuel, blue = oil, white = water.", "tip": "Blue = oil"}, "e32": {"q": "If your tyres have higher pressure than normal, where will they wear more?", "o": ["On the sides of the tread.", "In the middle (centre) of the tread.", "Only on the inner side of the tread."], "ex": "An over-inflated tyre bulges in the middle and runs mainly on its centre, so it wears there. Low pressure wears the sides.", "tip": "Too much air = wear in the middle"}, "e35": {"q": "You find that an air tank of the air brake system has a hole. What should you do?", "o": ["Have it repaired by welding.", "Isolate it from the rest of the circuit.", "Have it replaced immediately."], "ex": "The air tank holds high-pressure air and is part of the brakes. You don't weld it or take it out of the circuit: you replace it immediately.", "tip": "Leaking air tank = new one"}, "e37": {"q": "You notice white smoke in a diesel engine's exhaust. What is the likely cause?", "o": ["Water has got into the cylinders.", "The diesel engine has overheated.", "High oil consumption."], "ex": "White smoke is steam: water got into the cylinders and turned to steam. Remember: white = water, blue = oil, black = fuel.", "tip": "White = water"}, "e38": {"q": "Worn shock absorbers cause:", "o": ["Less body roll in bends.", "Abnormal vehicle behaviour, especially in bends.", "Abnormal engine running."], "ex": "Without good shock absorbers the vehicle bounces and leans a lot, especially in bends. The tyres lose contact with the road. They have nothing to do with the engine.", "tip": "Bad shock absorbers = bad cornering"}, "e39": {"q": "The purpose of the antifreeze pump in an air brake system is:", "o": ["To keep the system pressure constant.", "To supply compressed air to keep the upper and lower working pressures in the air tanks constant.", "To spray antifreeze into the compressed air so parts don't freeze in very low temperatures."], "ex": "Anti-freeze = against ice. The air contains moisture that can freeze inside the valves in winter. The pump sprays antifreeze so they don't freeze.", "tip": "Antifreeze = so it doesn't freeze"}, "e40": {"q": "For road safety it is useful:", "o": ["To inflate tyres below the pressure the manufacturer recommends.", "To check tyre pressure before the journey.", "To drive with main beam on."], "ex": "Before every journey you check the tyre pressure. Wrong pressure means worse braking and a risk of a burst tyre.", "tip": "Before the journey: tyre pressure"}, "e42": {"q": "Grip between tyres and road is affected by:", "o": ["High engine revs.", "The outside temperature.", "The quality and pressure of the tyres."], "ex": "How well the tyre \"holds\" the road depends on the tyre itself: its quality and the right pressure.", "tip": "Grip = tyre quality + pressure"}, "e43": {"q": "What happens when the kingpin inclination is not correct?", "o": ["The steering won't return normally and the steering won't be stable.", "The steering system will wear early.", "You can't turn the vehicle easily."], "ex": "This angle makes the steering wheel return straight by itself after a turn and keeps the vehicle stable. If it's wrong, the wheel doesn't return and the vehicle \"wanders\".", "tip": "Wrong angle = wheel doesn't return straight"}, "t01": {"q": "If the tachograph breaks down, what must the driver do?", "o": ["Inform the vehicle owner.", "Have it repaired quickly and report it to the nearest police station.", "Repair it when they can."], "ex": "The tachograph is compulsory. If it breaks, it must be repaired quickly and you report it to the police, so it's clear you didn't break it on purpose.", "tip": "Broken tachograph = police + quick repair"}, "t02": {"q": "How long must tachograph record sheets (discs/tapes) be kept after use?", "o": ["6 months.", "12 months.", "24 months."], "ex": "Tachograph discs are kept for 12 months (one year). The vehicle owner keeps them.", "tip": "Discs = 1 year"}, "t16": {"q": "Who must keep the bus's tachograph record sheets (discs/tapes) for one year?", "o": ["The vehicle owner.", "The local police.", "The vehicle's driver."], "ex": "The owner (the company) keeps the discs for a year so checks can be made. The driver only carries the recent ones.", "tip": "The owner keeps them"}, "t17": {"q": "Besides the tachograph key, the bus driver must carry and show on request the speed record sheets of:", "o": ["The previous day.", "The previous five (5) days.", "The previous fifteen (15) days."], "ex": "According to the book, the driver carries the discs of the previous 15 days to show at a check.", "tip": "With you: 15 days"}, "t14": {"q": "Before the record sheet (disc or tape) goes into the tachograph, the driver must:", "o": ["Fill in the details required by the tachograph rules.", "Put it in without filling anything in.", "Write only their name on it."], "ex": "Before inserting the disc you write all the details the law asks for (name, date, place, kilometres, plate). Otherwise the disc proves nothing.", "tip": "Fill it in first, then insert"}, "t15": {"q": "The tachograph must be running:", "o": ["The whole 24 hours without a break.", "For 10 hours.", "For 15 hours."], "ex": "The tachograph records both driving and rest. So it runs all 24 hours, without a break.", "tip": "Tachograph = 24 hours"}, "t13": {"q": "The speed limiter fitted to buses under Directive 92/6/EEC limits their speed to:", "o": ["90 km/h.", "100 km/h.", "110 km/h."], "ex": "The bus speed limiter is set at 100 km/h. The bus cannot go faster.", "tip": "Limiter = 100"}, "t05": {"q": "The speed limiter on the bus acts on:", "o": ["The brake system.", "The fuel supply system.", "The exhaust system."], "ex": "The limiter doesn't brake. It simply cuts the fuel when you reach 100 km/h, so the bus doesn't speed up any more.", "tip": "Limiter = cuts fuel"}, "t06": {"q": "The driver of a bus fitted with a speed limiter:", "o": ["May not raise the limiter's speed, temporarily or permanently.", "May raise the limiter's speed temporarily.", "May raise the limiter's speed permanently."], "ex": "The limiter is never tampered with: not for a while and not forever.", "tip": "Don't touch the limiter"}, "t04": {"q": "The registration certificate of a bus with a speed limiter must contain the note:", "o": ["\"Fitted with a speed limiter\".", "\"Fitted with a speed limiter. Allows speeds above 100 km/h\".", "\"Fitted with a speed limiter. Maximum speed 100 km/h\"."], "ex": "The registration says both that there is a limiter and at what speed: 100 km/h. It is the most complete answer.", "tip": "Registration: limiter + 100 km/h"}, "t07": {"q": "The driver of a bus with a speed limiter must always carry, among other things, this document about the system:", "o": ["A certificate from the dealer or the authorised workshop that fitted it.", "The system's technical manual (brochure).", "The system's guarantee."], "ex": "At a check you must prove the limiter was fitted correctly. The certificate from the workshop that fitted it shows this.", "tip": "Limiter: workshop certificate"}, "t08": {"q": "Must buses with a speed limiter also have a tachograph?", "o": ["No.", "They may have one optionally.", "Yes."], "ex": "The limiter and the tachograph do different jobs. The limiter limits speed, the tachograph records the hours. Both are needed.", "tip": "Limiter AND tachograph"}, "t09": {"q": "Must city buses have a speed limiter under Directive 92/6/EEC?", "o": ["No.", "Yes."], "ex": "City buses drive in town and never get close to 100 km/h. So the directive doesn't require them to have a limiter.", "tip": "City bus = no limiter needed"}, "t10": {"q": "Buses must have a speed limiter under Directive 92/6/EEC if they were first registered in an EU country after:", "o": ["1 January 1984.", "1 January 1985.", "1 January 1988."], "ex": "Buses registered after 1 January 1988 must have a speed limiter.", "tip": "Limiter for buses after 1988"}, "t11": {"q": "Must buses that by design cannot exceed 100 km/h be fitted with a speed limiter?", "o": ["Yes.", "No."], "ex": "The limiter is there so the bus doesn't go over 100 km/h. If the bus can't go faster by design, it doesn't need one.", "tip": "Can't reach 100? No limiter needed"}, "t12": {"q": "Why was the speed limiter made compulsory on buses?", "o": ["To improve the bus's road behaviour.", "For passenger comfort.", "For environmental and road safety reasons."], "ex": "Lower speed means fewer accidents (safety) and less fuel and pollution (environment).", "tip": "Limiter = safety + environment"}, "a01": {"q": "For how many hours in a row may a bus be parked on streets in built-up areas?", "o": ["Up to 12 hours.", "Up to 24 hours.", "As long as the owner or driver wants."], "ex": "A bus in town may stay parked on the street for at most 24 hours in a row.", "tip": "Parking in town: up to 24 hours"}, "a02": {"q": "Because parked buses in built-up areas stick out above other vehicles and block pedestrians' view, should parking on streets be avoided?", "o": ["Yes.", "No."], "ex": "A big bus hides pedestrians, especially children, from drivers. So it is better not to park on town streets.", "tip": "The bus hides pedestrians"}, "a03": {"q": "When a bus breaks down on a country road, how far away must the driver place the warning triangle?", "o": ["At least 20 m.", "At least 50 m.", "At least 100 m."], "ex": "The book's answer table gives 50 m on country roads. The triangle must be far enough for others to slow down in time.", "tip": "Country road: triangle at 50 m"}, "a05": {"q": "After four and a half hours of continuous driving, how long is the bus driver's rest break?", "o": ["Ten minutes.", "Thirty minutes.", "Forty-five minutes."], "ex": "After 4.5 hours of driving comes a 45-minute break. The numbers look alike: 4 and a half hours → 45 minutes.", "tip": "4.5 hours → 45 minutes"}, "a25": {"q": "The continuous driving time of a bus driver is:", "o": ["5 hours 30 minutes.", "4 hours 30 minutes.", "3 hours 30 minutes."], "ex": "Without a break the driver may drive up to 4 hours 30 minutes. Then they must stop for 45 minutes.", "tip": "Continuous driving: up to 4.5 hours"}, "a22": {"q": "How many hours at least must a bus driver's daily rest (24-hour period) last?", "o": ["11 hours.", "14 hours.", "15 hours."], "ex": "In every 24 hours the driver must rest at least 11 hours.", "tip": "Daily rest = 11 hours"}, "a23": {"q": "How many times a week may a bus driver drive 10 hours a day?", "o": ["Once (1).", "Twice (2).", "Three times (3)."], "ex": "Normally you drive up to 9 hours a day. Twice a week 10 hours are allowed.", "tip": "10 hours: only twice a week"}, "a24": {"q": "What is the maximum number of working hours for a bus driver over two weeks?", "o": ["80 hours.", "90 hours.", "100 hours."], "ex": "In two weeks in a row the driver may drive at most 90 hours.", "tip": "2 weeks = 90 hours"}, "a07": {"q": "Every bus must carry two (2) dry powder fire extinguishers (or another material approved by the Fire Service with the same capacity), each with a net weight of:", "o": ["6 kg.", "8 kg.", "10 kg."], "ex": "The book's answer table gives 6 kg for each extinguisher. Two extinguishers, so there's still one if the first runs out.", "tip": "2 extinguishers × 6 kg"}, "a08": {"q": "Seat belts for passengers are compulsory:", "o": ["On staff transport buses.", "On coaches.", "On school buses."], "ex": "School buses carry children, who need the most protection. So there, seat belts for passengers are compulsory.", "tip": "School buses = belts for all children"}, "a09": {"q": "On coaches, who must wear a seat belt?", "o": ["The driver and the tour guide.", "The passengers.", "The tour guide."], "ex": "According to the book's answer table, the correct answer is the tour guide. The guide usually sits at the front, in the most dangerous seat.", "tip": "Coach: the guide wears a belt"}, "a10": {"q": "If you change the outside colour of your vehicle:", "o": ["You must report it to the office that issued the vehicle's registration.", "You have no obligation, as long as you repaint the markings the vehicle must carry.", "Whether you must report it depends on the vehicle's maximum gross load."], "ex": "The colour is written in the registration certificate. If you change it, you must report it to the office that issued the registration.", "tip": "New colour = report it"}, "a11": {"q": "If the vehicle's front number plate breaks in two, you must:", "o": ["Fix the two pieces together.", "Go to the transport office for a replacement.", "Buy and fit a spare plate."], "ex": "Number plates are only issued by the transport office. You don't glue them or buy them elsewhere.", "tip": "Broken plate = transport office"}, "a12": {"q": "When driving, fog lights:", "o": ["Are not allowed in tunnels.", "Are compulsory in thick fog, both in towns and outside.", "Are compulsory even during the day when overtaking a military convoy."], "ex": "Fog lights go on when there is thick fog, in and outside town.", "tip": "Thick fog = fog lights everywhere"}, "a13": {"q": "Seat belts:", "o": ["Are the only safety systems provided in cars.", "Are of little use in traffic.", "Must be of an approved type and always kept in good condition."], "ex": "Seat belts only save lives if they are approved and in good condition. The other two answers are obviously wrong.", "tip": "Belts: approved + in good condition"}, "a14": {"q": "Buses must be checked and given an Exhaust Emissions Card:", "o": ["Every 6 months.", "Every year.", "Every two years."], "ex": "Buses drive many kilometres, so their exhaust is checked often: every 6 months.", "tip": "Emissions card = every 6 months"}, "a21": {"q": "A bus must be inspected at the KTEO (MOT):", "o": ["Every 6 months.", "Every year.", "Every two years."], "ex": "The bus goes to the KTEO every year. Don't confuse it with the emissions card, which is every 6 months.", "tip": "KTEO = every year"}, "a16": {"q": "How often is a D or D+E driving licence renewed?", "o": ["Every three (3) years.", "Every five (5) years.", "Every five (5) years up to age 65 and every three (3) years after 65."], "ex": "Up to 65 the licence is renewed every 5 years. After 65 more often, every 3 years, because the driver's health is checked.", "tip": "5 years, after 65 every 3"}, "a17": {"q": "When may city or intercity buses carry standing passengers?", "o": ["When it is stated in the bus's registration.", "When the bus manufacturer allows it.", "When there are enough handholds on the roof and in the aisle to support them."], "ex": "A standing passenger must have something to hold on to. Without enough handholds, no standing passengers.", "tip": "Standing = needs handholds"}, "a18": {"q": "May city buses carry standing passengers? If so, how many?", "o": ["Yes, as many as fit in the bus.", "Yes, as many as stated in the bus's registration.", "Yes, as many as there are seated passengers."], "ex": "The number of standing passengers is written in the registration certificate. Not \"as many as fit\".", "tip": "How many standing? What the registration says"}, "a19": {"q": "Children under 6 may travel on city or intercity buses when:", "o": ["They sit behind another passenger seat.", "They are with another person looking after them and sit together on a passenger seat that has another seat in front of it.", "They wear a seat belt."], "ex": "A young child needs someone with them and must sit in a seat with another seat in front (for protection). It is the most complete answer.", "tip": "Child under 6 = companion + seat in front"}, "a20": {"q": "What is the maximum number (as a percentage) of standing passengers compared to seated ones on an intercity bus?", "o": ["25%.", "30%.", "50%."], "ex": "The book's answer table gives 25%: at most 1 standing passenger for every 4 seated. Intercity buses go faster, so few standing.", "tip": "Intercity: standing up to 25%"}}, "de": {"s01": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Fahrstreifen nur für Busse oder Oberleitungsbusse.", "Ende des Fahrstreifens für Busse oder Oberleitungsbusse.", "Verbot der Einfahrt für Busse oder Oberleitungsbusse."], "ex": "Ein blauer Kreis bedeutet ein Gebot (hier: ein Fahrstreifen nur für Busse). Ein roter Schrägstrich über einem blauen Schild bedeutet immer „Ende“. Also: Der Busfahrstreifen endet hier.", "tip": "Blau + roter Strich = ENDE"}, "s02": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Verbot für Pkw.", "Verbot für alle Fahrzeuge außer Pkw.", "Verbot für Kraftfahrzeuge außer zweirädrigen Motorrädern."], "ex": "Ein roter Kreis bedeutet ein Verbot. Das Auto von vorne steht für alle Kraftfahrzeuge, auch Busse. Nur zweirädrige Motorräder dürfen fahren.", "tip": "Roter Kreis mit Auto: keine Kfz außer Motorräder"}, "s03": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Vorrang vor dem Gegenverkehr.", "Dem Gegenverkehr Vorrang gewähren, weil die Straße enger wird.", "Warnung vor Gegenverkehr."], "ex": "Die Straße wird eng und zwei Fahrzeuge passen nicht nebeneinander. Auf diesem runden Schild (Verbot) ist der rote Pfeil deiner: Du musst warten und den Gegenverkehr zuerst fahren lassen.", "tip": "Rundes Schild = du wartest. Blaues Quadrat = du fährst zuerst"}, "s04": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Vorrang vor dem Gegenverkehr.", "Dem Gegenverkehr Vorrang gewähren.", "Warnung vor Gegenverkehr."], "ex": "Das Gegenteil vom vorigen Schild. Ein blaues Quadrat gibt eine Information. Dein weißer Pfeil ist groß, der rote des Gegenverkehrs klein: An der Engstelle fährst du zuerst.", "tip": "Blaues Quadrat = du hast Vorrang"}, "s05": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Vorrang vor dem Gegenverkehr.", "Dem Gegenverkehr Vorrang gewähren.", "Warnung vor Gegenverkehr."], "ex": "Ein Dreieck warnt vor einer Gefahr. Zwei Pfeile in entgegengesetzte Richtungen warnen dich: Vorne wird die Straße zweispurig, es kommt dir Verkehr entgegen.", "tip": "Dreieck mit zwei Pfeilen = Gegenverkehr voraus"}, "s06": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Kraftfahrstraße.", "Autobahn.", "Pkw erlaubt."], "ex": "Ein blaues Quadrat mit weißem Auto = Kraftfahrstraße. Nicht mit der Autobahn verwechseln: Die hat ein grünes Schild mit einer Brücke.", "tip": "Blau mit Auto = Kraftfahrstraße. Grün mit Brücke = Autobahn"}, "s07": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Verbot für Pkw.", "Ende der Autobahn.", "Ende der Kraftfahrstraße."], "ex": "Es ist das Schild der Kraftfahrstraße (blau mit Auto) mit einem roten Schrägstrich. Der Strich bedeutet „Ende“.", "tip": "Blaues Auto + Strich = Ende Kraftfahrstraße"}, "s08": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Kraftfahrstraße.", "Autobahn.", "Sackgasse."], "ex": "Ein grünes Schild mit einer Straße und einer Brücke darüber = Autobahn. In Griechenland sind Autobahnschilder grün.", "tip": "Grün + Brücke = Autobahn"}, "s09": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Ende der Kraftfahrstraße.", "Ende der Sackgasse.", "Ende der Autobahn."], "ex": "Das grüne Autobahnschild mit rotem Schrägstrich bedeutet: Die Autobahn endet.", "tip": "Grün + Strich = Ende Autobahn"}, "s10": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Verbot für Fußgänger.", "Fußgängerüberweg.", "Fußgängerunterführung."], "ex": "Ein blaues Quadrat gibt eine Information. Die Person auf den weißen Streifen zeigt einen Fußgängerüberweg (Zebrastreifen). Ein Verbot wäre ein roter Kreis.", "tip": "Blau mit Person auf Streifen = Zebrastreifen"}, "s11": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Nummerierung von Nationalstraßen.", "Nummerierung internationaler Straßen.", "Kilometerangabe."], "ex": "Blaue Zahlen in Schildform (8, 67) sind Nummern von Nationalstraßen.", "tip": "Blaues Schild mit Zahl = Nationalstraße"}, "s12": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Nummerierung von Nationalstraßen.", "Nummerierung internationaler Straßen.", "Kilometerangabe."], "ex": "Das „E“ vor der Zahl bedeutet Europastraße (international). Internationale Straßen haben ein grünes Schild.", "tip": "E = Europa = international"}, "s13": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Nummerierung von Nationalstraßen.", "Nummerierung internationaler Straßen.", "Kilometerangabe."], "ex": "„Χμ / Km“ bedeutet Kilometer. Das Schild zeigt, bei welchem Kilometer der Straße du bist.", "tip": "Χμ/Km = Kilometerstein"}, "s14": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Pfeilwegweiser zu einem Ort.", "Warnung vor vorgeschriebener Fahrtrichtung.", "Pfeilwegweiser zu einem Ort von großem touristischem oder archäologischem Interesse."], "ex": "Das Schild hat Pfeilform und nennt nur einen Ort (Piräus, 9 km). Es zeigt also die Richtung zu einem Ort.", "tip": "Ein Name auf dem Pfeil = ein Ort"}, "s15": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Pfeilwegweiser zu mehr als einem Ort.", "Warnung vor vorgeschriebener Fahrtrichtung.", "Pfeilwegweiser zu einem Ort von großem touristischem oder archäologischem Interesse."], "ex": "Derselbe Pfeil, aber jetzt mit zwei Zielen (Flughafen und Piräus). Also: Richtung zu mehr als einem Ort.", "tip": "Mehrere Namen auf dem Pfeil = mehrere Orte"}, "s16": {"q": "Was bedeutet dieses Verkehrszeichen?", "o": ["Mindestgeschwindigkeit je Fahrstreifen.", "Höchstgeschwindigkeit je Fahrstreifen.", "Allgemeine Geschwindigkeitsgrenzen."], "ex": "Jeder Fahrstreifen hat sein eigenes Limit. Eine Zahl im roten Kreis bedeutet immer ein Maximum (nicht schneller fahren).", "tip": "Roter Kreis = BIS zu dieser Geschwin
