let view="home",L=null,X=null,examTick=null;
const busy=()=>(view==="learn"&&L&&!L.done)||(view==="exam"&&X&&!X.done);
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-v]");if(!b)return;go(b.dataset.v)});
function go(v){if(v!=="exam"&&X&&!X.done){clearInterval(examTick);X=null}if(v!=="learn")L=null;if(v!=="exam"&&X&&X.done)X=null;view=v;render();scrollTo(0,0)}
function render(){
  document.documentElement.lang=LNG();
  document.body.classList.toggle("focus",(view==="learn"&&L&&!L.done)||(view==="exam"&&X&&!X.done));
  document.querySelectorAll("#tabs button").forEach(b=>{b.classList.toggle("on",b.dataset.v===view);const s=b.querySelector("span");if(s)s.textContent=u("tab_"+b.dataset.v)});
  const el=$("#app");
  if(view==="home")el.innerHTML=homeHTML();
  else if(view==="learn")el.innerHTML=L?learnHTML():learnMenuHTML();
  else if(view==="exam")el.innerHTML=X?examHTML():examMenuHTML();
  else el.innerHTML=statsHTML();
}
document.getElementById("app").addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;ACT[b.dataset.act](b.dataset.arg,b)});
function langSeg(){return `<div class="seg lang" role="group" aria-label="${u("langH")}">${[["el","ΕΛ"],["en","EN"],["de","DE"]].map(([k,l])=>`<button class="${LNG()===k?"on":""}" data-act="lang" data-arg="${k}" aria-pressed="${LNG()===k}">${l}</button>`).join("")}</div>`}

/* ---------- Αρχική ---------- */
function ring(n,goal){const r=34,c=2*Math.PI*r,p=Math.min(1,n/goal);
  return `<svg class="ring" width="84" height="84" viewBox="0 0 84 84" role="img" aria-label="${u("ringAria",n,goal)}"><circle class="track" cx="42" cy="42" r="${r}"/><circle class="val" cx="42" cy="42" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 42 42)"/><text x="42" y="49" text-anchor="middle">${Math.min(n,goal)}</text></svg>`}
function homeHTML(){
  const st=streakNow(),tn=todayN(),done=tn>=S.goal,due=dueCount(),nw=newCount(),wk=weakList().length;
  let big=st>0?`${flame}${st} ${st===1?u("day1"):u("days")}`:u("startToday");
  let sub=st===0?u("sub0",S.goal):done?u("subDone"):u("subKeep");
  const lvl=level(),xpIn=S.xp%100;
  return `
  <div class="topbar"><div class="brand"><span class="logo">${EIRINI}</span>Στάση Δ</div>${langSeg()}</div>
  <section class="dedi"><span class="pic">${EIRINI}</span><div><b>${u("dedi")}</b><span>${u("dediSub")}</span></div></section>
  <section class="sign" aria-label="${u("streakAria")}"><div class="route"><span>${u("route")}</span><span>${u("routeR")}</span></div><div class="big">${big}</div><p class="sub">${sub}</p></section>
  <section class="card goal">${ring(tn,S.goal)}<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
    <div class="eyebrow">${u("goalDay")}</div><h3>${done?u("goalDone"):u("goalLeft",S.goal-tn)}</h3>
    <p class="small muted">${u("levelLine",lvl,xpIn)}</p><div class="xpbar"><i style="width:${xpIn}%"></i></div></div></section>
  <button class="btn primary" data-act="startLearn" data-arg="mix">${due>0?u("btnDue",due):nw>0?u("btnCont"):u("btnPractice")}</button>
  <div class="stats">
    <div class="stat"><b>${mastered()}</b><span>${u("stMastered")}</span></div>
    <div class="stat"><b>${Q.length-nw}</b><span>${u("stSeen",Q.length)}</span></div>
    <div class="stat"><b>${S.xp}</b><span>${u("stXp")}</span></div>
  </div>
  <div class="list">
    ${wk?`<button class="tile" data-act="startLearn" data-arg="weak"><span class="ic" style="color:var(--bad)">!</span><span class="tx"><b>${u("myMistakes")}</b><span>${u("myMistakesSub")}</span></span><span class="pill bad">${wk}</span></button>`:""}
    <button class="tile" data-act="startExam"><span class="ic">${EXAM.max>Q.length?Q.length:EXAM.max}</span><span class="tx"><b>${u("examTile")}</b><span>${u("examTileSub",EXAM.max,EXAM.maxErr)}</span></span></button>
  </div>
  <p class="note">${u("note",Q.length)}</p>${syncHTML()}`}

/* ---------- Μάθηση ---------- */
function learnMenuHTML(){
  const rows=Object.keys(CATS).map(k=>{const qs=Q.filter(q=>q.cat===k),m=qs.filter(q=>boxOf(q.id)>=4).length;
    return `<button class="tile" data-act="startLearn" data-arg="cat:${k}"><span class="ic">${m}/${qs.length}</span><span class="tx"><b>${esc(catName(k))}</b><span>${u("nQ",qs.length)}</span></span></button>`}).join("");
  const wk=weakList().length;
  return `<h2>${u("learnH")}</h2><p class="muted">${u("learnIntro")}</p>
  <button class="btn primary" data-act="startLearn" data-arg="mix">${u("smart")}</button>
  ${wk?`<button class="btn ghost" data-act="startLearn" data-arg="weak">${u("onlyMistakes",wk)}</button>`:""}
  <div class="eyebrow">${u("byCat")}</div><div class="list">${rows}</div>`}
function buildQueue(mode,n=10){
  const now=Date.now();let pool=Q;
  if(mode.startsWith("cat:"))pool=Q.filter(q=>q.cat===mode.slice(4));
  if(mode==="weak")return shuffle(weakList()).slice(0,n);
  const due=shuffle(pool.filter(q=>{const c=S.cards[q.id];return c&&c.due<=now})).sort((a,b)=>boxOf(a.id)-boxOf(b.id));
  const fresh=pool.filter(q=>!S.cards[q.id]);
  const rest=pool.filter(q=>{const c=S.cards[q.id];return c&&c.due>now}).sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due);
  return [...due,...fresh,...rest].slice(0,n);
}
ACT={};
ACT.lang=k=>{if(!UI[k])return;LANG=k;render()};
ACT.startLearn=mode=>{const q=buildQueue(mode);if(!q.length){toast(u("noQ"));return}
  L={queue:q.map(x=>({q:x,order:shuffle(x.o.map((_,i)=>i)),rep:0})),i:0,ok:0,bad:0,xp:0,combo:0,answered:null,goalHit:false,done:false,total:q.length,start:Date.now(),lastT:Date.now(),time:0};view="learn";render();scrollTo(0,0)};
function learnHTML(){
  if(L.done)return learnDoneHTML();
  const it=L.queue[L.i],q=QL(it.q),b=boxOf(q.id),ans=L.answered,LET=letters();
  const pct=Math.round(L.i/L.queue.length*100);
  const opts=it.order.map((oi,k)=>{let cls="opt";if(ans){if(oi===q.a)cls+=" right";else if(oi===ans.pick)cls+=" wrong"}
    return `<button class="${cls}" data-act="pick" data-arg="${oi}" ${ans?"disabled":""}><span class="k">${LET[k]}</span><span class="t">${esc(q.o[oi])}</span></button>`}).join("");
  let fb="";
  if(ans){const ok=ans.pick===q.a,ck=it.order.indexOf(q.a);
    fb=`<section class="fb ${ok?"ok":"bad"}" aria-live="polite">${ans.cheer?`<div class="cheer">${esc(ans.cheer)}</div>`:""}<h3>${ok?pickPraise():ans.wh}</h3>
      ${ok?`<p class="small">+${ans.gain} XP${L.combo>=3?` · ${u("inRow",L.combo)}`:""}</p>`:`<p class="small">${u("wrongLine",LET[ck],esc(q.o[q.a]))}</p>`}
      ${q.tip?`<div class="tipbox"><span class="ai">${u("tip")}</span><b>${esc(q.tip)}</b></div>`:""}
      <div class="why"><span class="ai">${u("why")}</span><p>${esc(q.ex)}</p></div>
      ${q.cf?`<p class="small muted">${u("cf")}</p>`:""}
      <button class="btn ${ok?"primary":"amber"}" data-act="next" id="nextBtn">${u("cont")}</button></section>`}
  return `<div class="qhead"><button class="x" data-act="quitLearn" aria-label="${u("exit")}">×</button><div class="prog"><i style="width:${pct}%"></i></div><span class="combo">${L.combo>=2?"×"+L.combo:""}</span></div>
  <div class="qmeta"><span class="pill">${esc(catName(q.cat))} · ${q.n}</span>${!S.cards[q.id]?`<span class="pill ok">${u("newPill")}</span>`:`<span class="boxes" title="${u("boxTitle",b)}">${[1,2,3,4,5].map(i=>`<i class="${i<=b?"on":""}"></i>`).join("")}</span>`}</div>
  ${q.img?`<img class="sign-img" src="${IMG[q.img]}" alt="${u("signAlt")}">`:""}<p class="qtext">${esc(q.q)}</p><div class="opts" id="opts">${opts}</div>${fb}`}
let praiseIdx=0;const pickPraise=()=>{const P=u("praise");return P[praiseIdx%P.length]};
ACT.pick=v=>{if(L.answered)return;const it=L.queue[L.i],q=it.q,pick=+v,ok=pick===q.a;
  const c=S.cards[q.id]||{box:0,due:0,seen:0,ok:0,bad:0};
  c.seen++;if(ok){c.ok++;c.box=Math.min(5,c.box+1)}else{c.bad++;c.box=1}
  c.due=Date.now()+IV[c.box];c.last=Date.now();S.cards[q.id]=c;
  let gain=0;
  if(ok){L.ok++;L.combo++;gain=10+(L.combo%5===0?5:0);S.bestCombo=Math.max(S.bestCombo,L.combo);praiseIdx++}
  else{L.bad++;L.combo=0;gain=2;if(it.rep<2){L.queue.splice(Math.min(L.queue.length,L.i+4),0,{q,order:shuffle(q.o.map((_,i)=>i)),rep:it.rep+1})}}
  S.xp+=gain;L.xp+=gain;
  const nowT=Date.now(),dt=Math.max(0,Math.min(nowT-L.lastT,180000));addTime(dt);L.time+=dt;L.lastT=nowT;
  const t=dk();S.days[t]=(S.days[t]||0)+1;
  let cheer="";
  if(ok&&L.combo===3)cheer=pickU("c3");
  else if(ok&&L.combo===5)cheer=pickU("c5");
  else if(ok&&L.combo===10)cheer=pickU("c10");
  else if(ok&&c.box===4&&c.ok>=3)cheer=pickU("cMast");
  if(S.days[t]%10===0)cheer=(cheer?cheer+" ":"")+pickU("cDay",S.days[t]);
  if(S.days[t]>=S.goal&&S.streak.last!==t){S.streak.count=S.streak.last===yday()?S.streak.count+1:1;S.streak.last=t;S.streak.best=Math.max(S.streak.best,S.streak.count);L.goalHit=true}
  L.answered={pick,gain,cheer,wh:pickU("wrongH")};checkBadges();save();render();
  if(cheer&&(L.combo===5||L.combo===10||S.days[t]%10===0))confetti();
  if(!ok){const o=$("#opts");o&&o.classList.add("shake")}
  const nb=$("#nextBtn");nb&&nb.scrollIntoView({block:"nearest",behavior:"smooth"});
};
ACT.next=()=>{L.answered=null;L.i++;if(L.i>=L.queue.length){L.done=true;L.praiseN=null;if(L.goalHit)confetti()}render();scrollTo(0,0)};
ACT.quitLearn=()=>{L=null;view="home";render()};
function learnDoneHTML(){const tot=L.ok+L.bad,p=tot?Math.round(L.ok/tot*100):0,st=streakNow();
  if(L.praiseN==null)L.praiseN=Math.random()*3|0;
  const arr=u(p>=90?"p90":p>=70?"p70":"pLow"),praise=arr[L.praiseN%arr.length];
  return `<section class="result card"><div class="eyebrow">${u("endRound")}</div><div class="score">${p}%</div><p><b>${praise}</b></p><p>${u("summary",L.ok,L.bad,L.xp,fmtDur(L.time))}</p>
  ${L.goalHit?`<div class="sign" style="width:100%"><div class="route"><span>${u("goalHead")}</span><span>✓</span></div><div class="big" style="font-size:1.8rem">${flame}${st} ${st===1?u("day1"):u("days")}</div></div>`
   :todayN()<S.goal?`<p class="muted small">${u("moreGoal",S.goal-todayN())}</p>`:""}
  </section><button class="btn primary" data-act="startLearn" data-arg="mix">${u("another")}</button><button class="btn ghost" data-act="quitLearn">${u("home")}</button>`}

/* ---------- Εξέταση ---------- */
function examMenuHTML(){const n=Math.min(EXAM.max,Q.length),last=S.exams.slice(-5).reverse();
  return `<h2>${u("examH")}</h2><p class="muted">${u("examIntro",n,EXAM.maxErr)}</p>
    <button class="btn primary" data-act="startExam">${u("startExam")}</button>
    ${last.length?`<div class="eyebrow">${u("lastTries")}</div><div class="list">${last.map(e=>`<div class="tile"><span class="ic">${e.score}</span><span class="tx"><b>${u("correctN",e.score,e.total)}</b><span>${new Date(e.date).toLocaleDateString(LOC())}</span></span><span class="pill ${e.passed?"ok":"bad"}">${e.passed?u("pass"):u("fail")}</span></div>`).join("")}</div>`:""}`}
ACT.startExam=()=>{const qs=shuffle(Q).slice(0,EXAM.max);
  X={qs:qs.map(q=>({q,order:shuffle(q.o.map((_,i)=>i)),pick:null})),i:0,start:Date.now(),done:false};
  view="exam";render();scrollTo(0,0)};
function examHTML(){
  if(X.done)return examDoneHTML();
  const it=X.qs[X.i],q=QL(it.q),last=X.i===X.qs.length-1,LET=letters();
  return `<div class="qhead"><button class="x" data-act="quitExam" aria-label="${u("exit")}">×</button><div class="prog"><i style="width:${Math.round(X.i/X.qs.length*100)}%;background:var(--blue)"></i></div><span class="combo" style="color:var(--muted)">${X.i+1}/${X.qs.length}</span></div>
  <div class="qmeta"><span class="pill">${u("qOf",X.i+1,X.qs.length)}</span></div>
  ${q.img?`<img class="sign-img" src="${IMG[q.img]}" alt="${u("signAlt")}">`:""}<p class="qtext">${esc(q.q)}</p>
  <div class="opts">${it.order.map((oi,k)=>`<button class="opt ${it.pick===oi?"sel":""}" data-act="examPick" data-arg="${oi}"><span class="k">${LET[k]}</span><span class="t">${esc(q.o[oi])}</span></button>`).join("")}</div>
  <div class="row"><button class="btn ghost" data-act="examPrev" ${X.i===0?"disabled":""}>${u("back")}</button><button class="btn primary" data-act="examNext" ${it.pick===null?"disabled":""}>${last?u("submit"):u("next")}</button></div>`}
ACT.examPick=v=>{X.qs[X.i].pick=+v;render()};
ACT.examPrev=()=>{if(X.i>0){X.i--;render()}};
ACT.examNext=()=>{if(X.i<X.qs.length-1){X.i++;render();scrollTo(0,0)}else finishExam()};
ACT.quitExam=()=>{clearInterval(examTick);X=null;view="exam";render()};
function finishExam(){clearInterval(examTick);if(!X||X.done)return;
  const score=X.qs.filter(x=>x.pick===x.q.a).length,err=X.qs.length-score,passed=err<=EXAM.maxErr;
  X.done=true;X.res={score,err,passed};addTime(Math.min(Date.now()-X.start,X.qs.length*180000));
  for(const x of X.qs){if(x.pick!==x.q.a){const c=S.cards[x.q.id]||{box:0,due:0,seen:0,ok:0,bad:0};c.bad++;c.seen++;c.box=1;c.due=Date.now()+IV[1];S.cards[x.q.id]=c}}
  S.xp+=score*5;S.exams.push({date:Date.now(),score,total:X.qs.length,err,passed});if(S.exams.length>50)S.exams.shift();
  checkBadges();save();if(passed)confetti();render();scrollTo(0,0)}
function examDoneHTML(){const r=X.res;
  const wrong=X.qs.filter(x=>x.pick!==x.q.a);
  return `<section class="result card"><div class="eyebrow">${u("result")}</div><div class="score" style="color:var(${r.passed?"--ok":"--bad"})">${r.score}/${X.qs.length}</div>
  <h3>${r.passed?(r.err===0?u("perfect"):u("passed")):u("failed")}</h3><p class="muted small">${u("errLine",r.err,EXAM.maxErr,wrong.length>0)}</p></section>
  ${wrong.length?`<div class="eyebrow">${u("review")}</div>${wrong.map(x=>{const q=QL(x.q);return `<section class="card" style="display:flex;flex-direction:column;gap:8px">${q.img?`<img class="sign-img" style="width:110px" src="${IMG[q.img]}" alt="${u("signAlt")}">`:""}<p style="font-weight:600">${esc(q.q)}</p>
    ${x.pick!==null?`<p class="small" style="color:var(--bad)">${u("yourAns")}${esc(q.o[x.pick])}</p>`:`<p class="small" style="color:var(--bad)">${u("noAns")}</p>`}
    <p class="small" style="color:var(--ok)">${u("correct")}${esc(q.o[q.a])}</p><div class="why" style="background:var(--sunk)"><span class="ai">${u("why")}</span><p>${esc(q.ex)}</p></div></section>`}).join("")}`:""}
  <button class="btn primary" data-act="startExam">${u("newExam")}</button>${wrong.length?`<button class="btn ghost" data-act="startLearn" data-arg="weak">${u("practiceMistakes")}</button>`:""}`}

/* ---------- Πρόοδος ---------- */
function statsHTML(){
  const nw=newCount(),ms=mastered(),lr=Q.length-nw-ms,T=Q.length;
  const cats=Object.keys(CATS).map(k=>{const qs=Q.filter(q=>q.cat===k),m=qs.filter(q=>boxOf(q.id)>=4).length,l=qs.filter(q=>{const b=boxOf(q.id);return S.cards[q.id]&&b<4}).length;
    return `<div class="catrow"><div class="top"><span>${esc(catName(k))}</span><span class="muted">${m}/${qs.length}</span></div><div class="stack" style="height:10px"><i style="width:${m/qs.length*100}%;background:var(--ok)"></i><i style="width:${l/qs.length*100}%;background:var(--amber)"></i></div></div>`}).join("");
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push({k:dk(d),l:d.toLocaleDateString(LOC(),{weekday:"short"}),n:S.days[dk(d)]||0})}
  const mx=Math.max(S.goal,...days.map(d=>d.n)),W=320,Hh=130,bw=28,gap=(W-20-bw*7)/6;
  const goalY=110-S.goal/mx*90;
  const bars=days.map((d,i)=>{const h=d.n/mx*90,x=10+i*(bw+gap);return `<rect class="bar ${i===6?"today":""}" x="${x}" y="${110-h}" width="${bw}" height="${h}" rx="4"/><text x="${x+bw/2}" y="126" text-anchor="middle">${esc(d.l)}</text>${d.n?`<text x="${x+bw/2}" y="${104-h}" text-anchor="middle">${d.n}</text>`:""}`}).join("");
  const chart=`<svg class="chart" viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="${u("chartAria")}">${bars}<line class="base" x1="0" x2="${W}" y1="110.5" y2="110.5"/><line x1="0" x2="${W}" y1="${goalY}" y2="${goalY}" stroke="var(--ok)" stroke-dasharray="4 4"/></svg>`;
  const seen=Q.length-nw,ans=Object.values(S.cards).reduce((a,c)=>a+c.seen,0),okc=Object.values(S.cards).reduce((a,c)=>a+c.ok,0);
  const pct=ans?Math.round(okc/ans*100):0,pr=Math.round(ms/T*100);
  return `<h2>${u("statsH")}</h2>
  <div class="stats">
    <div class="stat"><b>${seen}</b><span>${u("seenOf",T)}</span></div>
    <div class="stat"><b>${fmtDur(S.timeMs)}</b><span>${u("timeLbl",fmtDur((S.dayTime||{})[dk()]))}</span></div>
    <div class="stat"><b>${pct}%</b><span>${u("pctLbl",ans)}</span></div>
  </div>
  <section class="card" style="display:flex;flex-direction:column;gap:6px"><div class="eyebrow">${u("ready")}</div><div style="display:flex;align-items:baseline;gap:8px"><b style="font-family:var(--display);font-size:2rem">${pr}%</b><span class="muted small">${u("ofMastered")}</span></div><div class="xpbar" style="height:12px"><i style="width:${pr}%;background:var(--ok)"></i></div><p class="small muted">${u("readyMsg",pr)}</p></section>
  <section class="card" style="display:flex;flex-direction:column;gap:10px"><div class="eyebrow">${u("allQ",T)}</div>
    <div class="stack"><i style="width:${ms/T*100}%;background:var(--ok)"></i><i style="width:${lr/T*100}%;background:var(--amber)"></i></div>
    <div class="legend"><span style="--c:var(--ok)">${u("lgM",ms)}</span><span style="--c:var(--amber)">${u("lgL",lr)}</span><span style="--c:var(--sunk)">${u("lgN",nw)}</span></div></section>
  <section class="card" style="display:flex;flex-direction:column;gap:12px"><div class="eyebrow">${u("byCat")}</div>${cats}</section>
  <section class="card" style="display:flex;flex-direction:column;gap:6px"><div class="eyebrow">${u("last7")}</div>${chart}<p class="small muted">${u("chartNote",S.streak.best)}</p></section>
  <div class="eyebrow">${u("badgesH")}</div>
  <div class="badges">${BADGES.map(b=>`<div class="badge ${S.badges[b.id]?"got":""}"><span class="m">${b.m}</span><span><b>${bt(b.id)[0]}</b><span>${bt(b.id)[1]}</span></span></div>`).join("")}</div>
  <section class="card" style="display:flex;flex-direction:column;gap:10px"><div class="eyebrow">${u("langH")}</div>${langSeg()}</section>
  <section class="card" style="display:flex;flex-direction:column;gap:10px"><div class="eyebrow">${u("goalDay")}</div>
    <div class="seg">${[5,10,20,30].map(g=>`<button class="${S.goal===g?"on":""}" data-act="goal" data-arg="${g}">${g}</button>`).join("")}</div>
    <p class="small muted">${u("goalSub")}</p>
    <button class="danger" data-act="reset" id="resetBtn">${resetArm?u("resetArm"):u("reset")}</button></section>`}
let resetArm=false;
ACT.goal=g=>{S.goal=+g;save();render()};
ACT.reset=()=>{if(!resetArm){resetArm=true;render();setTimeout(()=>{resetArm=false;if(view==="stats")render()},4000);return}
  resetArm=false;const lg=S.lang;S=blank();S.lang=lg;save();toast(u("resetDone"));render()};

/* ---------- Πληκτρολόγιο ---------- */
document.addEventListener("keydown",e=>{
  if(view==="learn"&&L&&!L.done){
    if(!L.answered&&/^[1-6]$/.test(e.key)){const it=L.queue[L.i],oi=it.order[+e.key-1];if(oi!==undefined)ACT.pick(oi)}
    else if(L.answered&&e.key==="Enter"){e.preventDefault();ACT.next()}}
  if(view==="exam"&&X&&!X.done){
    if(/^[1-6]$/.test(e.key)){const oi=X.qs[X.i].order[+e.key-1];if(oi!==undefined)ACT.examPick(oi)}
    else if(e.key==="Enter"&&X.qs[X.i].pick!==null){e.preventDefault();ACT.examNext()}}
});

/* ---------- Κομφετί ---------- */
function confetti(){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=$("#fx"),cx=cv.getContext("2d"),W=cv.width=innerWidth,Hh=cv.height=innerHeight;
  const cols=["#F2A900","#0B4FA8","#17894C","#C8352F","#4F93FF","#E8456B"];
  const P=Array.from({length:120},()=>({x:W/2,y:Hh*0.35,vx:(Math.random()-.5)*12,vy:Math.random()*-12-4,s:Math.random()*6+4,c:cols[Math.random()*6|0],r:Math.random()*6}));
  let f=0;(function step(){cx.clearRect(0,0,W,Hh);for(const p of P){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()}
    if(++f<110)requestAnimationFrame(step);else cx.clearRect(0,0,W,Hh)})()}

render();
